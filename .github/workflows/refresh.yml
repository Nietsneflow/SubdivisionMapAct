name: Refresh statute text

on:
  schedule:
    # Daily at 09:17 UTC (~1-2am Pacific). Most amendments take effect
    # January 1, but urgency statutes land year-round; a daily check
    # surfaces them in the change log within a day.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape current text from leginfo
        run: python scrape.py

      - name: Log statute changes vs previous data
        run: python changelog.py

      - name: Rebuild pages
        run: python build.py

      - name: Commit and push
        # Commit when statute text actually changed (changelog.py touched
        # changelog.json). Date-only runs commit just once a month, on the
        # 2nd, so the retrieval date stays fresh without daily commit noise.
        run: |
          if ! git diff --quiet -- changelog.json; then
            msg="Refresh from leginfo: statute changes (see changes.html)"
          elif [ "$(date -u +%d)" = "02" ]; then
            msg="Refresh from leginfo: no statute changes, retrieval date updated"
          else
            echo "No statute changes; next date-only commit on the 2nd"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$msg"
          git push
