name: Refresh statute text

on:
  schedule:
    # Daily at 09:17 UTC (~1-2am Pacific). The text comes from the
    # Legislature's bulk data export, which it rebuilds weekly (Sunday
    # night); checking daily picks each new export up within a day, so
    # statute changes reach the change log within about a week.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A clean run takes ~1 min; scrape.py's retries can wait out an outage
    # of the export server for a while, but not hold a runner indefinitely.
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PDF builder (used by export.py for title7.pdf)
        run: pip install "fpdf2>=2.8,<3"

      - name: Fetch current text from the Legislature's data export
        run: python scrape.py

      - name: Log statute changes vs previous data
        run: python changelog.py

      - name: Rebuild pages
        run: python build.py

      - name: Commit and push
        # Commit when statute text actually changed (changelog.py touched
        # changelog.json). Date-only runs commit just once a month, on the
        # 2nd, so the retrieval date stays fresh without daily commit noise.
        run: |
          if ! git diff --quiet -- changelog.json; then
            msg="Refresh from leginfo: statute changes (see changes.html)"
          elif [ "$(date -u +%d)" = "02" ]; then
            msg="Refresh from leginfo: no statute changes, retrieval date updated"
          else
            echo "No statute changes; next date-only commit on the 2nd"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$msg"
          git push
