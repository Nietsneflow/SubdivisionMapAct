(b) (1) The subdivider, any tenant of the subject property, in the case of a conversion of residential real property to a condominium project, community apartment project, or stock cooperative project, or the advisory agency may appeal from the action of the appeal board to the legislative body. The appeal\nshall be filed in writing with the clerk of the legislative body within 10 days after the action of the appeal board from which the appeal is being taken.\n(2) After the filing of an appeal, the legislative body shall set the matter for hearing. The hearing shall be held within 45 days after the date of the request filed by the subdivider or the appellant. If there is no regular meeting of the legislative body within the next 45 days for which notice can be given pursuant to Section 66451.3, the appeal may be heard at the next regular meeting for which notice can be given, or within 60 days from the date of the receipt of the request, whichever period is shorter. Within 10 days following the conclusion of the hearing, the legislative body shall render its decision on the appeal.\n(c) (1) If there is an appeal board and it fails to act upon an appeal within the\ntime limit specified in this chapter, the decision from which the appeal was taken shall be deemed affirmed and an appeal therefrom may thereupon be taken to the legislative body as provided in subdivision (b) of this section. If no further appeal is taken, the tentative map, insofar as it complies with applicable requirements of this division and any local ordinance, shall be deemed approved or conditionally approved as last approved or conditionally approved by the advisory agency, and it shall be the duty of the clerk of the legislative body to certify or state that approval, or if the advisory agency is one that is not authorized by local ordinance to approve, conditionally approve, or disapprove the tentative map, the advisory agency shall submit its report to the legislative body as if no appeal had been taken.\n(2) If the legislative body fails to act upon an appeal within the time limit specified in this chapter, the tentative map,\ninsofar as it complies with applicable requirements of this division and any local ordinance, shall be deemed to be approved or conditionally approved as last approved or conditionally approved, and it shall be the duty of the clerk of the legislative body to certify or state that approval.\n(d) (1) Any interested person adversely affected by a decision of the advisory agency or appeal board may file an appeal with the legislative body concerning any decision of the advisory agency or appeal board. The appeal shall be filed with the clerk of the legislative body within 10 days after the action of the advisory agency or appeal board that is the subject of the appeal. Upon the filing of the appeal, the legislative body shall set the matter for hearing. The hearing shall be held within 45 days after the date of a request filed by the subdivider or the appellant. If there is no regular meeting of the legislative body within the\nnext 45 days for which notice can be given pursuant to Section 66451.3, the appeal may be heard at the next regular meeting for which notice can be given, or within 60 days from the date of the receipt of the request, whichever period is shorter. The hearing may be a public hearing for which notice shall be given in the time and manner provided.\n(2) Upon conclusion of the hearing, the legislative body shall, within 10 days, declare its findings based upon the testimony and documents produced before it or before the advisory board or the appeal board. The legislative body may sustain, modify, reject, or overrule any recommendations or rulings of the advisory board or the appeal board and may make any findings that are not inconsistent with the provisions of this chapter or any local ordinance adopted pursuant to this chapter.\n(e) Each decision made pursuant to this section shall be\nsupported by findings that are consistent with the provisions of this division and any local ordinance adopted pursuant to this division.\n(f) Notice of each hearing provided for in this section shall be sent by United States mail to each tenant of the subject property, in the case of a conversion of residential real property to a condominium project, community apartment project, or stock cooperative project, at least three days prior to the hearing. The notice requirement of this subdivision shall be deemed satisfied if the notice complies with the legal requirements for service by mail. Pursuant to Section 66451.2, fees may be collected from the subdivider or from persons appealing or filing an appeal for expenses incurred under this section.","history":"Amended by Stats. 2021, Ch. 106, Sec. 4.   (SB 414)   Effective January 1, 2022."},{"num":"66452.6","text":"(a) (1) An approved or conditionally approved tentative map shall expire 24 months after its approval or conditional approval, or after any additional period of time as may be prescribed by local ordinance, not to exceed an additional 24 months. However, if the subdivider is required to expend two hundred thirty-six thousand seven hundred ninety dollars ($236,790) or more to construct, improve, or finance the construction or improvement of public improvements outside the property boundaries of the tentative map, excluding improvements of public rights-of-way that abut the boundary of the property to be subdivided and that are reasonably related to the development of that property, each filing of a final map\nauthorized by Section 66456.1 shall extend the expiration of the approved or conditionally approved tentative map by 48 months from the date of its expiration, as provided in this section, or the date of the previously filed final map, whichever is later. The extensions shall not extend the tentative map more than 10 years from its approval or conditional approval. However, a tentative map on property subject to a development agreement authorized by Article 2.5 (commencing with Section 65864) of Chapter 4 of Division 1 may be extended for the period of time provided for in the agreement, but not beyond the duration of the agreement. The number of phased final maps that may be filed shall be determined by the advisory agency at the time of the approval or conditional approval of the tentative map.\n(2) Commencing January 1, 2012, and each\ncalendar year thereafter, the amount of two hundred thirty-six thousand seven hundred ninety dollars ($236,790) shall be annually increased by operation of law according to the adjustment for inflation set forth in the statewide cost index for class B construction, as determined by the State Allocation Board at its January meeting. The effective date of each annual adjustment shall be March 1. The adjusted amount shall apply to tentative and vesting tentative maps whose applications were received after the effective date of the adjustment.\n(3) “Public improvements,” as used in this subdivision, include traffic controls, streets, roads, highways, freeways, bridges, overcrossings, street interchanges, flood control or storm drain facilities, sewer facilities, water facilities, and lighting facilities.\n(b) (1) The period of time specified in subdivision (a), including any extension thereof granted pursuant to subdivision (e), shall not include any period of time during which a development moratorium, imposed after approval of the tentative map, is in existence. However, the length of the moratorium shall not exceed five years.\n(2) The length of time specified in paragraph (1) shall be extended for up to three years, but in no event beyond January 1, 1992, during the pendency of any lawsuit in which the subdivider asserts, and the local agency that approved or conditionally approved the tentative map denies, the existence or application of a development moratorium to the tentative map.\n(3) Once a development moratorium is terminated, the map shall\nbe valid for the same period of time as was left to run on the map at the time that the moratorium was imposed. However, if the remaining time is less than 120 days, the map shall be valid for 120 days following the termination of the moratorium.\n(c) The period of time specified in subdivision (a), including any extension thereof granted pursuant to subdivision (e), shall not include the period of time during which a lawsuit involving the approval or conditional approval of the tentative map is or was pending in a court of competent jurisdiction, if the stay of the time period is approved by the local agency pursuant to this section. After service of the initial petition or complaint in the lawsuit upon the local agency, the subdivider may apply to the local agency for a stay pursuant to the local agency’s adopted procedures. Within 40 days after\nreceiving the application, the local agency shall either stay the time period for up to five years or deny the requested stay. The local agency may, by ordinance, establish procedures for reviewing the requests, including, but not limited to, notice and hearing requirements, appeal procedures, and other administrative requirements.\n(d) The expiration of the approved or conditionally approved tentative map shall terminate all proceedings and no final map or parcel map of all or any portion of the real property included within the tentative map shall be filed with the legislative body without first processing a new tentative map. Once a timely filing is made, subsequent actions of the local agency, including, but not limited to, processing, approving, and recording, may lawfully occur after the date of expiration of the tentative map. Delivery\nto the county surveyor or city engineer shall be deemed a timely filing for purposes of this section.\n(e) Upon application of the subdivider filed before the expiration of the approved or conditionally approved tentative map, the time at which the map expires pursuant to subdivision (a) may be extended by the legislative body or by an advisory agency authorized to approve or conditionally approve tentative maps for a period or periods not exceeding a total of six years. The period of extension specified in this subdivision shall be in addition to the period of time provided by subdivision (a). Before the expiration of an approved or conditionally approved tentative map, upon an application by the subdivider to extend that map, the map shall automatically be extended for 60 days or until the application for the extension is\napproved, conditionally approved, or denied, whichever occurs first. If the advisory agency denies a subdivider’s application for an extension, the subdivider may appeal to the legislative body within 15 days after the advisory agency has denied the extension.\n(f) For purposes of this section, a development moratorium includes a water or sewer moratorium, or a water and sewer moratorium, as well as other actions of public agencies that regulate land use, development, or the provision of services to the land, including the public agency with the authority to approve or conditionally approve the tentative map, which thereafter prevents, prohibits, or delays the approval of a final or parcel map. A development moratorium shall also be deemed to exist for purposes of this section for any period of time during which a condition imposed by the\ncity or county could not be satisfied because of either of the following:\n(1) The condition was one that, by its nature, necessitated action by the city or county, and the city or county either did not take the necessary action or by its own action or inaction was prevented or delayed in taking the necessary action before expiration of the tentative map.\n(2) The condition necessitates acquisition of real property or any interest in real property from a public agency, other than the city or county that approved or conditionally approved the tentative map, and that other public agency fails or refuses to convey the property interest necessary to satisfy the condition. However, nothing in this subdivision shall be construed to require any public agency to convey any interest in\nreal property owned by it. A development moratorium specified in this paragraph shall be deemed to have been imposed either on the date of approval or conditional approval of the tentative map, if evidence was included in the public record that the public agency that owns or controls the real property or any interest therein may refuse to convey that property or interest, or on the date that the public agency that owns or controls the real property or any interest therein receives an offer by the subdivider to purchase that property or interest for fair market value, whichever is later. A development moratorium specified in this paragraph shall extend the tentative map up to the maximum period as set forth in subdivision (b), but not later than January 1, 1992, so long as the public agency that owns or controls the real property or any interest therein fails or refuses to convey the necessary\nproperty interest, regardless of the reason for the failure or refusal, except that the development moratorium shall be deemed to terminate 60 days after the public agency has officially made, and communicated to the subdivider, a written offer or commitment binding on the agency to convey the necessary property interest for a fair market value, paid in a reasonable time and manner.","history":"Amended by Stats. 2021, Ch. 162, Sec. 3.   (SB 9)   Effective January 1, 2022."},{"num":"66452.10","text":"A stock cooperative, as defined in Section 11003.2 of the Business and Professions Code, or a community apartment project, as defined in Section 11004 of the Business and Professions Code, shall not be converted to a condominium, as defined in Section 783 of the Civil Code, unless the required number of (1) owners and (2) trustees or beneficiaries of each recorded deed of trust and mortgagees of each recorded mortgage in the cooperative or project, as specified in the bylaws, or other organizational documents, have voted in favor of the conversion. If the bylaws or other organizational documents do not expressly specify the number of votes required to approve the conversion, a majority vote of the (1) owners and (2) trustees or beneficiaries of each recorded deed of trust and mortgagees of each recorded\nmortgage in the cooperative or project shall be required. Upon approval of the conversion as set forth above and in compliance with Sections 4290 and 4295 or Sections 6626 and 6628 of the Civil Code, all conveyances and other documents necessary to effectuate the conversion shall be executed by the required number of owners in the cooperative or project as specified in the bylaws or other organizational documents. If the bylaws or other organizational documents do not expressly specify the number of owners necessary to execute the conveyances or other documents, a majority of owners in the cooperative or project shall be required to execute the conveyances and other documents. Conveyances and other documents executed under the foregoing provisions shall be binding upon and affect the interests of all parties in the cooperative or project. The provisions of Section 66499.31 shall not apply to a violation of this section.","history":"Amended (as amended by Stats. 2012, Ch. 181, Sec. 59) by Stats. 2013, Ch. 605, Sec. 33.   (SB 752)   Effective January 1, 2014."},{"num":"66452.11","text":"(a) The expiration date of any tentative subdivision map or parcel map for which a tentative map has been approved that has not expired on the date that the act that adds this section becomes effective shall be extended by 24 months.\n(b) The extension provided by subdivision (a) shall be in addition to any extension of the expiration date provided for in Section 66452.6 or 66463.5.\n(c) Any legislative,\nadministrative, or other approval by any agency of the State of California that pertains to a development project included in a map that is extended pursuant to subdivision (a) shall be extended by 24 months if this approval has not expired on the date that the act that adds this section becomes effective.","history":"Added by Stats. 1993, Ch. 407, Sec. 1.   Effective September 13, 1993."},{"num":"66452.12","text":"(a) Any permit issued by a local agency in conjunction with a tentative subdivision map for a planned unit development shall expire pursuant to Section 65863.9.\n(b) Conditions or requirements for the issuance of a building permit or equivalent permit may be imposed pursuant to Section 65961.","history":"Added by Stats. 1994, Ch. 458, Sec. 6.   Effective January 1, 1995."},{"num":"66452.13","text":"(a) The expiration date of any tentative or vesting tentative subdivision map or parcel map for which a tentative map or vesting tentative map has been approved, that has not expired on or before the date the act that adds this section becomes effective shall be extended by 12 months.\n(b) The extension provided by subdivision (a) shall be in addition to any extension of the expiration date provided for in Section 66452.11, 66452.6, or 66463.5.\n(c) Any legislative, administrative, or other approval by any state agency that pertains to a development project included in a map that is extended pursuant to subdivision (a) shall be extended by 12 months if this approval has not expired on the date that the act that adds this section becomes effective. This extension shall be in addition to any extension provided for in Section 66452.11.","history":"Added by Stats. 1996, Ch. 46, Sec. 1.   Effective May 15, 1996."},{"num":"66452.17","text":"(a) Commencing at a date not less than 60 days prior to the filing of a tentative map pursuant to Section 66452, the subdivider or his or her agent shall give notice of the filing, in the form outlined in subdivision (b), to each person applying after that date for rental of a unit of the subject property immediately prior to the acceptance of any rent or deposit from the prospective tenant by the subdivider.\n(b) The notice shall be as follows:\n“To the\nprospective occupant(s) of\n:\n(address)\nThe owner(s) of this building, at (address), has filed or plans to file a tentative map with the (city, county, or city and county) to convert this building to a (condominium, community apartment, or stock cooperative project). No units may be sold in this building unless the conversion is approved by the (city, county, or city and county) and until after a public report is issued by the Bureau of Real Estate. If you become a tenant of this building, you shall be given notice of each hearing for which notice is required pursuant to Sections 66451.3 and 66452.5 of the Government Code, and you have the right to appear and the\nright to be heard at any such hearing.\n_____\n_____\n(signature of owner or owner’s agent)\n_____\n_____\n(dated)\nI have received this notice on  .\n_____\n(date)\n_____\n_____\n(prospective tenant’s signature)”\n(c) Failure by a subdivider or his or her agent to give the notice required in subdivision (a) shall not be grounds to deny the conversion. However, if the subdivider or his or her agent fails to give notice pursuant to this section, he or she shall pay to each prospective tenant who becomes a tenant and who was entitled to the\nnotice, and who does not purchase his or her unit pursuant to subparagraph (F) of paragraph (2) of subdivision (a) of Section 66427.1, an amount equal to the sum of the following:\n(1) Actual moving expenses incurred when moving from the subject property, but not to exceed one thousand one hundred dollars ($1,100).\n(2) The first month’s rent on the tenant’s new rental unit, if any, immediately after moving from the subject property, but not to exceed one thousand one hundred dollars ($1,100).\n(d) The requirements of subdivision (c) constitute a minimum state standard. However, nothing in that subdivision shall be construed to prohibit any city, county, or city and county from requiring, by ordinance or charter provision,\na subdivider to compensate any tenant, whose tenancy is terminated as the result of a condominium, community apartment project, or stock cooperative conversion, in amounts or by services which exceed those set forth in paragraphs (1) and (2) of that subdivision. If that requirement is imposed by any city, county, or city and county, a subdivider who meets the compensation requirements of the local ordinance or charter provision shall be deemed to satisfy the\nrequirements of subdivision (c).","history":"Amended by Stats. 2013, Ch. 352, Sec. 314.   (AB 1317)   Effective September 26, 2013.   Operative July 1, 2013, by Sec. 543 of Ch. 352."},{"num":"66452.18","text":"(a) Pursuant to subparagraph (A) of paragraph (2) of subdivision (a) of Section 66427.1, the subdivider shall give notice 60 days prior to the filing of a tentative map pursuant to Section 66452 in the form outlined in subdivision (b), to each tenant of the subject property.\n(b) The notice shall be as follows:\n“To the occupant(s)\nof\n:\n(address)\nThe owner(s) of this building, at (address), plans to file a tentative map with the (city, county, or city and county) to convert this building to a (condominium, community apartment, or stock cooperative project). You shall be given notice of each hearing for which notice is required pursuant to Sections 66451.3 and 66452.5 of the Government Code, and you have the right to appear and the right to be heard at any such hearing.\n_____\n_____\n(signature of owner or owner’s agent)\n_____\n_____\n(date)”\nThe written notices to tenants required by this section shall be deemed satisfied if the notices comply with the legal requirements for service by mail.","history":"Added by renumbering Section 66452.9 by Stats. 2008, Ch. 664, Sec. 9.   Effective January 1, 2009."},{"num":"66452.19","text":"(a) Pursuant to the provisions of subparagraph (E) of paragraph (2) of subdivision (a) of Section 66427.1, the subdivider shall give written notice of the intent to convert 180 days prior to the termination of tenancy in the form outlined in subdivision (b), to each tenant of the subject property.\n(b) The notice shall be as follows:\n“To the occupant(s) of\n:\n(address)\nThe owner(s) of this building, at (address), plans to convert this building to a (condominium, community apartment, or stock cooperative project). This is a notice of the owner’s intention to convert the building to a (condominium, community apartment, or stock cooperative project).\nA tentative map to convert the building to a (condominium, community apartment, or stock cooperative project) was approved by the City on _________. If the City approves a final map, you may be required to vacate the premises, but that\ncannot happen for at least 180 days from the date this notice was served upon you.\nAny future notice given to you to terminate your tenancy because of the conversion cannot be effective for at least 180 days from the date this notice was served upon you. This present notice is not a notice to terminate your tenancy; it is not a notice that you must now vacate the premises.\n_____\n_____\n(signature of owner or owner’s agent)\n_____\n_____\n(date)”\nThe written notices to tenants required by this section shall be deemed satisfied if such notices comply with the legal requirements for service by mail.","history":"Added by Stats. 2008, Ch. 664, Sec. 12.   Effective January 1, 2009."},{"num":"66452.20","text":"(a) Pursuant to subparagraph (F) of paragraph (2) of subdivision (a) of Section 66427.1, the subdivider shall give written notice within five days after receipt of the subdivision public report to each tenant of his or her exclusive right for at least 90 days after issuance of the subdivision public report to contract for the purchase of his or her respective unit in the form outlined in subdivision (b).\n(b) The notice shall be as follows:\n“To the occupant(s) of\n:\n(address)\nThe owner(s) of this building, at (address), have received the final subdivision report on the proposed conversion of this building to a (condominium, community apartment, or stock cooperative project). Commencing on the date of issuance of the subdivision public report, you have the exclusive right for 90 days to contract for the purchase of your rental unit upon the same or more favorable terms and conditions than the unit will initially be offered to\nthe general public.\n_____\n_____\n(signature of owner or owner’s agent)\n_____\n_____\n(date)”\nThe written notices to tenants required by this section shall be deemed satisfied if the notices comply with the legal requirements for service by mail.","history":"Added by Stats. 2008, Ch. 664, Sec. 13.   Effective January 1, 2009."},{"num":"66452.21","text":"(a) The expiration date of any tentative or vesting tentative subdivision map or parcel map for which a tentative or vesting tentative map, as the case may be, has been approved that has not expired on the date that the act that added this section became effective and that will expire before January 1, 2011, shall be extended by 12 months.\n(b) The extension provided by subdivision (a) shall be in addition to any extension of the expiration date provided for in Section\n66452.6, 66452.11, 66452.13, or 66463.5.\n(c) Any legislative, administrative, or other approval by any state agency that pertains to a development project included in a map that is extended pursuant to subdivision (a) shall be extended by 12 months if this approval has not expired on the date that the act that added this section became effective. This extension shall be in addition to any extension provided for in Section 66452.13.\n(d) For purposes of this section, the determination of whether a tentative subdivision map or parcel map expires before January 1, 2011, shall count only those extensions of time pursuant to subdivision (e) of Section 66452.6 or subdivision (c) of Section 66463.5 approved on or before the date that the act that added this section became effective and any additional time in connection with the filing of a final map pursuant to subdivision (a) of Section\n66452.6 for a map that was recorded on or before the date that the act that added this section became effective. The determination shall not include any development moratorium or litigation stay allowed or permitted by Section 66452.6 or 66463.5.","history":"Amended by Stats. 2008, Ch. 664, Sec. 14.   Effective January 1, 2009."},{"num":"66452.22","text":"(a) The expiration date of any tentative or vesting tentative subdivision map or parcel map for which a tentative or vesting tentative map, as the case may be, has been approved that has not expired on July 15, 2009, and that will expire before January 1, 2012, shall be extended by 24 months.\n(b) The extension provided by subdivision (a)\nshall be in addition to any extension of the expiration date provided for in Section 66452.6, 66452.11, 66452.13, 66452.21, or 66463.5.\n(c) Any legislative, administrative, or other approval by any state agency that pertains to a development project included in a map that is extended pursuant to subdivision (a) shall be extended by 24 months if this approval has not expired on July 15, 2009. This extension shall be in addition to any extension provided for in Sections 66452.13 and 66452.21.\n(d) (1) For purposes of this section, the determination of whether a tentative subdivision map or parcel map expires before January 1, 2012, shall count only those extensions of time pursuant to subdivision (e) of Section 66452.6 or subdivision (c) of Section 66463.5 approved on or before July 15, 2009, and any additional time in connection with the filing of a final map pursuant to subdivision\n(a) of Section 66452.6 for a map that was recorded on or before July 15, 2009.\n(2) The determination made pursuant to this subdivision shall not include any development moratorium or litigation stay allowed or permitted by Section 66452.6 or 66463.5.\n(e) The provisions of Section 65961 relating to conditions that may be imposed upon or after a building permit for a subdivision of single- or multiple-family residential units or a parcel map for a subdivision for which no tentative map was required, are modified as set forth in subdivisions (e) and (f) of Section 65961 for tentative maps extended pursuant to this section.","history":"Amended by Stats. 2009, Ch. 507, Sec. 4.   (AB 1084)   Effective January 1, 2010."},{"num":"66452.23","text":"(a) The expiration date of any tentative map, vesting tentative map, or parcel map for which a tentative map or vesting tentative map, as the case may be, has been approved that has not expired on or before the date that the act that added this section became effective, and that will expire before January 1, 2014, shall be extended by 24 months.\n(b) The extension provided by subdivision (a) shall be in addition to any extension of the expiration date provided for in Section 66452.6, 66452.11, 66452.13, 66452.21, 66452.22, or 66463.5.\n(c) Any legislative, administrative, or other approval by any state agency that pertains to a development project included in a map that is extended pursuant to subdivision (a) shall be extended by 24 months if this approval has not expired on or before the date that the act that added this section became effective. This extension shall be in addition to any extension provided for in Sections 66452.13, 66452.21, and 66452.22.\n(d) (1) For purposes of this section, the determination of whether a tentative map or parcel map expires before January 1, 2014, shall count only those extensions of time pursuant to subdivision (e) of Section 66452.6 or subdivision (c) of Section 66463.5 approved on or before\nthe effective date of the act that added this section, and any additional time in connection with the filing of a final map pursuant to subdivision (a) of Section 66452.6 for a map that was recorded on or before the effective date of the act that added this section.\n(2) The determination made pursuant to this subdivision shall not include any development moratorium or litigation stay allowed or permitted by Section 66452.6 or 66463.5.\n(e) The provisions of Section 65961 relating to conditions that may be\nimposed upon or after a building permit for a subdivision of single- or multiple-family residential units or a parcel map for a subdivision for which no tentative map was required, are modified as set forth in subdivisions (e) and (f) of Section 65961 for tentative maps extended pursuant to this section.","history":"Added by Stats. 2011, Ch. 88, Sec. 2.   (AB 208)   Effective July 15, 2011."},{"num":"66452.24","text":"(a) The expiration date of any tentative map, vesting tentative map, or parcel map for which a tentative map or vesting tentative map, as the case may be, that was approved on or after January 1, 2000, and that has not expired on or before the effective date of the act that added this section, shall be extended by 24 months.\n(b) Upon application of the subdivider filed at least 90 days prior to the expiration of the approved or conditionally approved tentative map or vesting tentative map, or parcel map for which the tentative map or vesting tentative map, as the case may be, that was approved on or before December 31, 1999, the time at which the map expires shall be extended by the legislative body or by an advisory agency authorized to approve or conditionally approve tentative maps, for a period of 24 months upon a determination that the map is consistent with the applicable zoning and general plan requirements in effect when the application is filed. If the map is determined not to be consistent with applicable zoning and general plan requirements in effect when the application is filed, the legislative body or advisory agency may deny or conditionally approve an extension for a period of 24 months. Prior to the expiration of an approved or conditionally approved\ntentative map, upon an application by the subdivider to extend that map, the map shall automatically be extended for 60 days or until the application for the extension is approved, conditionally approved, or denied, whichever occurs last. If the advisory agency denies a subdivider’s application for an extension, the subdivider may appeal to the legislative body within 15 days after the advisory agency has denied the extension.\n(c) The extension provided by\nsubdivisions (a) and (b) shall be in addition to any extension of the expiration date provided for in Section 66452.6, 66452.11, 66452.13, 66452.21, 66452.22, 66452.23, or 66463.5.\n(d) Any legislative, administrative, or other approval by any state agency that pertains to a development project included in a map that is extended pursuant to\nsubdivisions (a) and (b) shall be extended by 24 months if this approval has not expired on or before the effective date of the act that added this section. This extension shall be in addition to any extension provided for in Sections 66452.13, 66452.21, 66452.22, and 66452.23.\n(e) The provisions of Section 65961 relating to conditions that may be imposed upon or after a building\npermit for a subdivision of single- or multiple-family residential units or a parcel map for a subdivision for which no tentative map was required, are modified as set forth in subdivisions (e) and (f) of Section 65961 for tentative maps extended pursuant to this section.","history":"Added by Stats. 2013, Ch. 62, Sec. 2.   (AB 116)   Effective July 11, 2013."},{"num":"66452.25","text":"(a) If the map was approved within a county described in subdivision (c), the expiration date of a tentative map, vesting tentative map, or parcel map for which a tentative map or vesting tentative map, as the case may be, that was approved on or after January 1, 2002, and not later than July 11, 2013, and that has not expired on or before the effective date of the act that added this section, shall be extended by 24 months.\n(b) If the map was approved or conditionally approved within a county described in subdivision (c), upon application of the subdivider filed at least 90 days prior to the expiration of the approved or conditionally approved tentative map or\nvesting tentative map, or parcel map for which the tentative map or vesting tentative map, as the case may be, that was approved on or before December 31, 2001, the time at which the map expires shall be extended by the legislative body or by an advisory agency authorized to approve or conditionally approve tentative maps, for a period of 24 months upon a determination that the map is consistent with the applicable zoning and general plan requirements in effect when the application is filed. If the map is determined not to be consistent with applicable zoning and general plan requirements in effect when the application is filed, the legislative body or advisory agency may deny or conditionally approve an extension for a period of 24 months. Prior to the expiration of an approved or conditionally approved tentative map, upon an application by the subdivider to extend that map, the map shall automatically\nbe extended for 60 days or until the application for the extension is approved, conditionally approved, or denied, whichever occurs last. If the advisory agency denies a subdivider’s application for an extension, the subdivider may appeal to the legislative body within 15 days after the advisory agency has denied the extension.\n(c) This section shall apply within a county when the following conditions within the county are met:\n(1) The annual mean household income within the county is less than 80 percent of the statewide annual mean income, as determined by the most recent annual report of the federal American Community Survey 5-year Estimates, based upon the American Community Survey Design and Methodology publication (Version 2.0, January 2014) published by the United States\nCensus Bureau.\n(2) The annual nonseasonal unemployment rate is at least 2.75 percent higher than the statewide annual nonseasonal unemployment rate, as defined by the report on Labor Market Review published by the Employment Development Department in January of the year in which the community revitalization plan is prepared.\n(3) The population for whom poverty status is determined is at least 4 percent higher than the statewide median poverty rate, as determined by the most recent annual report of the American Community Survey 5-year Estimates, based upon the American Community Survey\nDesign and Methodology publication (Version 2.0, January 2014).\n(d) The extension provided by subdivisions (a) and (b) shall be in addition to any extension of the expiration date provided for in Section 66452.6, 66452.11, 66452.13, 66452.21, 66452.22, 66452.23, 66452.24, or 66463.5.\n(e) Any legislative, administrative, or other approval by any state agency that pertains to a development project included in a map that is extended pursuant to subdivisions (a) and (b) shall be extended by 24 months if this approval has not expired on or before the effective date of the act that added this section. This extension shall be in addition to any extension provided for in Sections 66452.13, 66452.21, 66452.22, 66452.23, and 66452.24.\n(f) The provisions of Section 65961 relating to conditions that may be imposed upon or after a building permit for a subdivision of single- or multiple-family residential units or a parcel map for a subdivision for which no tentative map was required, are modified as set forth in subdivisions (e) and (f) of Section 65961 for tentative maps extended pursuant to this section.","history":"Added by Stats. 2015, Ch. 751, Sec. 2.   (AB 1303)   Effective October 10, 2015."},{"num":"66452.26","text":"The expiration date of any tentative map, vesting tentative map, or parcel map for which a tentative map or vesting tentative map, as the case may be, that was approved on or after January 1, 2006, and not later than July 11, 2013, that relates to the construction of single-family or multifamily housing, and for which the expiration date was extended pursuant to Section 66452.25, and that has not expired on or before the effective date of the act that added this section, may be extended by the legislative body for up to 24 months.","history":"Amended by Stats. 2020, Ch. 370, Sec. 182.   (SB 1371)   Effective January 1, 2021."},{"num":"66452.27","text":"(a) A legislative body located within the County of Butte, may extend the expiration date for up to 36 months of any tentative map, vesting tentative map, or parcel map for which a tentative map or vesting tentative map, as the case may be, was approved on or after January 1, 2006, and not later than March 31, 2019, that relates to the construction of single or multifamily housing, and that has not expired on or before the effective date of the act that added this section.\n(b) Any legislative, administrative, or other approval by any state agency that pertains to a development project included in a map that is extended pursuant to subdivision (a) shall be extended by 36 months if the approval has not expired on or before the effective date of the act that added\nthis section.\n(c) The extension provided by subdivisions (a) and (b) shall be in addition to any extension of the expiration date provided for in Section 66452.6, 66452.21, 66452.22, 66452.23, 66452.24, or 66463.5.","history":"Amended by Stats. 2020, Ch. 370, Sec. 183.   (SB 1371)   Effective January 1, 2021."}]},{"heading":"ARTICLE 2.5. New Rental Housing: Conversion [66452.50 - 66452.51]","sections":[{"num":"66452.50","text":"(a) Notwithstanding any other provision of this division, a local agency may, upon application by a subdivider, in connection with the approval of a tentative or final map for the proposed construction of a condominium development, which requires the obtaining of a tentative or final map under provisions of this division or local ordinances enacted pursuant thereto, enter into a binding agreement with the subdivider mandating that the units be first made available for rental housing for a period of not less than 10 years from the date a certificate of occupancy has been issued for the units within the\ndevelopment; provided that (1) at the expiration of the 10-year period the units within the development may be sold to individual purchasers, in accordance with the approved final map authorizing the development without further proceedings under the provisions of this division or local ordinances enacted pursuant thereto, and (2), except as otherwise provided in subdivision (b), during the period the units are required to be made available for rental purposes, the units are insured or are to be insured or co-insured pursuant to the provisions of Chapter 4 (commencing with Section 51850) of Part 4 of Division 31 of the Health and Safety Code, and (3) each tenant of a unit within the development shall be given 180 days’ written notice prior to actual conversion. Such notice shall include an offer of an exclusive right to contract for his or her respective unit upon the same terms and conditions that such unit will be initially offered to the general public or on terms more favorable to the tenant. The right\nshall run for a period of not less than 90 days from the date written notice of actual conversion was sent to the tenant.\nAny such agreement shall be in writing, particularly describe the real property and set forth the name or names of the record title owner of the real property affected thereby, and be executed by the person authorized to act on behalf of the local agency and by the subdivider. From the date of execution of the agreement, it shall be binding upon the local agency, the subdivider, and their successors. The fact that a condominium development is subject to such an agreement shall be set forth on the face of any tentative or final map approved by the local agency and the agreement shall be recorded in the office of the county recorder in the county in which the real property is located on or before the date of recordation of the final map.\n(b) Multifamily rental housing financed on or\nafter January 1, 1983, with the proceeds of sale of tax-exempt bonds sold pursuant to any laws of this state shall not be subject to the requirements of condition (2) prescribed in the first paragraph of subdivision (a), but shall be subject to all the requirements of the law pursuant to which the bonds are being issued, including, but not limited to, any requirement in such law that the housing be maintained as rental housing for a period in excess of 10 years.","history":"Amended by Stats. 1983, Ch. 84, Sec. 1.   Effective June 14, 1983."},{"num":"66452.51","text":"Prior to the acceptance of any rent or deposit from a prospective tenant, the following notice shall be provided:\nTo the prospective occupant(s) of ________:\n(address)\nThe\nowner(s) of this building at (address), have received a tentative map with (city, county, or city and county) to convert this building to a (condominium, community apartment, or stock cooperative), no sooner than (date). You will be notified at least 180 days prior to the actual conversion. Further, if you still reside in your unit, you will be given an exclusive right to purchase your unit.\n___________________\n(signature of owner\nor owner’s agent)\n___________________\n(dated)\nI have received this notice on __________.\n(dated)\n___________________\n(prospective tenant’s\nsignature)","history":"Added by Stats. 1982, Ch. 1447, Sec. 1."}]},{"heading":"ARTICLE 3. Review of Tentative Map by Other Agencies [66453 - 66455.9]","sections":[{"num":"66453","text":"(a) A local agency may make recommendations concerning proposed subdivisions in any adjoining city, or in any adjoining unincorporated territory for any proposed subdivision within the planning area of the requesting local agency. A local agency wishing to make recommendations concerning proposed subdivisions shall file with the local agency having jurisdiction over the subdivisions a map indicating the territory for which it wishes to make recommendations. The local agency having jurisdiction shall issue a receipt for the territorial\nmap.\n(b) Within five days of a tentative map application being determined to be complete pursuant to Section 65943 for a proposed subdivision located, in whole or in part, within the territory outlined on the territorial map, the local agency shall transmit one copy of the proposed tentative map to the requesting local agency.\n(c) Within 15 days of receiving a copy of a proposed subdivision map, the requesting local agency may submit recommendations to the local agency having jurisdiction. The local agency having jurisdiction shall consider these recommendations before acting on the tentative map.","history":"Amended by Stats. 2004, Ch. 479, Sec. 1.   Effective January 1, 2005."},{"num":"66454","text":"Any subdivider may file with a city the tentative map of a proposed subdivision of unincorporated territory adjacent to such city. The map, in the discretion of the city, may be acted upon in the manner provided in Article 2 (commencing with Section 66452) of this chapter, except that if it is approved, such approval shall be conditioned upon annexation of the property to such city within such period of time as shall be specified by the city, and such approval shall not be effective until annexation of such property to the city has been completed. If annexation is not completed within the time specified or any extension thereof, then the approval of such map by such adjacent\ncity shall be null and void. No subdivision of unincorporated territory may be effected by approval of a map by a city unless annexation thereof to the city is completed prior to the approval of the final map thereof.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66455","text":"(a) The Department of Transportation may file with the legislative body of any local agency having jurisdiction, a map or an amended map of any territory within one mile on either or both sides of any state highway routing if the department believes the subdivision would have an effect upon an existing or a future state highway in that territory, the route of which has been adopted by the California Transportation Commission. The local agency having jurisdiction shall issue a receipt for the territorial map.\n(b) Within five days of a tentative map application being determined to be complete pursuant to Section 65943 for a proposed subdivision located, in whole or in part, within the territory outlined on the territorial map, the local agency shall transmit one copy of the proposed tentative map to the district office of the department in which the proposed subdivision is located.\n(c) Within 15 days after receiving a copy of the proposed subdivision map, the department may make recommendations to the local agency regarding the effect of the proposed subdivision upon the highway or highway route. The local agency shall consider these recommendations before acting on the tentative map.","history":"Amended by Stats. 1994, Ch. 1075, Sec. 2.   Effective January 1, 1995."},{"num":"66455.1","text":"(a) The Department of Water Resources may file with the legislative body of any local agency having jurisdiction, a map or amended map of any territory within one mile on either or both sides of any facility of the State Water Resources Development System, if the department believes a proposed subdivision may have an effect upon any existing or planned future facility of the State Water Resources Development System in that territory. The local agency having jurisdiction shall issue a receipt for the territorial map.\n(b) Within five days of a tentative map application being determined to be complete pursuant to Section 65943 for a proposed subdivision located, in whole or in part, within the territory outlined on the territorial map, the local agency shall transmit one copy of the proposed tentative map to the office of the department nearest the subdivision, unless the department specifies a different office on the territorial map filed with the local agency.\n(c) Within 15 days after receiving a copy of a proposed subdivision map, the department may make recommendations to the local agency regarding the effect of the proposed subdivision upon the State Water Resources Development System or proposed additions to the system. The local agency having jurisdiction shall consider any recommendations before acting on the tentative map.","history":"Amended by Stats. 1994, Ch. 1075, Sec. 3.   Effective January 1, 1995."},{"num":"66455.3","text":"Not later than five days after a city or county has determined that a tentative map application for a proposed subdivision, as defined in Section 66473.7, is complete pursuant to Section 65943, the local agency shall send a copy of the application to any water supplier that is, or may become, a public water system, as defined in Section 10912 of the Water Code, that may supply water for the subdivision.","history":"Added by Stats. 2001, Ch. 642, Sec. 3.   Effective January 1, 2002."},{"num":"66455.7","text":"(a) Within five days of a tentative map application being determined to be complete pursuant to Section 65943, the local agency shall send a notice of this determination to the governing board of any elementary school, high school, or unified school district within the boundaries of which the subdivision is proposed to be located. The notice shall identify information about the location of the proposed subdivision, the number of units, density, and any other information which would be relevant to the affected school district.\n(b) Within 15 days after receiving the notice, the school district may make recommendations to the local agency regarding the effect of the proposed subdivision upon the school district. If the school district fails to respond within 15 days, the failure to respond shall be deemed approval of the proposed subdivision. The local agency having jurisdiction shall consider any recommendations before acting on the tentative subdivision map.","history":"Amended by Stats. 1994, Ch. 1075, Sec. 4.   Effective January 1, 1995."},{"num":"66455.9","text":"Whenever there is consideration of an area within a development for a public schoolsite, the advisory agency shall give the affected districts and the State Department of Education written notice of the proposed site. The written notice shall include the identification of any existing or proposed runways within the distance specified in Section 17215 of the Education Code. If the site is within the distance of an existing or proposed airport runway as described in Section 17215 of the Education Code, the department shall notify the State Department of\nTransportation as required by the section and the site shall be investigated by the State Department of Transportation required by Section 17215.","history":"Amended by Stats. 2000, Ch. 1058, Sec. 120.   Effective January 1, 2001."}]},{"heading":"ARTICLE 4. Final Maps [66456 - 66462.5]","sections":[{"num":"66456","text":"After the approval or conditional approval of the tentative map and prior to the expiration of such map, the subdivider may cause the real property included within the map, or any part thereof, to be surveyed and a final map thereof prepared in accordance with the approved or conditionally approved tentative map.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66456.1","text":"Multiple final maps relating to an approved or conditionally approved tentative map may be filed prior to the expiration of the tentative map if: (a) the subdivider, at the time the tentative map is filed, informs the advisory agency of the local agency of the subdivider’s intention to file multiple final maps on such tentative map, or (b) after filing of the tentative map, the local agency and the subdivider concur in the filing of multiple final maps. In providing such notice, the subdivider shall not be required to define the number or configuration of the proposed multiple final maps. The filing of a final map on a\nportion of an approved or conditionally approved tentative map shall not invalidate any part of such tentative map. The right of the subdivider to file multiple final maps shall not limit the authority of the local agency to impose reasonable conditions relating to the filing of multiple final maps.","history":"Amended by Stats. 1982, Ch. 87, Sec. 18.   Effective March 1, 1982."},{"num":"66456.2","text":"(a) An improvement plan being processed in conjunction with either an approved tentative, parcel, or final map shall be prepared by a registered civil engineer and acted on within 60 working days of its submittal, except that at least 15 working days shall be provided for processing any resubmitted improvement plan. The 60 working day period shall not include any days during which the improvement plan has been returned to the applicant for correction, has been subject to review by other than the local agency or, following that review, has been returned to the applicant for correction.\n(b) The time limits specified in this section for acting on improvement plans may be extended by mutual consent of the subdivider and the advisory agency or legislative body required to act. However, no advisory agency or legislative body may require a routine waiver of time limits as a condition of accepting the improvement plan. A routine waiver may be obtained for the purpose of permitting concurrent processing of other requirements related to the improvement plan or map.\n(c) If, at the time of submittal or resubmittal, the local agency or designee determines it is unable to meet the time limits of this section, the local agency or designee shall, upon request of the subdivider and for purposes of meeting the time limits, contract or employ a private entity or persons on a temporary basis to perform services necessary to permit the agency or designee to meet the time limits. However,\na local agency or designee need not enter into a contract or employ those persons if it determines either of the following:\n(1) No entities or persons are available or qualified to perform the services.\n(2) The local agency or designee would be able to perform services in a more rapid fashion by modifying its own work schedule than would any available and qualified persons or entities.\nA local agency may charge the subdivider fees in an amount necessary to defray costs directly attributable to employing or contracting with entities or persons performing services pursuant to this section.\n(d) “Improvement plan” means the plan for public improvement as described in Sections 66418 and 66419.","history":"Amended by Stats. 1989, Ch. 847, Sec. 8."},{"num":"66457","text":"(a) A final map or parcel map conforming to the approved or conditionally approved tentative map, if any, may be filed with the legislative body for approval after all required certificates or statements on the map have been signed and, where necessary, acknowledged.\n(b) If the subdivision lies entirely within the territory of a city, the map shall be filed with the city. If the subdivision lies entirely within unincorporated territory, the map shall be filed with the county. If the subdivision lies partially within two or more territories, the map shall be filed with\neach, and each shall act thereon as provided in this chapter.","history":"Amended by Stats. 1987, Ch. 982, Sec. 15."},{"num":"66458","text":"(a) The legislative body shall, at the meeting at which it receives the map or, at its next regular meeting after the meeting at which it receives the map, approve the map if it conforms to all the requirements of this chapter and any local subdivision ordinance applicable at the time of approval or conditional approval of the tentative map and any rulings made thereunder. If the map does not conform, the legislative body shall disapprove the map.\n(b) If the legislative body does not approve or disapprove the map within the prescribed time, or any authorized extension thereof, and the map conforms to all requirements and rulings, it shall be deemed approved, and the clerk of the legislative body shall certify or state its approval thereon.\n(c) The meeting at which the legislative body receives the map shall be the date on which the clerk of the legislative body receives the map.\n(d) The legislative body may provide, by ordinance, for the approval or disapproval of final maps by the city or county engineer, surveyor, or other designated official. The legislative body may also provide, by ordinance, that the official may accept, accept subject to improvement, or reject dedications and offers of dedications that are made by a statement on the map. Any ordinance adopted pursuant to this subdivision shall provide\nthat (1) the designated official shall notify the legislative body at its next regular meeting after the official receives the map that the official is reviewing the map for final approval, (2) the designated official shall approve or disapprove the final map within 10 days following the meeting of the legislative body that was preceded by the notice in (4) below, (3) the designated official’s action may be appealed to the legislative body, (4) the clerk of the legislative body shall provide notice of any pending approval or disapproval by a designated official, which notice shall be attached and posted with the legislative body’s regular agenda and shall be mailed to interested parties who request notice, and (5) the legislative body shall periodically review the delegation of authority to the designated official. Except as specifically authorized by this subdivision, the processing of final maps shall conform to all procedural requirements of this division.","history":"Amended by Stats. 1999, Ch. 550, Sec. 21.   Effective September 28, 1999.   Operative January 1, 2000, by Sec. 33 of Ch. 550."},{"num":"66459","text":"(a) If a final map has been approved for a condominium project, community apartment project, or stock cooperative project, and the subdivider or subsequent owner of the project, on or after January 1, 1993, rents a dwelling in that project, he or she shall, prior to offering the separate interest for sale to the general public, deliver the following notice, printed in at least 14-point bold print, prior to the execution of the rental agreement:\nTO THE PROSPECTIVE TENANTS\nOF\n(address)\nTHE UNIT YOU MAY RENT HAS BEEN APPROVED FOR SALE TO THE PUBLIC AS A CONDOMINIUM PROJECT, COMMUNITY APARTMENT PROJECT, OR STOCK COOPERATIVE PROJECT (WHICHEVER APPLIES). THE RENTAL UNIT MAY BE SOLD TO THE PUBLIC, AND, IF IT IS OFFERED FOR SALE, YOUR LEASE MAY BE TERMINATED. YOU WILL BE NOTIFIED AT LEAST 90 DAYS PRIOR TO ANY OFFERING TO SELL. IF YOU STILL LAWFULLY RESIDE IN THE UNIT, YOU WILL BE GIVEN A\nRIGHT OF FIRST REFUSAL TO PURCHASE THE UNIT.\n(signature of owner or owner’s agent)\n(dated)\n(b) The condominium project, community apartment project, or stock cooperative project shall not be referred to in a lease or rental agreement as an “apartment” or “apartments” on or after the date of the approval by the local agency of the final map for the condominium project, community apartment project, or stock cooperative project in which the final map was approved on or after January 1, 1993.\n(c) Any tenant of a condominium project, community apartment project, or stock cooperative project pursuant to this section shall be given at least 90 days’ written notice of the intention to sell the rental unit to the general public. This subdivision shall not alter or abridge the rights or obligations of the parties in performance of their covenants, including, but not\nlimited to, the provision of services, payment of rent, or other obligations imposed by Sections 1941, 1941.1, and 1941.2 of the Civil Code.\n(d) Any tenant who lawfully resides in a condominium project, community apartment project, or stock cooperative project pursuant to this section shall be given a right of first refusal by the subdivider or subsequent owner of the project for the purchase of his or her rental unit upon the same terms and conditions that the unit will be initially offered to the general public or terms and conditions more favorable to the tenant. This right to purchase shall run for a period of 90 days from the date of the notice, unless the tenant gives written notice within the 90-day period of his or her intention not to exercise that right.\n(e) Failure to comply with this section shall not invalidate the transfer of title to real property.\n(f) Failure by a subdivider or his or her agent to give the notice required in subdivision (a) shall not be grounds to deny the conversion. However, if the subdivider or his or her agent fails to give notice pursuant to this section, he or she shall pay to each prospective tenant who becomes a tenant and who was entitled to that notice, and who does not purchase his or her unit pursuant to subparagraph (F) of paragraph (2) of subdivision (a) of Section 66427.1, an amount equal to the sum of the following:\n(1) Actual moving expenses incurred when moving from the subject property, but not to exceed one thousand one hundred dollars ($1,100).\n(2) The first month’s rent on the tenant’s new rental unit, if any, immediately after moving from the subject property, but not to exceed one thousand one hundred dollars ($1,100).\n(g) This section shall not apply to any of the following:\n(1) An owner of four dwelling units or less.\n(2) Transfers pursuant to court order, including, but not limited to, transfers ordered by a probate court in the administration of an estate, transfers by any foreclosure sale after default, transfers by any foreclosure sale after default in an obligation secured by a mortgage, or transfers by a sale under a power of sale after a default in an obligation secured by a deed of trust or secured by any other instrument containing a power of sale, and any subsequent transfer by a mortgagor or beneficiary of a deed of trust who accepts a deed in lieu of foreclosure or purchases the property at a foreclosure sale.\n(3) Transfers by a fiduciary in the course of\nthe administration of a decedent’s estate, guardianship, conservatorship, or trust. For purposes of this paragraph, a “fiduciary” means a state- or federally chartered bank, trust company, savings association, savings bank, credit union, or industrial loan company.","history":"Amended by Stats. 2007, Ch. 612, Sec. 8.   Effective January 1, 2008."},{"num":"66462","text":"(a) If, at the time of approval of the final map by the legislative body, any public improvements required by the local agency pursuant to this division or local ordinance have not been completed and accepted in accordance with standards established by the local agency by ordinance applicable at the time of the approval or conditional approval of the tentative map, the legislative body, as a condition precedent to the approval of the final map, shall require the subdivider to enter into one of the following agreements specified by the local\nagency:\n(1) An agreement with the local agency upon mutually agreeable terms to thereafter complete the improvements at the subdivider’s expense.\n(2) An agreement with the local agency to thereafter do either of the following:\n(A) Initiate and consummate proceedings under an appropriate special assessment act or the Mello-Roos Community Facilities Act of 1982, Chapter 2.5 (commencing with Section 53311) of Part 1 of Division 2 of Title 5 for the financing and completion of all of the improvements.\n(B) If the improvements are not completed under a special assessment act or the Mello-Roos Community Facilities Act of 1982, Chapter 2.5 (commencing with Section 53311) of Part 1 of Division 2 of Title 5, to complete the improvements at the subdivider’s\nexpense.\n(b) The standards may be adopted by reference, without posting or publishing them, if they have been printed in book or booklet form and three copies of the books or booklets have been filed for use and examination by the public in the office of the clerk of the legislative body.\n(c) The local agency entering into any agreement pursuant to this section shall require that performance of the agreement be guaranteed by the security specified in Chapter 5 (commencing with Section 66499).\n(d) The legislative body may provide, by ordinance, that the agreement entered into pursuant to this section may be entered into by a designated official, in accordance with standards adopted by the local agency. The designated official’s action may be appealed to the legislative body for conformance with this chapter and any\napplicable local subdivision ordinance. Any ordinance adopted pursuant to this subdivision shall provide that the legislative body shall periodically review this delegation of authority to the designated official.","history":"Amended by Stats. 1998, Ch. 604, Sec. 2.   Effective January 1, 1999."},{"num":"66462.5","text":"(a) A city, county, or city and county shall not postpone or refuse approval of a final map because the subdivider has failed to meet a tentative map condition which requires the subdivider to construct or install offsite improvements on land in which neither the subdivider nor the local agency has sufficient title or interest, including an easement or license, at the time the final map is filed with the local agency, to permit the improvements to be made. In such cases, unless the city, county, or city and county requires the subdivider\nto enter into an agreement pursuant to subdivision (c), the city, county or city and county shall, within 120 days of the filing of the final map, pursuant to Section 66457, acquire by negotiation or commence proceedings pursuant to Title 7 (commencing with Section 1230.010) of Part 3 of the Code of Civil Procedure to acquire an interest in the land which will permit the improvements to be made, including proceedings for immediate possession of the property under Article 3 (commencing with Section 1255.410) of Chapter 6 of that title.\n(b) If a city, county, or city and county has not required the subdivider to enter into an agreement pursuant to subdivision (c) and if a city, county, or city and county fails to meet the 120-day time limitation, the condition for construction of offsite improvements shall be conclusively deemed to be waived. The waiver shall occur whether or not the city, county, or city and county has postponed or refused\napproval of the final map pursuant to subdivision (a).\n(c) Prior to approval of the final map the city, county, or city and county may require the subdivider to enter into an agreement to complete the improvements pursuant to Section 66462 at such time as the city, county, or city and county acquires an interest in the land that will permit the improvements to be made.\n(d) Nothing in this section precludes a city, county, or city and county from requiring a subdivider to pay the cost of acquiring offsite real property interests required in connection with a subdivision.\n(e) “Offsite improvements,” as used in this section, does not include improvements that are necessary to assure replacement or construction of housing for persons and families of low or moderate income, as defined in Section 50093 of the Health and\nSafety Code.","history":"Amended by Stats. 2003, Ch. 728, Sec. 1.   Effective January 1, 2004."}]},{"heading":"ARTICLE 5. Parcel Maps [66463 - 66463.5]","sections":[{"num":"66463","text":"(a) Except as otherwise provided for in this code, the procedure for processing, approval, conditional approval, or disapproval and filing of parcel maps and modifications thereof shall be as provided by local ordinance. The provisions of Sections 66477.1, 66477.2, and 66477.3 relating to dedications and offers of dedication on final maps, shall apply to dedications and offers of dedications on parcel maps.\n(b) Whenever a local agency provides, by ordinance, for the approval, conditional approval, or disapproval of parcel maps by the county engineer, surveyor, or other\ndesignated official, the local agency may also, by ordinance, provide that the officer may accept or reject dedications and offers of dedication that are made by a statement on the map.\n(c) Whenever a local agency provides, by ordinance, for the approval of parcel maps by the legislative body, the parcel maps shall be filed pursuant to the procedure for final maps as prescribed by Sections 66457 and 66458.\n(d) The time limits for action or approval of a tentative map and parcel map for which a tentative map is not required shall be no longer than the time limits contained in Sections 66452.1 and 66452.2.","history":"Amended by Stats. 1989, Ch. 847, Sec. 9."},{"num":"66463.1","text":"Multiple parcel maps filed pursuant to Section 66426 relating to an approved or conditionally approved tentative map may be filed prior to the expiration of the tentative map if either condition is satisfied:\n(a) The subdivider, at the time the tentative map is filed, provides a written notice to the advisory agency or the local agency of the subdivider’s intention to file multiple parcel maps on the tentative map.\n(b) After filing of the tentative map, the local agency and the subdivider concur in the filing of multiple\nparcel maps.\nIn providing the notice specified in subdivision (a), the subdivider shall not be required to define the number or configuration of the proposed multiple parcel maps. The filing of a parcel map on a portion of an approved or conditionally approved tentative map shall not invalidate any part of the tentative map. The right of the subdivider to file multiple parcel maps shall not limit the authority of the local agency to impose reasonable conditions relating to the filing of multiple parcel maps.","history":"Added by Stats. 1991, Ch. 907, Sec. 3."},{"num":"66463.5","text":"(a) When a tentative map is required, an approved or conditionally approved tentative map shall expire 24 months after its approval or conditional approval, or after any additional period of time as may be prescribed by local ordinance, not to exceed an additional 12 months.\n(b) The expiration of the approved or conditionally approved tentative map shall terminate all proceedings, and no parcel map of all or any portion of the real property included within the tentative map\nshall be filed without first processing a new tentative map. Once a timely filing is made, subsequent actions of the local agency, including, but not limited to, processing, approving, and recording, may lawfully occur after the date of expiration of the tentative map. Delivery to the county surveyor or city engineer shall be deemed a timely filing for purposes of this section.\n(c) Upon application of the subdivider filed prior to the expiration of the approved or conditionally approved tentative map, the time at which the map expires may be extended by the legislative body or by an advisory agency authorized to approve or conditionally approve tentative maps for a period or periods not exceeding a total of six years. Prior to the expiration of an approved or conditionally approved tentative map, upon the application by the subdivider to extend that map, the map shall automatically be extended for 60 days or until the application for the\nextension is approved, conditionally approved, or denied, whichever occurs first. If the advisory agency denies a subdivider’s application for an extension, the subdivider may appeal to the legislative body within 15 days after the advisory agency has denied the extension.\n(d) (1) The period of time specified in subdivision (a) shall not include any period of time during which a development moratorium, imposed after approval of the tentative map, is in existence. However, the length of the moratorium shall not exceed five years.\n(2) Once a moratorium is terminated, the map shall be valid for the same period of time as was left to run on the map at the time that the moratorium was imposed. However, if the remaining time is less than 120 days, the map shall be valid for 120 days following the termination of the moratorium.\n(e) The period of time specified in subdivision (a), including any extension thereof granted pursuant to subdivision (c), shall not include the period of time during which a lawsuit involving the approval or conditional approval of the tentative map is, or was, pending in a court of competent jurisdiction, if the stay of the time period is approved by the local agency pursuant to this section. After service of the initial petition or complaint in the lawsuit upon the local agency, the subdivider may apply to the local agency for a stay pursuant to the local agency’s adopted procedures. Within 40 days after receiving the application, the local agency shall either stay the time period for up to five years or deny the requested stay. The local agency may, by ordinance, establish procedures for reviewing the requests, including, but not limited to, notice and hearing requirements, appeal procedures, and other administrative requirements.\n(f) For purposes of this section, a development moratorium shall include a water or sewer moratorium or a water and sewer moratorium, as well as other actions of public agencies that regulate land use, development, or the provision of services to the land, including the public agency with the authority to approve or conditionally approve the tentative map, which thereafter prevents, prohibits, or delays the approval of a parcel map.\n(g) Notwithstanding subdivisions (a), (b), and (c), for the purposes of Chapter 4.5 (commencing with Section 66498.1), subdivisions (b), (c), and (d) of Section 66498.5 shall apply to vesting tentative maps prepared in connection with a parcel map except that, for purposes of this section, the time periods specified in subdivisions (b), (c), and (d) of Section 66498.5 shall be determined from the recordation of the parcel map instead of the final\nmap.","history":"Amended by Stats. 2008, Ch. 124, Sec. 5.   Effective July 15, 2008."}]},{"heading":"ARTICLE 6. Filing Maps With County Recorder [66464 - 66468.2]","sections":[{"num":"66464","text":"(a) Unless otherwise provided by the county, if the final map or parcel map is not subject to Section 66493, after the approval by the city of a final map of a subdivision or a parcel map, the city clerk shall transmit the map to the county recorder.\n(b) If a final map or parcel map is subject to Section 66493, after all certificates or statements and security required under Section 66493 have been filed and deposited with the clerk of the board of supervisors and approved by\nthe county, the clerk of the board of supervisors shall certify or state that the certificates and statements have been filed and deposits have been made and shall transmit the final map or parcel map to the county recorder.\n(c) After the approval by the county of a final or parcel map of a subdivision within unincorporated territory, the map shall be transmitted ultimately to the county recorder.","history":"Amended by Stats. 2001, Ch. 176, Sec. 31.   Effective January 1, 2002."},{"num":"66465","text":"The subdivider shall present to the county recorder evidence that, at the time of the filing of the final or parcel map in the office of the county recorder, the parties consenting to such filing are all of the parties having a record title interest in the real property being subdivided whose signatures are required by this division, as shown by the records in the office of the recorder, otherwise the map shall not be filed.\nFor purposes of this section and Sections 66436, 66439, and 66447, a public entity which has obtained a prejudgment order for possession of property pursuant to Section 1255.410 of the Code of Civil Procedure\nshall be deemed to be the record title owner of the property or property interests described in the order, provided the order for possession has not been stayed or vacated pursuant to Section 1255.420, 1255.430, or 1255.440 of the Code of Civil Procedure, no motion therefor is pending before the court, and the time prescribed by Section 1255.420 of the Code of Civil Procedure for filing a motion for relief from the order has passed.","history":"Amended by Stats. 1979, Ch. 309."},{"num":"66466","text":"(a) The county recorder shall have not more than 10 days within which to examine a final or parcel map and either accept or reject it for filing.\n(b) If the county recorder rejects a final or parcel map for filing, the county recorder shall, within 10 days thereafter, mail notice to the subdivider and the city engineer if the map is within a city, or the county surveyor if the map is within the unincorporated area, that the map has been rejected for filing, giving the reasons therefor, and that the map is being returned to the city clerk if the map is within a city, or to the clerk of the board if the map is within the unincorporated area, for action by the legislative body. Upon receipt of the map, the clerk shall place the\nmap on the agenda of the next regular meeting of the legislative body and the legislative body shall, within 15 days thereafter, rescind its approval of the map and return the map to the subdivider unless the subdivider presents evidence that the basis for the rejection by the county recorder has been removed. The subdivider may consent to a continuance of the matter; however, the prior approval of the legislative body shall be deemed rescinded during any period of continuance. If a map is returned to the county recorder, the county recorder shall have a new 10-day period to examine the map and either accept or reject it for filing.\n(c) If the county recorder accepts the map for filing, the acceptance shall be certified on the face thereof. The map shall be stored in any other manner as will assure that the maps will be kept together, safe, and reproducible. The map shall become a part of the official records of the county recorder upon its\nacceptance by the county recorder for filing. If the preparer of the map provides a postage-paid, self-addressed envelope or postcard with the filing of the map, the county recorder shall provide the preparer of the map with the filing data within 10 days of the filing of the map. For the purposes of this subdivision, “filing data” includes the date, and the recording instrument number or the book or volume and page at which the map is filed by the county recorder.\n(d) The fee for filing and indexing the map is as prescribed in Section 27372 of the Government Code.\n(e) The original map shall be stored for safekeeping in a reproducible condition. The county recorder may maintain for public reference a set of counter maps that are prints of the original maps and produce the original maps for comparison upon demand.\n(f) Upon the filing of any map, including amended maps and certificates of correction for recordation pursuant to this section or any record of survey pursuant to the Professional Land Surveyors’ Act (Chapter 15 (commencing with Section 8700) of Division 3 of the Business and Professions Code), the surveyor or engineer who prepared the document shall transmit a copy of the document, including all recording information, to the county surveyor, who shall maintain an index, by geographic location, of the documents. The county surveyor may charge a fee not to exceed the fee charged for recording the document, for purposes of financing the costs of maintaining the index of the documents.\nThe requirements of this subdivision shall not apply to any county that requires a document filed pursuant to this section to be transmitted to the county surveyor and requires that o
