fficial to maintain an index of those documents.","history":"Amended by Stats. 2022, Ch. 427, Sec. 18.   (SB 1489)   Effective January 1, 2023."},{"num":"66467","text":"This chapter shall not prevent filing in the office of the county recorder of a final or parcel map of a subdivision for which a final or parcel map is not required, provided such map meets the requirements of this division and any local ordinance.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66468","text":"The filing for record of a final or parcel map by the county recorder shall automatically and finally determine the validity of such map and when recorded shall impart cconstructive notice thereof.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66468.1","text":"Whenever separate documents are to be recorded concurrently with the final or parcel map pursuant to Section 66435.1 or 66445, the county recorder shall complete the cross-reference to such concurrently recorded separate documents.","history":"Added by Stats. 1982, Ch. 87, Sec. 19.   Effective March 1, 1982."},{"num":"66468.2","text":"The board of supervisors may, by resolution, authorize any county officer to:\n(a) Perform the duties required of the clerk of the board of supervisors under this article.\n(b) Approve the security for payment of taxes required pursuant to subdivision (b) of Section 66464 if that county officer also performs the other duties required of the clerk of the board of supervisors under that subdivision.","history":"Amended by Stats. 1990, Ch. 1001, Sec. 2."}]},{"heading":"ARTICLE 7. Correction and Amendment of Maps [66469 - 66472.1]","sections":[{"num":"66469","text":"After a final map or parcel map is filed in the office of the county recorder, it may be amended by a certificate of correction or an amending map for any of the following purposes:\n(a) To correct an error in any course or distance shown thereon.\n(b) To show any course or distance that was omitted therefrom.\n(c) To correct an error in the description of the real property\nshown on the map.\n(d) To indicate monuments set after the death, disability, retirement from practice, or replacement of the engineer or surveyor charged with responsibilities for setting monuments.\n(e) To show the proper location or character of any monument which has been changed in location or character originally was shown at the wrong location or incorrectly as to its character.\n(f) To correct any additional information filed or recorded pursuant to Section 66434.2, if the correction does not impose any additional burden on the present fee owners of the real property and does not alter any right, title, or interest in the real property reflected on the recorded map.\n(g) To correct any other type of map error or omission as approved by the county\nsurveyor or city engineer that does not affect any property right, including, but not limited to, lot numbers, acreage, street names, and identification of adjacent record maps.\nAs used in this section, “error” does not include changes in courses or distances from which an error is not ascertainable from the data shown on the final or parcel map.","history":"Amended by Stats. 2001, Ch. 176, Sec. 32.   Effective January 1, 2002."},{"num":"66470","text":"The amending map or certificate of correction shall be prepared and signed by a registered civil engineer or licensed land surveyor. An amending map shall conform to the requirements of Section 66434, if a final map, or subdivisions (a) to (d), inclusive, and (f) to (i), inclusive, of Section 66445, if a parcel map. The amending map or certificate of correction shall set forth in detail the corrections made and show the names of the fee owners of the real property affected by the correction or omission on the date of the filing or recording of the original\nrecorded map. Upon recordation of a certificate of correction, the county recorder shall within 60 days of recording transmit a certified copy to the county surveyor or county engineer who shall maintain an index of recorded certificates of correction.\nThe county recorder may charge a fee, in addition to the fee charged for recording the certificate of correction, which shall be transmitted to the county surveyor or the county engineer, as compensation for the cost of maintaining an index of recorded certificates of correction. The amount of this additional fee shall not exceed the fee which is charged for recording the certificate of correction.\nIf the property affected by a map is located within a city, the county recorder shall, upon request of the city engineer, provide copies of recorded certificates of correction to the city engineer.","history":"Amended by Stats. 2001, Ch. 176, Sec. 33.   Effective January 1, 2002."},{"num":"66471","text":"(a) If the subdivision is in unincorporated territory, the county surveyor shall examine the amending map or certificate of correction and if the only changes made are those set forth in Section 66469, he or she shall certify to this fact on the amending map or certificate of correction. If the subdivision is in the city, such examination and certification shall be by the city surveyor or city engineer.\n(b) As to a certificate of correction, the county surveyor, city surveyor,\nor city engineer shall have 20 working days in which to examine the certificate of correction for compliance with Sections 66469 and 66470, endorse a statement on it of his or her examination and certification, and present it to the county recorder for recordation. In the event the submitted certificate of correction fails to comply with Sections 66469 and 66470, the county surveyor, city surveyor, or city engineer shall return it within the same 20 working days to the person who presented it, together with a written statement of the changes necessary to make it conform to the requirements of Sections 66469 and 66470. The licensed land surveyor or registered civil engineer submitting the certificate of correction may then make the changes in compliance with Sections 66469 and 66470 and resubmit the certificate of correction to the county surveyor, city surveyor, or city engineer for approval. The county surveyor, city surveyor, or city engineer shall have 10 working days after resubmission and approval of\nthe certificate of correction to present it to the county recorder for recordation.","history":"Amended by Stats. 1992, Ch. 634, Sec. 3.   Effective January 1, 1993."},{"num":"66472","text":"The amending map or certificate of correction certified by the county surveyor, city surveyor, or city engineer shall be filed or recorded in the office of the county recorder in which the original map was filed. Upon that filing or recordation, the county recorder shall index the names of the fee owners of the real property reflected on the original recorded map, and the appropriate tract designation shown on the amending map or certificate of correction in the general index and map index respectively. Thereupon, the original map shall be deemed to have been\nconclusively so corrected, and thereafter shall impart constructive notice of all those corrections in the same manner as though set forth upon the original map.","history":"Amended by Stats. 2001, Ch. 176, Sec. 34.   Effective January 1, 2002."},{"num":"66472.1","text":"In addition to the amendments authorized by Section 66469, after a final map or parcel map is filed in the office of the county recorder, the recorded final map may be modified by a certificate of correction or an amending map, if authorized by local ordinance, if the local agency finds that there are changes in circumstances that make any or all of the conditions of the map no longer appropriate or necessary and that the modifications do not impose any additional burden on the fee owners of the real property, and if the modifications do not alter any right,\ntitle, or interest in the real property reflected on the recorded map, and the local agency finds that the map as modified conforms to Section 66474. Any modification shall be set for public hearing as provided for in Section 66451.3. The local agency shall confine the hearing to consideration of, and action on, the proposed modification.","history":"Amended by Stats. 2007, Ch. 343, Sec. 13.   Effective January 1, 2008."}]}]},{"heading":"CHAPTER 4. Requirements [66473 - 66498]","articles":[{"heading":"ARTICLE 1. General [66473 - 66474.10]","sections":[{"num":"66473","text":"A local agency shall disapprove a map for failure to meet or perform any of the requirements or conditions imposed by this division or local ordinance enacted pursuant thereto; provided that a final map shall be disapproved only for failure to meet or perform requirements or conditions which were applicable to the subdivision at the time of approval of the tentative map; and provided further that such disapproval shall be accompanied by a finding identifying the requirements or conditions which have not been met or performed. Such local ordinance shall include, but need not be limited to, a procedure for waiver of the provisions of this section when the failure of the map is the result of a technical and inadvertent error which, in the determination of the local agency, does not materially affect the validity of the map.","history":"Amended by Stats. 1976, Ch. 21."},{"num":"66473.1","text":"(a) The design of a subdivision for which a tentative map is required pursuant to Section 66426 shall provide, to the extent feasible, for future passive or natural heating or cooling opportunities in the subdivision.\n(b) (1) Examples of passive or natural heating opportunities in subdivision design, include design of lot size and configuration to permit orientation of a structure in an east-west alignment for southern exposure.\n(2) Examples of passive or natural cooling opportunities in subdivision design include design of lot size and configuration to permit orientation of a structure to take advantage of shade or prevailing breezes.\n(c) In providing for future passive or natural heating or cooling opportunities in the design of a subdivision, consideration shall be given to local climate, to contour, to configuration of the parcel to be divided, and to other design and improvement requirements, and that provision shall not result in reducing allowable densities or the percentage of a lot that may be occupied by a building or structure under applicable planning and zoning in effect at the time the tentative map is filed.\n(d) The requirements of this section do not apply to condominium projects which consist of the subdivision of airspace in an existing building when no new structures are added.\n(e) For the purposes of this section, “feasible” means capable of being accomplished in a successful manner within a reasonable period of time, taking into account economic, environmental, social and technological factors.","history":"Amended by Stats. 2001, Ch. 873, Sec. 3.   Effective January 1, 2002."},{"num":"66473.3","text":"The legislative body of a city or county may, by ordinance, require the design of a subdivision for which a tentative map or parcel map is required pursuant to Section 66426 to provide for appropriate cable television systems and for communication systems, including, but not limited to, telephone and Internet services, to each parcel in the subdivision.\n“Appropriate cable television systems,” as used in this section, means those franchised or licensed to serve the geographical area in which the subdivision is located.\nThis section shall not apply to the conversion of existing dwelling units to condominiums, community apartments, or stock cooperatives.","history":"Amended by Stats. 2004, Ch. 479, Sec. 3.   Effective January 1, 2005."},{"num":"66473.5","text":"No local agency shall approve a tentative map, or a parcel map for which a tentative map was not required, unless the legislative body finds that the proposed subdivision, together with the provisions for its design and improvement, is consistent with the general plan required by Article 5 (commencing with Section 65300) of Chapter 3 of Division 1, or any specific plan adopted pursuant to Article 8 (commencing with Section 65450) of Chapter 3 of Division 1.\nA proposed subdivision shall be consistent with a general plan or a specific plan only if the local agency has officially adopted such a plan and the proposed subdivision or land use is compatible with the objectives, policies, general land uses, and programs specified in such a plan.","history":"Amended by Stats. 1983, Ch. 101, Sec. 89."},{"num":"66473.6","text":"Whenever a city or county imposes as a condition to its approval of a tentative map or a parcel map a requirement that necessitates replacing, undergrounding, or permanently or temporarily relocating existing facilities of a telephone corporation or cable television system, the developer or subdivider shall reimburse the telephone corporation or cable television system for all costs for the replacement, undergrounding, or relocation. All these costs shall be billed after they are incurred, and shall include a credit for any required advance payments and for the salvage value of any facilities replaced. In no event shall the telephone corporation or cable television system be reimbursed for costs incurred in excess of the cost to replace the facilities with substantially similar facilities.","history":"Added by Stats. 1985, Ch. 865, Sec. 1."},{"num":"66473.7","text":"(a) For the purposes of this section, the following definitions apply:\n(1) “Subdivision” means a proposed residential development of more than 500 dwelling units, except that for a public water system that has fewer than 5,000 service connections, “subdivision” means any proposed residential development that would account for an increase of 10 percent or more in the number of the public water system’s existing service connections.\n(2) “Sufficient water supply” means the total water supplies available during normal, single-dry, and multiple-dry years within a 20-year projection that will\nmeet the projected demand associated with the proposed subdivision, in addition to existing and planned future uses, including, but not limited to, agricultural and industrial uses. In determining “sufficient water supply,” all of the following factors shall be considered:\n(A) The availability of water supplies over a historical record of at least 20 years.\n(B) The applicability of an urban water shortage contingency analysis prepared pursuant to Section 10632 of the Water Code that includes actions to be undertaken by the public water system in response to water supply shortages.\n(C) The reduction in water supply allocated to a specific water use sector pursuant to a resolution or ordinance adopted, or a contract\nentered into, by the public water system, as long as that resolution, ordinance, or contract does not conflict with Section 354 of the Water Code.\n(D) The amount of water that the water supplier can reasonably rely on receiving from other water supply projects, such as conjunctive use, reclaimed water, water conservation, and water transfer, including programs identified under federal, state, and local water initiatives such as CALFED and Colorado River tentative agreements, to the extent that these water supplies meet the criteria of subdivision (d).\n(E) If a proposed subdivision relies in whole or in part on groundwater, the following factors:\n(i) For a basin for which a court or the State Water Resources Control\nBoard has adjudicated the rights to pump groundwater, the order or decree adopted by the court or the State Water Resources Control Board.\n(ii) For a basin that has not been adjudicated, as follows:\n(I) For a basin designated as high- or medium-priority pursuant to Section 10722.4 of the Water Code, the most recently adopted or revised adopted groundwater sustainability plan or approved alternative. If there is no adopted groundwater sustainability plan or approved alternative, information as to whether the Department of Water Resources has identified the basin or basins as overdrafted or has projected that the basin will become overdrafted if present management conditions continue.\n(II) For a basin designated as low- or\nvery low priority pursuant to Section 10722.4 of the Water Code, information as to whether the Department of Water Resources has identified the basin or basins as overdrafted or has projected that the basin will become overdrafted if present management conditions continue.\n(3) “Public water system” means the water supplier that is, or may become as a result of servicing the subdivision included in a tentative map pursuant to subdivision (b), a public water system, as defined in Section 10912 of the Water Code, that may supply water for a subdivision.\n(b) (1) The legislative body of a city or county or the advisory agency, to the extent that it is authorized by local ordinance to approve, conditionally approve, or disapprove the tentative map, shall include\nas a condition in any tentative map that includes a subdivision a requirement that a sufficient water supply shall be available. Proof of the availability of a sufficient water supply shall be requested by the subdivision applicant or local agency, at the discretion of the local agency, and shall be based on written verification from the applicable public water system within 90 days of a request.\n(2) If the public water system fails to deliver the written verification as required by this section, the local agency or any other interested party may seek a writ of mandamus to compel the public water system to comply.\n(3) If the written verification provided by the applicable public water system indicates that the public water system is unable to provide a sufficient water supply\nthat will meet the projected demand associated with the proposed subdivision, then the local agency may make a finding, after consideration of the written verification by the applicable public water system, that additional water supplies not accounted for by the public water system are, or will be, available prior to completion of the subdivision that will satisfy the requirements of this section. This finding shall be made on the record and supported by substantial evidence.\n(4) If the written verification is not provided by the public water system, notwithstanding the local agency or other interested party securing a writ of mandamus to compel compliance with this section, then the local agency may make a finding that sufficient water supplies are, or will be, available prior to completion of the subdivision that will satisfy the requirements\nof this section. This finding shall be made on the record and supported by substantial evidence.\n(c) The applicable public water system’s written verification of its ability or inability to provide a sufficient water supply that will meet the projected demand associated with the proposed subdivision as required by subdivision (b) shall be supported by substantial evidence. The substantial evidence may include, but is not limited to, any of the following:\n(1) The public water system’s most recently adopted urban water management plan adopted pursuant to Part 2.6 (commencing with Section 10610) of Division 6 of the Water Code.\n(2) A water supply assessment that was completed pursuant to Part 2.10 (commencing with\nSection 10910) of Division 6 of the Water Code.\n(3) A groundwater sustainability plan adopted or alternative approved pursuant to Part 2.74 (commencing with Section 10720) of Division 6 of the Water Code.\n(4) Other information relating to the sufficiency of the water supply that contains analytical information that is substantially similar to the assessment required by Section 10635 of the Water Code.\n(d) When the written verification pursuant to subdivision (b) relies on projected water supplies that are not currently available to the public water system, to provide a sufficient water supply to the subdivision, the written verification as to those projected water supplies shall be based on all of the following\nelements, to the extent each is applicable:\n(1) Written contracts or other proof of valid rights to the identified water supply that identify the terms and conditions under which the water will be available to serve the proposed subdivision.\n(2) Copies of a capital outlay program for financing the delivery of a sufficient water supply that has been adopted by the applicable governing body.\n(3) Securing of applicable federal, state, and local permits for construction of necessary infrastructure associated with supplying a sufficient water supply.\n(4) Any necessary regulatory approvals that are required in order to be able to convey or deliver a sufficient water\nsupply to the subdivision.\n(e) If there is no public water system, the local agency shall make a written finding of sufficient water supply based on the evidentiary requirements of subdivisions (c) and (d) and identify the mechanism for providing water to the subdivision.\n(f) In making any findings or determinations under this section, a local agency, or designated advisory agency, may work in conjunction with the project applicant and the public water system to secure water supplies sufficient to satisfy the demands of the proposed subdivision. If the local agency secures water supplies pursuant to this subdivision, which supplies are acceptable to and approved by the governing body of the public water system as suitable for delivery to customers, it shall work in conjunction with\nthe public water system to implement a plan to deliver that water supply to satisfy the long-term demands of the proposed subdivision.\n(g) The written verification prepared under this section shall also include a description, to the extent that data is reasonably available based on published records maintained by federal and state agencies, and public records of local agencies, of the reasonably foreseeable impacts of the proposed subdivision on the availability of water resources for agricultural and industrial uses within the public water system’s service area that are not currently receiving water from the public water system but are utilizing the same sources of water. To the extent that those reasonably foreseeable impacts have previously been evaluated in a document prepared pursuant to the California Environmental Quality Act (Division\n13 (commencing with Section 21000) of the Public Resources Code) or the National Environmental Policy Act (Public Law 91-190) for the proposed subdivision, the public water system may utilize that information in preparing the written verification.\n(h) Where a water supply for a proposed subdivision includes groundwater, the public water system serving the proposed subdivision shall evaluate, based on substantial evidence, the extent to which it or the landowner has the right to extract the additional groundwater needed to supply the proposed subdivision. Nothing in this subdivision is intended to modify state law with regard to groundwater rights.\n(i) This section shall not apply to any residential project proposed for a site that is within an urbanized area and has been previously developed for urban uses, or where the immediate contiguous properties surrounding the residential project site are, or previously have been, developed for urban uses, or housing projects that are exclusively for very low and low-income households.\n(j) The determinations made pursuant to this section shall be consistent with the obligation of a public water system to grant a priority for the provision of available and future water resources or services to proposed housing developments that help meet the city’s or county’s share of the regional housing needs for lower income households, pursuant to Section 65589.7.\n(k) The County of San Diego shall be deemed to comply with this section if the Office of Planning and Research determines that all of the following conditions have been met:\n(1) A regional growth management strategy that provides for a comprehensive regional strategy and a coordinated economic development and growth management program has been developed pursuant to Proposition C as approved by the voters of the County of San Diego in November 1988, which required the development of a regional growth management plan and directed the establishment of a regional planning and growth management review board.\n(2) Each public water system, as defined in Section 10912 of the Water Code, within the County of San Diego has\nadopted an urban water management plan pursuant to Part 2.6 (commencing with Section 10610) of the Water Code.\n(3) The approval or conditional approval of tentative maps for subdivisions, as defined in this section, by the County of San Diego and the cities within the county requires written communications to be made by the public water system to the city or county, in a format and with content that is substantially similar to the requirements contained in this section, with regard to the availability of a sufficient water supply, or the reliance on projected water supplies to provide a sufficient water supply, for a proposed subdivision.\n(l) Nothing in this section shall preclude the legislative body of a city or county, or the designated advisory agency, at the request of\nthe applicant, from making the determinations required in this section earlier than required pursuant to subdivision (b).\n(m) Nothing in this section shall be construed to create a right or entitlement to water service or any specific level of water service.\n(n) Nothing in this section is intended to change existing law concerning a public water system’s obligation to provide water service to its existing customers or to any potential future customers.\n(o) Any action challenging the sufficiency of the public water system’s written verification of a sufficient water supply shall be governed by Section 66499.37.","history":"Amended by Stats. 2016, Ch. 594, Sec. 1.   (SB 1262)   Effective January 1, 2017."},{"num":"66474","text":"A legislative body of a city or county shall deny approval of a tentative map, or a parcel map for which a tentative map was not required, if it makes any of the following findings:\n(a) That the proposed map is not consistent with applicable general and specific plans as specified in Section 65451.\n(b) That the design or improvement of the proposed subdivision is not consistent with applicable general and specific plans.\n(c) That the site is not physically suitable for the type of development.\n(d) That the site is not physically suitable for the proposed density of development.\n(e) That the design of the subdivision or the proposed improvements are likely to cause substantial environmental damage or substantially and avoidably injure fish or wildlife or their habitat.\n(f) That the design of the subdivision or type of improvements is likely to cause serious public health problems.\n(g) That the design of the subdivision or the type of improvements will conflict with easements, acquired by the public at large, for access through or use of, property within the proposed subdivision. In this connection, the governing body may approve a map if it finds that alternate easements, for access or for use, will be provided, and that these will be substantially equivalent to ones previously acquired by the public. This subsection shall apply only to easements of record or to easements established by judgment of a court of competent jurisdiction and no authority is hereby granted to a legislative body to determine that the public at large has acquired easements for access through or use of property within the proposed subdivision.","history":"Amended by Stats. 1982, Ch. 518, Sec. 4."},{"num":"66474.01","text":"Notwithstanding subdivision (e) of Section 66474, a local government may approve a tentative map, or a parcel map for which a tentative map was not required, if an environmental impact report was prepared with respect to the project and a finding was made pursuant to paragraph (3) of subdivision (a) of Section 21081 of the Public Resources Code that specific economic, social, or other considerations make infeasible the mitigation measures or project alternatives identified in the environmental impact report.","history":"Amended by Stats. 1994, Ch. 1294, Sec. 1.   Effective October 1, 1994."},{"num":"66474.02","text":"(a) Before approving a tentative map, or a parcel map for which a tentative map was not required, for an area located in a state responsibility area or a very high fire hazard severity zone, as both are defined in Section 51177, a legislative body of a county shall, except as provided in subdivision (b), make the following findings:\n(1) A finding supported by substantial evidence in the record that the subdivision is consistent with regulations adopted by the State Board of Forestry and Fire Protection pursuant to Sections 4290 and 4291 of the Public Resources Code or consistent with local ordinances certified by the State Board of Forestry and Fire Protection as meeting or exceeding the state regulations.\n(2) A finding supported by substantial evidence in the record that structural fire protection and suppression services will be available for the subdivision through any of the following entities:\n(A) A county, city, special district, political subdivision of the state, or another entity organized solely to provide fire protection services that is monitored and funded by a county or other public entity.\n(B) The Department of Forestry and Fire Protection by contract entered into pursuant to Section 4133, 4142, or 4144 of the Public Resources Code.\n(b) Upon approving a tentative map, or a parcel map for which a tentative map was not required, for an area located in a state responsibility area or a very high fire hazard severity zone, as both are defined in\nSection 51177, a legislative body of a county shall transmit a copy of the findings required in subdivision (a) and accompanying maps to the State Board of Forestry and Fire Protection.\n(c) (1) Subdivision (a) does not apply to the approval of a tentative map, or a parcel map for which a tentative map was not required, that would subdivide land identified in the open space element of the general plan for the managed production of resources, including, but not limited to, forest land, rangeland, agricultural land, and areas of economic importance for the production of food or fiber, if the subdivision is consistent with the open space purpose and if, for the subdivision of land that would result in parcels that are 40 acres or smaller in size, those parcels are subject to a binding and recorded restriction prohibiting the development of a habitable, industrial, or commercial building or structure. All other structures shall\ncomply with defensible space requirements described in Section 51182 of this code or Sections 4290 and 4291 of the Public Resources Code.\n(2) Any later approval to remove a binding restriction placed as a condition of a tentative map, or a parcel map for which a tentative map was not required, that would allow the development of a building or structure for a parcel that has previously been exempted from the requirements of subdivision (a) pursuant to paragraph (1) of this subdivision shall be subject to the requirements of subdivision (a).\n(d) This section does not supersede regulations established by the State Board of Forestry and Fire Protection or local ordinances that provide equivalent or more stringent minimum requirements than those contained within this section.","history":"Amended by Stats. 2018, Ch. 624, Sec. 5.   (SB 1260)   Effective January 1, 2019."},{"num":"66474.1","text":"A legislative body shall not deny approval of a final or parcel map if it has previously approved a tentative map for the proposed subdivision and if it finds that the final or parcel map is in substantial compliance with the previously approved tentative map.","history":"Amended by Stats. 1982, Ch. 87, Sec. 22.   Effective March 1, 1982."},{"num":"66474.2","text":"(a) Except as otherwise provided in subdivision (b) or (c), in determining whether to approve or disapprove an application for a tentative map, the local agency shall apply only those ordinances, policies, and standards in effect at the date the local agency has determined that the application is complete pursuant to Section 65943 of the Government Code.\n(b) Subdivision (a) shall not apply to a local agency which, before it has determined an application for a tentative map to be complete pursuant to Section 65943, has done both of the following:\n(1) Initiated proceedings by way of ordinance, resolution, or motion.\n(2) Published notice in the manner prescribed in subdivision (a) of Section 65090 containing a description sufficient to notify the public of the nature of the proposed change in the applicable general or specific plans, or zoning or subdivision ordinances.\nA local agency which has complied with this subdivision may apply any ordinances, policies, or standards enacted or instituted as a result of those proceedings which are in effect on the date the local agency approves or disapproves the tentative map.\n(c) If the subdivision applicant requests changes in applicable ordinances, policies or standards in connection with the same development project, any ordinances, policies or standards adopted pursuant to the applicant’s request shall apply.","history":"Amended by Stats. 1989, Ch. 847, Sec. 10."},{"num":"66474.3","text":"(a) If the legislative body of a city or county finds, based upon substantial evidence in the record, that any project for which a tentative map or a vesting tentative map has been approved will be affected by a previously enacted initiative measure to the extent that there is likely to be a default on land-secured bonds issued to finance infrastructure on the project, the legislative body shall allow that portion of the project served by that infrastructure to proceed in a manner consistent with the approved tentative map or vesting tentative map.\n(b) For purposes of this section, land-secured bond means any bond issued pursuant to the Improvement Act of 1911 (Division 7 (commencing with Section 5000) of the Streets and Highways Code), the Municipal Improvement Act of 1913 (Division 12 (commencing with Section 10000) of the Streets and Highways Code), the Improvement Bond Act of 1915 (Division 10 (commencing with Section 8500) of the Streets and Highways Code), or the Mello-Roos Community Facilities Act of 1982 (Chapter 2.5 (commencing with Section 53311) of Part 1 of Division 2 of Title 5, so long as the bond was issued and sold at least 90 days before the proposed initiative was adopted by either popular vote at an election or by ordinance adopted by the legislative body.\n(c) Notwithstanding subdivision (a), the legislative body may condition or deny a permit, approval, extension, or entitlement if it determines any of the following:\n(1) A failure to do so would place the residents of the subdivision or the immediate community, or both, in a condition dangerous to their health or safety, or both.\n(2) The condition or denial is required, in order to comply with state or federal law.\n(d) An approved or conditionally approved tentative or vesting tentative map shall be subject to the periods of time set forth in Section 66452.6.\n(e) The rights conferred by this section shall expire if a final map is not approved prior to the expiration of the tentative map or of the vesting tentative map.\n(f) An approved or conditionally approved tentative map or vesting tentative map shall not limit a legislative body from imposing reasonable conditions on subsequent required approvals or permits necessary for the development and authorized by the ordinances, policies, and standards described in Section 66474.2 or 66498.1.","history":"Added by Stats. 1988, Ch. 1561, Sec. 2."},{"num":"66474.4","text":"(a) The legislative body of a city or county shall deny approval of a tentative map, or a parcel map for which a tentative map was not required, if it finds that either the resulting parcels following a subdivision of that land would be too small to sustain their agricultural use or the subdivision will result in residential development not incidental to the commercial agricultural use of the land, and if the legislative body finds that the land is subject to any of the following:\n(1) A contract entered into pursuant to the California Land Conservation Act of 1965 (Chapter 7 (commencing with Section 51200) of Part 1 of Division 1 of Title 5), including an easement entered into pursuant to Section 51256.\n(2) An open-space easement entered into pursuant to the Open-Space Easement Act of 1974 (Chapter 6.6 (commencing with Section 51070) of Part 1 of Division 1 of Title 5).\n(3) An agricultural conservation easement entered into pursuant to Chapter 4 (commencing with Section 10260) of Division 10.2 of the Public Resources Code.\n(4) A conservation easement entered into pursuant to Chapter 4 (commencing with Section 815) of Part 2 of Division 2 of the Civil Code.\n(b) (1) For purposes of this section, land shall be conclusively presumed to be in parcels too small to sustain their agricultural use if the land is (A) less than 10 acres in size in the case of prime agricultural land, or (B) less than 40 acres in size in the case of land that is not prime agricultural land.\n(2) For purposes of this section, agricultural land shall be presumed to be in parcels large enough to sustain their agricultural use if the land is (A) at least 10 acres in size in the case of prime agricultural land, or (B) at least 40 acres in size in the case of land that is not prime agricultural land.\n(c) A legislative body may approve a subdivision with parcels smaller than those specified in this section if the legislative body makes either of the following findings:\n(1) The parcels can nevertheless sustain an agricultural use permitted under the contract or easement, or are subject to a written agreement for joint management pursuant to Section 51230.1 and the parcels that are jointly managed total at least 10 acres in size in the case of prime agricultural land or 40 acres in size in the case of land that is not prime agricultural land.\n(2) One of the parcels contains a residence and is subject to Section 428 of the Revenue and Taxation Code; the residence has existed on the property for at least five years; the landowner has owned the parcels for at least 10 years; and the remaining parcels shown on the map are at least 10 acres in size if the land is prime agricultural land, or at least 40 acres in size if the land is not prime agricultural land.\n(d) No other homesite parcels as described in paragraph (2) of subdivision (c) may be created on any remaining parcels under contract entered into pursuant to the California Land Conservation Act of 1965 (Chapter 7 (commencing with Section 51200) of Division 1 of Title 5) for at least 10 years following the creation of a homesite parcel pursuant to this section.\n(e) This section shall not apply to land that is subject to a contract entered into pursuant to the California Land Conservation Act of 1965 (Chapter 7 (commencing with Section 51200) of Division 1 of Title 5) when any of the following has occurred:\n(1) A local agency formation commission has approved the annexation of the land to a city and the city will not succeed to the contract as provided in Sections 51243 and 51243.5.\n(2) Written notice of nonrenewal of the contract has been served, as provided in Section 51245, and, as a result of that notice, there are no more than three years remaining in the term of the contract.\n(3) The board or council has granted tentative approval for cancellation of the contract as provided in Section 51282.\n(f) This section shall not apply during the three-year period preceding the termination of a contract described in paragraph (1) of subdivision (a).\n(g) This section shall not be construed as limiting the power of legislative bodies to establish minimum parcel sizes larger than those specified in subdivision (a).\n(h) This section does not limit the authority of a city or county to approve a tentative or parcel map with respect to land subject to an easement described in this section for which agriculture is the primary purpose if the resulting parcels can sustain uses consistent with the intent of the easement.\n(i) This section does not limit the authority of a city or county to approve a tentative or parcel map with respect to land subject to an easement described in this section for which agriculture is not the primary purpose if the resulting parcels can sustain uses consistent with the purposes of the easement.\n(j) Where an easement described in this section contains language addressing allowable land divisions, the terms of the easement shall prevail.\n(k) The amendments to this section made in the 2002 portion of the 2001–02 Regular Session of the Legislature shall apply only with respect to contracts or easements entered into on or after January 1, 2003.","history":"Amended by Stats. 2003, Ch. 296, Sec. 19.   Effective January 1, 2004."},{"num":"66474.5","text":"(a) Notwithstanding any other law, after the amendments required by Sections 65302.9 and 65860.1 have become effective, the legislative body of each city and county within the Sacramento-San Joaquin Valley shall deny approval of a tentative map, or a parcel map for which a tentative map was not required, for a subdivision that is located within a flood hazard zone unless the city or county finds, based on substantial evidence in the record, one of the following:\n(1) The facilities of the State Plan of Flood Control or other flood management facilities protect the subdivision to the urban level of flood protection in urban and urbanizing areas or the national Federal Emergency\nManagement Agency standard of flood protection in nonurbanized areas.\n(2) The city or county has imposed conditions on the subdivision that will protect the project to the urban level of flood protection in urban and urbanizing areas or the national Federal Emergency Management Agency standard of flood protection in nonurbanized areas.\n(3) The local flood management agency has made adequate progress on the construction of a flood protection system that will result in flood protection equal to or greater than the urban level of flood protection in urban or urbanizing areas or the national Federal Emergency Management Agency standard of flood protection in nonurbanized areas for property located within a flood hazard zone, intended to be protected by the system. Except as\nprovided in Sections 65962.1, 65962.2, and 65962.4, for urban and urbanizing areas protected by project levees, the urban level of flood protection shall be achieved by 2025.\n(4) The property in an undetermined risk area has met the urban level of flood protection based on substantial evidence in the record.\n(b) The effective date of amendments referred to in this section shall be the date upon which the statutes of limitation specified in subdivision (c) of Section 65009 have run or, if the amendments and any associated environmental documents are challenged in court, the validity of the amendments and any associated environmental documents has been upheld in a final decision.\n(c) This section does not change or diminish\nexisting requirements of local flood plain management laws, ordinances, resolutions, or regulations necessary to local agency participation in the national flood insurance program.","history":"Amended by Stats. 2025, Ch. 777, Sec. 4.   (SB 639)   Effective January 1, 2026."},{"num":"66474.6","text":"The governing body of any local agency shall determine whether the discharge of waste from the proposed subdivision into an existing community sewer system would result in violation of existing requirements prescribed by a California regional water quality control board pursuant to Division 7 (commencing with Section 13000) of the Water Code. In the event that the governing body finds that the proposed waste discharge would result in or add to violation of requirements of such board, it may disapprove the tentative map or maps of the subdivision.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66474.7","text":"The responsibilities of the governing body under the provisions of Sections 66473.5, 66474, 66474.1 and 66474.6 may be assigned to an advisory agency or appeal board provided the governing body adopts an ordinance which allows any interested person to appeal any decision of the advisory agency or the appeal board relative to such matters to the governing body. Such appellant shall be entitled to the same notice and rights regarding testimony as are accorded a subdivider under Section 66452.5.","history":"Added by Stats. 1974, Ch. 1536, Sec. 4.55."},{"num":"66474.8","text":"No ordinance, regulation, policy, or procedure which regulates or prescribes standards for grading or drainage, adopted by or applicable to a local agency pursuant to Section 17922 or 17958 of the Health and Safety Code, shall apply to the construction of design or improvement work, including the rough grading of lots within the subdivision, performed pursuant to, or in connection with an approved or conditionally approved tentative map, final map, or parcel map unless the local agency has no other applicable ordinance, regulation, policy, or procedure which regulates or prescribes standards for grading or drainage for subdivision design or improvement.","history":"Added by Stats. 1985, Ch. 1504, Sec. 6."},{"num":"66474.9","text":"(a) Except as provided in subdivision (b), a local agency may not require, as a condition for a tentative, parcel, or final map application or approval, that the subdivider or an agent of the subdivider, defend, indemnify, or hold harmless the local agency or its agents, officers, and employees from any claim, action, or proceeding against the local agency as a result of the action or inaction of the local agency, advisory agency, appeal board, or legislative body in reviewing, approving, or denying the map.\n(b) (1) A local agency may require, as a condition for a tentative, parcel, or final map application or approval, that the subdivider defend, indemnify, and hold harmless the local agency or its agents, officers, and employees from any claim, action, or proceeding against the local agency or its agents, officers, or employees to attack, set aside, void, or annul, an approval of the local agency, advisory agency, appeal board, or legislative body concerning a subdivision, which action is brought within the time period provided for in Section 66499.37.\n(2) Any condition imposed pursuant to this subdivision shall include the requirement that the local agency promptly notify the subdivider of any claim, action, or proceeding and that the local agency cooperate fully in the defense. If the local agency fails to promptly notify the subdivider of any claim, action, or proceeding, or if the local agency fails to cooperate fully in the defense, the subdivider shall not thereafter be responsible to defend, indemnify, or hold harmless the local agency.\n(c) Nothing contained in this section prohibits the local agency from participating in the defense of any claim, action, or proceeding, if both of the following occur:\n(1) The agency bears its own attorney’s fees and costs.\n(2) The agency defends the action in good faith.\n(d) The subdivider shall not be required to pay or perform any settlement unless the settlement is approved by the subdivider.","history":"Added by Stats. 1986, Ch. 789, Sec. 6."},{"num":"66474.10","text":"If the legislative body or advisory agency determines that engineering or land surveying conditions are to be imposed on a tentative map or a parcel map for which a tentative map was not required, those conditions shall be reviewed by the city engineer, city surveyor, county engineer or county surveyor, as appropriate, to determine compliance with generally accepted engineering or surveying practices.","history":"Added by Stats. 1989, Ch. 847, Sec. 11."}]},{"heading":"ARTICLE 2. Advisory Agencies [66474.60 - 66474.64]","sections":[{"num":"66474.60","text":"(a) In cities having a population of more than 2,800,000, the design, improvement and survey data of subdivisions and the form and content of tentative and final maps thereof, and the procedure to be followed in securing official approval are governed by the provisions of this chapter and by the additional provisions of local ordinances dealing with subdivisions, the enactment of which is required by this chapter.\n(b) Local ordinances may provide a proper and reasonable fee to be collected from the subdivider for the examination of tentative and final maps.","history":"Amended by Stats. 1982, Ch. 518, Sec. 5."},{"num":"66474.61","text":"In cities having a population of more than 2,800,000, the advisory agency, appeal board or legislative body shall deny approval of a tentative map, or a parcel map for which a tentative map was not required, if it makes any of the following findings:\n(a) That the proposed map is not consistent with applicable general and specific plans as specified in Section 65451.\n(b) That the design or improvement of the proposed subdivision is not consistent with applicable general and specific plans.\n(c) That the site is not physically suitable for the type of development.\n(d) That the site is not physically suitable for the proposed density of development.\n(e) That the design of the subdivision or the proposed improvements are likely to cause substantial environmental damage or substantially and avoidably injure fish or wildlife or their habitat.\n(f) That the design of the subdivision or the type of improvements is likely to cause serious public health problems.\n(g) That the design of the subdivision or the type of improvements will conflict with easements, acquired by the public at large, for access through or use of property within the proposed subdivision. In this connection, the legislative body may approve a map if it finds that alternate easements, for access or for use, will be provided, and that these will be substantially equivalent to ones previously acquired by the public.\nThis subdivision shall apply only to easements of record or to easements established by judgment of a court of competent jurisdiction and no authority is hereby granted to a legislative body to determine that the public at large has acquired easements for access through or use of property within the proposed subdivision.","history":"Amended by Stats. 1982, Ch. 518, Sec. 6."},{"num":"66474.62","text":"In cities having a population of more than 2,800,000, a legislative body shall not deny approval of a final subdivision map pursuant to Section 66474.61 if it, the advisory agency, or the appeal board has previously approved a tentative map for the proposed subdivision and if it finds that the final map is in substantial compliance with the previously approved tentative map and with the conditions to the approval thereof.","history":"Amended by Stats. 2008, Ch. 179, Sec. 115.   Effective January 1, 2009."},{"num":"66474.63","text":"In cities having a population of more than 2,800,000, the advisory agency, appeal board or legislative body shall determine whether the discharge of waste from the proposed subdivision into an existing community sewer system would result in violation of existing requirements prescribed by a California regional water quality control board pursuant to Division 7 (commencing with Section 13000) of the Water Code. In the event that the advisory agency, appeal board or legislative body finds that the proposed waste discharge would result in or add to violation of requirements of such board, the body making such finding may disapprove the tentative map or maps of the subdivision.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66474.64","text":"In cities having a population of more than 2,800,000, if the legislative body authorizes the advisory agency to report its action directly to the subdivider, the advisory agency shall, prior to making its report to the subdivider upon a subdivision as defined in this chapter, give notice of hearing in such manner as may be prescribed by local ordinance to the subdivider and to all property owners within 300 feet of the proposed subdivision and pursuant thereto shall conduct a public hearing at which time all persons interested in or affected by such proposed subdivision shall be heard.","history":"Added by Stats. 1974, Ch. 1536."}]},{"heading":"ARTICLE 3. Dedications [66475 - 66478]","sections":[{"num":"66475","text":"There may be imposed by local ordinance a requirement of dedication or irrevocable offer of dedication of real property within the subdivision for streets, alleys, including access rights and abutter’s rights, drainage, public utility easements and other public easements. Such irrevocable offers may be terminated as provided in subdivisions (c) and (d) of Section 66477.2.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66475.1","text":"Whenever a subdivider is required pursuant to Section 66475 to dedicate roadways to the public, the subdivider may also be required to dedicate additional land as may be necessary and feasible to provide bicycle paths for the use and safety of the residents of the subdivision.","history":"Amended by Stats. 2001, Ch. 873, Sec. 4.   Effective January 1, 2002."},{"num":"66475.2","text":"(a) There may be imposed by local ordinance a requirement of a dedication or an irrevocable offer of dedication of land within the subdivision for local transit facilities such as bus turnouts, benches, shelters, landing pads, and similar items that directly benefit the residents of a subdivision. The irrevocable offers may be terminated as provided in subdivisions (c) and (d) of Section 66477.2.\n(b) Only the payment of fees in lieu of the dedication of land may be required in subdivisions that consist of the subdivision of airspace in existing buildings into condominium projects, stock cooperatives, or community apartment projects, as those terms are defined in Sections 4105, 4125, and 4190 or Sections 6542 and 6566 of\nthe Civil Code.","history":"Amended (as amended by Stats. 2012, Ch. 181, Sec. 60) by Stats. 2013, Ch. 605, Sec. 34.   (SB 752)   Effective January 1, 2014."},{"num":"66475.3","text":"For divisions of land for which a tentative map is required pursuant to Section 66426, the legislative body of a city or county may by ordinance require, as a condition of the approval of a tentative map, the dedication of easements for the purpose of assuring that each parcel or unit in the subdivision for which approval is sought shall have the right to receive sunlight across adjacent parcels or units in the subdivision for which approval is sought for any solar energy system, provided that such ordinance contains all of the following:\n(1) Specifies the standards for determining the exact dimensions and locations of such easements.\n(2) Specifies any restrictions on vegetation, buildings and other objects which would obstruct the passage of sunlight through the easement.\n(3) Specifies the terms or conditions, if any, under which an easement may be revised or terminated.\n(4) Specifies that in establishing such easements consideration shall be given to feasibility, contour, configuration of the parcel to be divided, and cost, and that such easements shall not result in reducing allowable densities or the percentage of a lot which may be occupied by a building or a structure under applicable planning and zoning in force at the time such tentative map is filed.\n(5) Specifies that the ordinance is not applicable to condominium projects which consist of the subdivision of airspace in an existing building where no new structures are added.\nFor the purposes of this section, “solar energy systems” shall be defined as set forth in Section 801.5 of the Civil Code.\nFor purposes of this section, “feasibility” shall have the same meaning as set forth in Section 66473.1 for the term “feasible”.","history":"Added by Stats. 1978, Ch. 1154."},{"num":"66476","text":"There may be imposed by local ordinance a requirement that dedications or offers of dedication of streets include a waiver of direct access rights to any such street from any property shown on a final or parcel map as abutting thereon and if the dedication is accepted, any such waiver shall become effective in accordance with its provisions.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66477","text":"(a) The legislative body of a city or county may, by ordinance, require the dedication of land or impose a requirement of the payment of fees in lieu thereof, or a combination of both, for park or recreational purposes as a condition to the approval of a tentative map or parcel map, if all of the following requirements are met:\n(1) The ordinance has been in effect for a period of 30 days prior to the filing of the tentative map of the subdivision or parcel map.\n(2) The ordinance includes definite standards for determining the proportion of a subdivision to be dedicated and the amount of any fee to be paid in lieu thereof. The amount of land dedicated or fees paid shall be based upon the residential\ndensity, which shall be determined on the basis of the approved or conditionally approved tentative map or parcel map and the average number of persons per household. There shall be a rebuttable presumption that the average number of persons per household by units in a structure is the same as that disclosed by the most recent available federal census or a census taken pursuant to Chapter 17 (commencing with Section 40200) of Part 2 of Division 3 of Title 4. However, the dedication of land, or the payment of fees, or both, shall not exceed the proportionate amount necessary to provide three acres of park area per 1,000 persons residing within a subdivision subject to this section, unless the amount of existing neighborhood and community park area, as calculated pursuant to this subdivision, exceeds that limit, in which case the legislative body may adopt the calculated amount as a higher standard not to exceed five acres per 1,000 persons residing within a subdivision subject to this section.\n(A) The park area per 1,000 members of the population of the city, county, or local public agency shall be derived from the ratio that the amount of neighborhood and community park acreage bears to the total population of the city, county, or local public agency as shown in the most recent available federal census. The amount of neighborhood and community park acreage shall be the actual acreage of existing neighborhood and community parks of the city, county, or local public agency as shown on its records, plans, recreational element, maps, or reports as of the date of the most recent available federal census.\n(B) For cities incorporated after the date of the most recent available federal census, the park area per 1,000 members of the population of the city shall be derived from the ratio that the amount of neighborhood and community park acreage shown on the maps, records, or\nreports of the county in which the newly incorporated city is located bears to the total population of the new city as determined pursuant to Section 11005 of the Revenue and Taxation Code. In making any subsequent calculations pursuant to this section, the county in which the newly incorporated city is located shall not include the figures pertaining to the new city which were calculated pursuant to this paragraph. Fees shall be payable at the time of the recording of the final map or parcel map, or at a later time as may be prescribed by local ordinance.\n(3) (A) The land, fees, or combination thereof are to be used only for the purpose of developing new or rehabilitating existing neighborhood or community park or recreational facilities to serve the subdivision, except as provided in subparagraph (B).\n(B) Notwithstanding subparagraph (A), fees may be used\nfor the purpose of developing new or rehabilitating existing park or recreational facilities in a neighborhood other than the neighborhood in which the subdivision for which fees were paid as a condition to the approval of a tentative map or parcel map is located, if all of the following requirements are met:\n(i) The neighborhood in which the fees are to be expended has fewer than three acres of park area per 1,000 members of the neighborhood population.\n(ii) The neighborhood in which the subdivision for which the fees were paid has a park area per 1,000 members of the neighborhood population ratio that meets or exceeds the ratio calculated pursuant to subparagraph (A) of paragraph (2), but in no event is less than three acres per 1,000 persons.\n(iii) The legislative body holds a public hearing before using the fees\npursuant to this subparagraph.\n(iv) The legislative body makes a finding supported by substantial evidence that it is reasonably foreseeable that future inhabitants of the subdivision for which the fee is imposed will use the proposed park and recreational facilities in the neighborhood where the fees are used.\n(v) The fees are used within a specified radius that complies with the city’s or county’s ordinance adopted pursuant to subdivision (a), and are consistent with the adopted general plan or specific plan of the city or county. For purposes of this clause, “specified radius” includes a planning area, zone of influence, or other geographic region designated by the city or county, that otherwise meets the requirements of this section.\n(4) The legislative body has adopted a general plan or specific plan containing\npolicies and standards for parks and recreational facilities, and the park and recreational facilities are in accordance with definite principles and standards.\n(5) The amount and location of land to be dedicated or the fees to be paid shall bear a reasonable relationship to the use of the park and recreational facilities by the future inhabitants of the subdivision.\n(6) (A) The city, county, or other local public agency to which the land or fees are conveyed or paid shall develop a schedule specifying how, when, and where it will use the land or fees, or both, to develop park or recreational facilities to serve the residents of the subdivision. Any fees collected under the ordinance shall be committed within five years after the payment of the fees or the issuance of building permits on one-half of the lots created by the subdivision, whichever occurs later.\nIf the fees are not committed, they, without any deductions, shall be distributed and paid to the then record owners of the subdivision in the same proportion that the size of their lot bears to the total area of all lots within the subdivision.\n(B) The city, county, or other local agency to which the land or fees are conveyed or paid may enter into a joint or shared use agreement with one or more other public districts in the jurisdiction, including, but not limited to, a school district or community college district, in order to provide access to park or recreational facilities to residents of subdivisions with fewer than three acres of park area per 1,000 members of the population.\n(7) Only the payment of fees may be required in subdivisions containing 50 parcels or less, except that when a condominium project, stock cooperative, or community apartment project, as those terms\nare defined in Sections 4105, 4125, and 4190 of the Civil Code, exceeds 50 dwelling units, dedication of land may be required notwithstanding that the number of parcels may be less than 50.\n(8) Subdivisions containing less than five parcels and not used for residential purposes shall be exempted from the requirements of this section. However, in that event, a condition may be placed on the approval of a parcel map that if a building permit is requested for construction of a residential structure or structures on one or more of the parcels within four years, the fee may be required to be paid by the owner of each parcel as a condition of the issuance of the permit.\n(9) If the subdivider provides park and recreational improvements to the dedicated land, the value of the improvements together with any equipment located thereon shall be a credit against the payment of fees or\ndedication of land required by the ordinance.\n(b) Land or fees required under this section shall be conveyed or paid directly to the local public agency which provides park and recreational services on a communitywide level and to the area within which the proposed development will be located, if that agency elects to accept the land or fee. The local agency accepting the land or funds shall develop the land or use the funds in the manner provided in this section.\n(c) If park and recreational services and facilities are provided by a public agency other than a city or county, the amount and location of land to be dedicated or fees to be paid shall, subject to paragraph (2) of subdivision (a), be jointly determined by the city or county having jurisdiction and that other public agency.\n(d) This section does not apply\nto commercial or industrial subdivisions or to condominium projects or stock cooperatives that consist of the subdivision of airspace in an existing apartment building that is more than five years old when no new dwelling units are added.\n(e) Common interest developments, as defined in Section 4100 of the Civil Code, shall be eligible to receive a credit, as determined by the legislative body, against the amount of land required to be dedicated, or the amount of the fee imposed, pursuant to this section, for the value of private open space within the development which is usable for active recreational uses.\n(f) Park and recreation purposes shall include land and facilities for the activity of “recreational community gardening,” which activity consists of the cultivation by persons other than, or in addition to, the owner of the land, of plant material not for sale.\n(g) As used in this section with regard to the expenditure of fees, the term “fee” includes any interest income generated from a fee charged and collected pursuant to this section.\n(h) This section shall be known, and may be cited, as the Quimby Act.\n(i) This section shall become operative on January 1, 2021.","history":"Repealed (in Sec. 1) and added by Stats. 2015, Ch. 276, Sec. 2.   (AB 1191)   Effective January 1, 2016.   Section operative January 1, 2021, by its own provisions."},{"num":"66477.1","text":"(a) At the time the legislative body or the official designated pursuant to Section 66458 approves a final map, the legislative body or the designated official shall also accept, accept subject to improvement, or reject any offer of dedication. The clerk of the legislative body shall certify or state on the map the action by the legislative body or designated official.\n(b) The legislative body of a county, or a county officer designated by the legislative body, may accept into the county road system, pursuant to Section 941 of the Streets and Highways Code, any road for which an offer of dedication has been accepted or accepted subject to improvements.","history":"Amended by Stats. 1998, Ch. 604, Sec. 3.   Effective January 1, 1999."},{"num":"66477.2","text":"(a) If at the time the final map is approved, any streets, paths, alleys, public utility easements, rights-of-way for local transit facilities such as bus turnouts, benches, shelters, landing pads, and similar items, which directly benefit the residents of a subdivision, or storm drainage easements are rejected, subject to Section 771.010 of the Code of Civil Procedure, the offer of dedication shall remain open and the legislative body may by resolution at any later date, and without further action by the subdivider, rescind its action and accept and open the streets, paths, alleys, rights-of-way for local transit facilities such as bus turnouts, benches, shelters, landing pads, and similar items, which directly benefit the residents of a subdivision, or storm drainage easements for public use, which acceptance shall be recorded in the office of the county recorder.\n(b) In the case of any subdivision fronting upon the ocean coastline or bay shoreline, the offer of dedication of public access route or routes from public highways to land below the ordinary high watermark shall be accepted within three years after the approval of the final map; in the case of any subdivision fronting upon any public waterway, river, or stream, the offer of dedication of public access route or routes from public highways to the bank of the waterway, river, or stream and the public easement along a portion of the bank of the waterway, river, or stream shall be accepted within three years after the approval of the final map; in the case of any subdivision fronting upon any lake or reservoir which is owned in part or entirely by any public agency, including the state, the offer of dedication of public access route or routes from public highways to any water of the lake or reservoir shall be accepted within five years after the approval of the final map; all other offers of dedication may be accepted at any time.\n(c) Offers of dedication which are covered by subdivision (a) may be terminated and abandoned in the same manner as prescribed for the summary vacation of streets by Part 3 (commencing with Section 8300) of Division 9 of the Streets and Highways Code.\n(d) Offers of dedication which are not accepted within the time limits specified in subdivision (b) shall be deemed abandoned.\n(e) Except as provided in Sections 66499.16, 66499.17, and 66499.18, if a resubdivision or reversion to acreage of the tract is subsequently filed for approval, any offer of dedication previously rejected shall be deemed to be terminated upon the approval of the map by the legislative body. The map shall contain a notation identifying the offer or offers of dedication deemed terminated by this subdivision.","history":"Amended by Stats. 1994, Ch. 458, Sec. 9.   Effective January 1, 1995."},{"num":"66477.3","text":"Acceptance of offers of dedication on a final map shall not be effective until the final map is filed in the office of the county recorder or a resolution of acceptance by the legislative body is filed in such office.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66477.5","text":"(a) The local agency to which property is dedicated in fee for public purposes, or for making public improvements or constructing public facilities, other than for open space, parks, or schools, shall record a certificate with the county recorder in the county in which the property is located. The certificate shall be attached to the map and shall contain all of the following information:\n(1) The name and address of the subdivider dedicating the property.\n(2) A legal description of the real property dedicated.\n(3) A statement that the local agency shall reconvey the property to the subdivider if the local agency makes a determination pursuant to this section that the same public purpose for which the property was dedicated does not exist, or the property or any portion thereof is not needed for public utilities, as specified in subdivision (c).\n(b) The subdivider may request that the local agency make the determination that the same public purpose for which the dedication was required still exists, after payment of a fee which shall not exceed the amount reasonably required to make the determination. The determination may be made by reference to a capital improvement plan as specified in Section 65403 or 66002, an applicable general or specific plan requirement, the subdivision map, or other public documents that identify the need for the dedication.\n(c) If a local agency has determined that the same public purpose for which the dedication was required does not exist, it shall reconvey the property to the subdivider or the successor in interest, as specified in subdivision (a), except for all or any portion of the property that is required for that same public purpose or for public utilities.\n(d) If a local agency decides to vacate, lease, sell, or otherwise dispose of the dedicated property the local agency shall give at least 60 days notice to the subdivider whose name appears on the certificate before vacating, leasing, selling, or otherwise disposing of the dedicated property. This notice is not required if the dedicated property will be used for the same public purpose for which it was dedicated.\n(e) This section shall only apply to property required to be dedicated on or after January 1, 1990.","history":"Added by Stats. 1989, Ch. 822, Sec. 1."},{"num":"66478","text":"Whether by request of a county board of education or otherwise, a city or county may adopt an ordinance requiring any subdivider who develops or completes the development of one or more subdivisions in one or more school districts maintaining an elementary school to dedicate to the school district, or districts, within which such subdivisions are to be located, such land as the local legislative body shall deem to be necessary for the purpose of constructing thereon such elementary schools as are necessary to assure the residents of the subdivision adequate public school service. In no case shall the local legislative body require the dedication of an amount of land which would make development of the remaining land held by the subdivider economically unfeasible or which would exceed the amount of land ordinarily allowed under the procedures of the State Allocation Board.\nAn ordinance adopted pursuant to this section shall not be applicable to a subdivider who has owned the land being subdivided for more than 10 years prior to the filing of the tentative maps in accordance with Article 2 (commencing with Section 66452) of Chapter 3 of this division. The requirement of dedication shall be imposed at the time of approval of the tentative map. If, within 30 days after the requirement of dedication is imposed by the city or county, the school district does not offer to enter into a binding commitment with the subdivider to accept the dedication, the requirement shall be automatically terminated. The required dedication may be made any time before, concurrently with, or up to 60 days after, the filing of the final map on any portion of the subdivision. The school district shall, in the event that it accepts the dedication, repay to the subdivider or his successors the original cost to the subdivider of the dedicated land, plus a sum equal to the total of the following amounts:\n(a) The cost of any improvements to the dedicated land since acquisition by the subdivider.\n(b) The taxes assessed against the dedicated land from the date of the school district’s offer to enter into the binding commitment to accept the dedication.\n(c) Any other costs incurred by the subdivider in maintenance of such dedicated land, including interest costs incurred on any loan covering such land.\nIf the land is not used by the school district, as a school site, within 10 years after dedication, the subdivider shall have the option to repurchase the property from the district for the amount paid therefor.\nThe school district to which the property is dedicated shall record a certificate with the county recorder in the county in which the property is located. The certificate shall contain the following information:\n(1) The name and address of the subdivider dedicating the property.\n(2) A legal description of the real property dedicated.\n(3) A statement that the subdivider dedicating the property has an option to repurchase the property if it is not used by the school district as a school site within 10 years after dedication.\n(4) Proof of the acceptance of the dedication by the school district and the date of the acceptance. The certificate shall be recorded not more than 10 days after the date of acceptance of the dedication. The subdivider shall have the right to compel the school district to record such certificate, but until such certificate is recorded, any rights acquired by any third party dealing in good faith with the school district shall not be impaired or otherwise affected by the option right of the subdivider.\nIf any subdivider is aggrieved by, or fails to agree to the reasonableness of any requirement imposed pursuant to this section, he may bring a special proceeding in the superior court pursuant to Section 66499.37.","history":"Added by Stats. 1974, Ch. 1536."}]},{"heading":"ARTICLE 3.5. Public Access to Public Resources [66478.1 - 66478.14]","sections":[{"num":"66478.1","text":"It is the intent of the Legislature, by the provisions of Sections 66478.1 through 66478.10 of this article to implement Section 4 of Article X of the California Constitution insofar as Sections 66478.1 through 66478.10 are applicable to navigable waters.","history":"Amended by Stats. 1986, Ch. 1019, Sec. 27."},{"num":"66478.2","text":"The Legislature finds and declares that the public natural resources of this state are limited in quantity and that the population of this state has grown at a rapid rate and will continue to do so, thus increasing the need for utilization of public natural resources. The increase in population has also increased demand for private property adjacent to public natural resources through real estate subdivision developments which resulted in diminishing public access to public natural resources.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66478.3","text":"The Legislature further finds and declares that it is essential to the health and well-being of all citizens of this state that public access to public natural resources be increased. It is the intent of the Legislature to increase public access to public natural resources.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66478.4","text":"(a) No local agency shall approve either a tentative or a final map of any proposed subdivision to be fronted upon a public waterway, river, or stream which does not provide, or have available, reasonable public access by fee or easement from a public highway to that portion of the bank of the river or stream bordering or lying within the proposed subdivision.\n(b) Reasonable public access shall be determined by the local agency in which the proposed subdivision is to be located. In making the determination of what shall be reasonable access, the local agency shall consider all of the following:\n(1) That access may be by highway, foot trail, bike trail, horse trail, or any other means of travel.\n(2) The size of the subdivision.\n(3) The type of riverbank and the various appropriate recreational, educational, and scientific uses, including, but not limited to, swimming, diving, boating, fishing, water skiing, scientific collection, and teaching.\n(4) The likelihood of trespass on private property and reasonable means of avoiding these trespasses.\n(c) A public waterway, river, or stream for the purposes of Sections 66477.2, 66478.4, 66478.5 and 66478.6 means those waterways, rivers and streams defined in Sections 100 through 106 of the Harbors and Navigation Code, any stream declared to be a public highway for fishing pursuant to Sections 25660 through 25662 of the Government Code, the rivers listed in Section 1505 of the Fish and Game Code as spawning areas, all waterways, rivers and streams downstream from any state or federal salmon or steelhead fish hatcheries.","history":"Amended by Stats. 2002, Ch. 1109, Sec. 2.
