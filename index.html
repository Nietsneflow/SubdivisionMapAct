  /* ---------- Main column ---------- */

    background: var(--bg);

    cursor: pointer;

    font: 700 1.28rem/1.3 Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    margin: 2.6rem 0 0.3rem;
    padding-top: 1.2rem;

    font: 700 1.02rem/1.3 Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;

    font-variant-numeric: tabular-nums;

  .sec-num a { text-decoration: none; color: inherit; }

  .sec-tools {

    display: flex;

    color: var(--muted);
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    font-size: 0.72rem;

  #results {

    width: 100%;

  #scrubber.drag ~ #scrub-label, #scrub-label.on { display: block; }
  @media print { #scrubber, #scrub-label { display: none !important; } }

  #top-btn {
    position: fixed;
    right: 1.2rem;
    bottom: 1.2rem;

    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);

  #top-btn:hover { color: var(--accent); border-color: var(--accent); }
  @media (min-width: 1151px) {
    body.searching #top-btn { right: calc(340px + 1.2rem); }
  }
  @media print { #top-btn { display: none !important; } }

  #toast {
    position: fixed;
    bottom: 1.2rem;
    left: 50%;
    transform: translateX(-50%);

  /* On narrower screens the results rail becomes a slide-over panel */

  /* ---------- Mobile ---------- */
  @media (max-width: 900px) {

      width: min(340px, 88vw);

    #sidebar.open { transform: translateX(0); }
    #menu-btn { display: block; }

      position: fixed;

      background: rgba(10, 15, 20, 0.45);

    .hint { display: none; }
    .searchwrap { flex: 1; width: auto; margin-left: 0; }
  }

  @media print {
    #sidebar, #topbar, #matchbar, .sec-tools, #scrim { display: none !important; }

    #reader { max-width: none; padding: 0; }
  }
</style>

/* Apply a saved theme choice before the page paints */
(function () {
  try {
    const saved = localStorage.getItem("theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.dataset.theme = saved;
    }
  } catch (e) { /* storage may be unavailable; fall back to OS preference */ }
})();
</script>

<script>
const DATA = {"title":"Subdivision Map Act","citation":"California Government Code, Title 7, Division 2 (Sections 66410-66499.41)","source":"https://leginfo.legislature.ca.gov/faces/codes_displayexpandedbranch.xhtml?tocCode=GOV&division=2.&title=7.&part=&chapter=&article=","scraped":"2026-07-26","chapters":[{"heading":"CHAPTER 1. General Provisions and Definitions [66410 - 66424.6]","articles":[{"heading":"ARTICLE 1. General Provisions [66410 - 66413.5]","sections":[{"num":"66410","text":"This division may be cited as the Subdivision Map Act.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66411","text":"Regulation and control of the design and improvement of subdivisions are vested in the legislative bodies of local agencies. Each local agency shall, by ordinance, regulate and control the initial design and improvement of common interest developments as defined in Section 4100 or 6534 of the Civil Code and subdivisions for which this division requires a tentative and final or parcel map. In the development, adoption, revision, and application of this type of ordinance, the local agency shall comply with the provisions of Section 65913.2. The ordinance shall specifically provide for proper grading and erosion control, including the prevention of sedimentation or damage to offsite property. Each local agency may by ordinance regulate and control other subdivisions, provided that the regulations are not more\nrestrictive than the regulations for those subdivisions for which a tentative and final or parcel map are required by this division, and provided further that the regulations shall not be applied to short-term leases (terminable by either party on not more than 30 days’ notice in writing) of a portion of the operating right-of-way of a railroad corporation as defined by Section 230 of the Public Utilities Code unless a showing is made in individual cases, under substantial evidence, that public policy necessitates the application of the regulations to those short-term leases in individual cases.","history":"Amended (as amended by Stats. 2012, Ch. 181, Sec. 55) by Stats. 2013, Ch. 605, Sec. 29.   (SB 752)   Effective January 1, 2014."},{"num":"66411.1","text":"(a) Notwithstanding Section 66428, whenever a local ordinance requires improvements for a division of land which is not a subdivision of five or more lots, the regulations shall be limited to the dedication of rights-of-way, easements, and the construction of reasonable offsite and onsite improvements for the parcels being created. Requirements for the construction of offsite and onsite improvements shall be noticed by a statement on the parcel map, on the instrument evidencing the waiver of the parcel map, or by a separate instrument and shall be recorded on, concurrently with, or prior to the parcel map or instrument of waiver of a parcel map being filed for record.\n(b) Notwithstanding Section 66428, fulfillment of the construction requirements shall not be required until the time a permit or other grant of approval for development of the parcel is issued by the local agency or, where provided by local ordinances, until the time the construction of the improvements is required pursuant to an agreement between the subdivider and the local agency, except that in the absence of an agreement, a local agency may require fulfillment of the construction requirements within a reasonable time following approval of the parcel map and prior to the issuance of a permit or other grant of approval for the development of a parcel upon a finding by the local agency that fulfillment of the construction requirements is necessary for either of the following reasons:\n(1) The public health and safety.\n(2) The required construction is a necessary prerequisite to the orderly development of the surrounding area.","history":"Amended by Stats. 1994, Ch. 655, Sec. 1.   Effective January 1, 1995."},{"num":"66411.5","text":"(a) Notwithstanding any other provision of this division, whenever a parcel map or final map is required to effectuate a judicial partition of property pursuant to subdivision (b) and pursuant to Section 872.040 of the Code of Civil Procedure, the local agency approving the parcel map or final map may establish the amount of any monetary exaction or any dedication or improvement requirement authorized by law as a condition of approving the parcel map or final map, but shall not require payment of the exaction, the undertaking of the improvement, or posting of security for future performance thereof and shall not accept any required offer of dedication until the time specified in subdivision (b).\n(b) This section applies to judicial partition of real property which is subject to a contract under Article 3 (commencing with Section 51240) of Chapter 7 of Part 1 of Division 1 of Title 5 and which will remain subject to that contract subsequent to the filing of the parcel map or final map. With respect to any parcel created by a parcel map or final map subject to this section, payment of exactions and acceptance of offers of dedication under this section shall be deferred by the local agency until the contract terminates or is canceled as to that parcel, except that no deferral is required under this subdivision as to fees and assessments that are due and payable for governmental services provided to the parcel prior to termination or cancellation of the contract. The applicants for a parcel map or final map subject to this section shall be personally liable for performance of obligations deferred under this section at the time they become due.","history":"Added by Stats. 1988, Ch. 494, Sec. 1."},{"num":"66411.7","text":"(a) Notwithstanding any other provision of this division and any local law, a local agency shall ministerially approve, as set forth in this section, a parcel map for an urban lot split only if the local agency determines that the parcel map for the urban lot split meets all the following requirements:\n(1) The parcel map subdivides an existing parcel to create no more than two new parcels of approximately equal lot area provided that one parcel shall not be smaller than 40 percent of the lot area of the original parcel proposed for subdivision.\n(2) (A) Except as provided in subparagraph (B), both newly created parcels are no smaller than 1,200 square feet.\n(B) A local agency may by ordinance adopt a smaller minimum lot size subject to ministerial approval under this subdivision.\n(3) The parcel being subdivided meets all the following requirements:\n(A) The parcel is located within a single-family residential zone.\n(B) The parcel subject to the proposed urban lot split is located within a city, the boundaries of which include some portion of either an urbanized area or urban cluster, as designated by the United States Census Bureau, or, for unincorporated areas, a legal parcel wholly within the boundaries of an urbanized area or urban cluster, as designated by the United States Census Bureau.\n(C) The parcel satisfies the requirements specified in\nsubparagraphs (B) to (K), inclusive, of paragraph (6) of subdivision (a) of Section 65913.4, as that section read on September 16, 2021.\n(D) The proposed urban lot split would not require demolition or alteration of any of the following types of housing:\n(i) Housing that is subject to a recorded covenant, ordinance, or law that restricts rents to levels affordable to persons and families of moderate, low, or very low income.\n(ii) Housing that is subject to any form of rent or price control through a public entity’s valid exercise of its police power.\n(iii) A parcel or parcels on which an owner of residential real property has exercised the owner’s rights under Chapter 12.75 (commencing with Section 7060) of Division 7 of Title 1 to withdraw\naccommodations from rent or lease within 15 years before the date that the development proponent submits an application.\n(iv) Housing that has been occupied by a tenant in the last three years.\n(E) The parcel is not located within a historical landmark property included on the State Historic Resources Inventory, as defined in Section 5020.1 of the Public Resources Code, or within a site that is designated or listed as a city or county landmark pursuant to a city or county ordinance.\n(F) The proposed urban lot split does not require demolition or alteration of either of the following:\n(i) A contributing structure located within either a historic district that is included on the California Register of Historical Resources or within a historic district\nlisted or designated pursuant to a city or county ordinance.\n(ii) An existing exterior structural wall of a structure located within either a historic district that is included on the California Register of Historical Resources or within a historic district listed or designated pursuant to a city or county ordinance.\n(G) The parcel has not been established through prior exercise of an urban lot split as provided for in this section.\n(H) Neither the owner of the parcel being subdivided nor any person acting in concert with the owner has previously subdivided an adjacent parcel using an urban lot split as provided for in this section.\n(b) An application for a parcel map for an urban lot split shall be approved in accordance with the following\nrequirements:\n(1) (A) A local agency shall approve or deny an application for a parcel map for an urban lot split ministerially without discretionary review.\n(B) An application for an urban lot split shall be considered and approved or denied within 60 days from the date the local agency receives a completed application. If the local agency has not approved or denied the completed application within 60 days, the application shall be deemed approved.\n(C) If a permitting agency denies an application for an urban lot split pursuant to subparagraph (B), the permitting agency shall, within the time period described in subparagraph (B), return in writing a full set of comments to the applicant with a list of items that are defective or deficient and a description of how the application can be remedied\nby the applicant.\n(2) A local agency shall approve an urban lot split only if it conforms to all applicable objective requirements of the Subdivision Map Act (Division 2 (commencing with Section 66410)), except as otherwise expressly provided in this section.\n(3) Notwithstanding Section 66411.1, a local agency shall not impose regulations that require dedications of rights-of-way or the construction of offsite improvements for the parcels being created as a condition of issuing a parcel map for an urban lot split pursuant to this section.\n(c) (1) Except as provided in paragraph (2), notwithstanding any local law, a local agency may impose objective zoning standards, objective subdivision standards, and objective design review standards that are related to the design or to improvements of a\nparcel, consistent with paragraph (3) of subdivision (b) and with subdivision (e), and are applicable to a parcel created by an urban lot split that do not conflict with this section.\n(2) A local agency shall not impose objective zoning standards, objective subdivision standards, and objective design review standards that would have the effect of physically precluding the construction of two units on either of the resulting parcels or that would result in a unit size of less than 800 square feet.\n(3) (A) Notwithstanding paragraph (2), no setback shall be required for an existing structure or a structure constructed in the same location and to the same dimensions as an existing structure.\n(B) Notwithstanding paragraph (2), in all other circumstances not described in subparagraph (A), a local\nagency may require a setback of up to four feet from the side and rear lot lines.\n(d) Notwithstanding subdivision (a), a local agency may deny an urban lot split if the building official makes a written finding, based upon a preponderance of the evidence, that the proposed housing development project would have a specific, adverse impact, as defined and determined in paragraph (2) of subdivision (d) of Section 65589.5, upon public health and safety for which there is no feasible method to satisfactorily mitigate or avoid the specific, adverse impact.\n(e) In addition to any conditions established in accordance with this section, a local agency may require any of the following conditions when considering an application for a parcel map for an urban lot split:\n(1) Easements required for the provision of public services\nand facilities.\n(2) A requirement that the parcels have access to, provide access to, or adjoin the public right-of-way.\n(3) Offstreet parking of up to one space per unit, except that a local agency shall not impose parking requirements in either of the following instances:\n(A) The parcel is located within one-half mile walking distance of either a high-quality transit corridor as defined in subdivision (b) of Section 21155 of the Public Resources Code, or a major transit stop as defined in Section 21064.3 of the Public Resources Code.\n(B) There is a car share vehicle located within one block of the parcel.\n(f) A local agency shall require that the uses allowed on a lot created by this\nsection be limited to residential uses.\n(g) (1) A local agency shall require an applicant for an urban lot split to sign an affidavit stating that the applicant intends to occupy one of the housing units as their principal residence for a minimum of three years from the date of the approval of the urban lot split.\n(2) This subdivision shall not apply to an applicant that is a “community land trust,” as defined in clause (ii) of subparagraph (C) of paragraph (11) of subdivision (a) of Section 402.1 of the Revenue and Taxation Code, or is a “qualified nonprofit corporation” as described in Section 214.15 of the Revenue and Taxation Code.\n(3) A local agency shall not impose additional owner occupancy standards, other than provided for in this subdivision, on an urban lot split pursuant to this\nsection.\n(h) A local agency shall require that a rental of any unit created pursuant to this section be for a term longer than 30 days.\n(i) A local agency shall not require, as a condition for ministerial approval of a parcel map application for the creation of an urban lot split, the correction of nonconforming zoning conditions.\n(j) (1) Notwithstanding any provision of Section 65852.21, 65915, Article 2 (commencing with Section 66314) or Article 3 (commencing with Section 66333) of Chapter 13 of Division 1, or this section, a local agency shall not be required to permit more than two units on a parcel created through the exercise of the authority contained within this section.\n(2) For the purposes of this section, “unit” means\nany dwelling unit, including, but not limited to, a unit or units created pursuant to Section 65852.21, a primary dwelling, an accessory dwelling unit as defined in subdivision (a) of Section 66313, or a junior accessory dwelling unit as defined in subdivision (d) of Section 66313.\n(k) Notwithstanding paragraph (3) of subdivision (c), an application shall not be rejected solely because it proposes adjacent or connected structures provided that the structures meet building code safety standards and are sufficient to allow separate conveyance.\n(l) For purposes of this section, both of the following shall apply:\n(1) “Objective zoning standards,” “objective subdivision standards,” and “objective design review standards” mean standards that involve no personal or subjective judgment by a public official and are uniformly verifiable by reference to an external and uniform benchmark or criterion available and knowable by both the development applicant or proponent and the public official prior to submittal. These standards may be embodied in alternative objective land use specifications adopted by a local agency, and may include, but are not limited to, housing overlay zones, specific plans, inclusionary zoning ordinances, and density bonus ordinances.\n(2) “Local agency” means a city, county, or city and county, whether general law or chartered.\n(m) A local agency may adopt an ordinance to implement the provisions of this section. An ordinance adopted to implement this section shall not be considered a project under Division 13 (commencing with Section 21000) of the Public Resources Code.\n(n) Nothing in this section shall be construed to supersede or in any way alter or lessen the effect or application of the California Coastal Act of 1976 (Division 20 (commencing with Section 30000) of the Public Resources Code), except that the local agency shall not be required to hold public hearings for coastal development permit applications for urban lot splits pursuant to this section.","history":"Amended by Stats. 2026, Ch. 56, Sec. 9.   (SB 1426)   Effective June 30, 2026."},{"num":"66412","text":"This division shall be inapplicable to any of the following:\n(a) The financing or leasing of apartments, offices, stores, or similar space within apartment buildings, industrial buildings, commercial buildings, mobilehome parks, or trailer parks.\n(b) Mineral, oil, or gas leases.\n(c) Land dedicated for cemetery purposes under the Health and Safety Code.\n(d) A lot line adjustment between four or fewer existing adjoining parcels, where the land taken from one parcel is added to an adjoining parcel, and where a greater number of\nparcels than originally existed is not thereby created, if the lot line adjustment is approved by the local agency, or advisory agency. A local agency or advisory agency shall limit its review and approval to a determination of whether or not the parcels resulting from the lot line adjustment will conform to the local general plan, any applicable specific plan, any applicable coastal plan, and zoning and building ordinances. An advisory agency or local agency shall not impose conditions or exactions on its approval of a lot line adjustment except to conform to the local general plan, any applicable specific plan, any applicable coastal plan, and zoning and building ordinances, to require the prepayment of real property taxes prior to the approval of the lot line adjustment, or to facilitate the relocation of existing utilities, infrastructure, or easements. No tentative map, parcel map, or final\nmap shall be required as a condition to the approval of a lot line adjustment. The lot line adjustment shall be reflected in a deed, which shall be recorded. No record of survey shall be required for a lot line adjustment unless required by Section 8762 of the Business and Professions Code. A local agency shall approve or disapprove a lot line adjustment pursuant to the Permit Streamlining Act (Chapter 4.5 (commencing with Section 65920) of Division 1).\n(e) Boundary line or exchange agreements to which the State Lands Commission or a local agency holding a trust grant of tide and submerged lands is a party.\n(f) Any separate assessment under Section 2188.7 of the Revenue and Taxation Code.\n(g) The conversion of a\ncommunity apartment project, as defined in Section 4105 of the Civil Code, to a condominium, as defined in Section 783 of the Civil Code, but only if all of the following requirements are met:\n(1) The property was subdivided before January 1, 1982, as evidenced by a recorded deed creating the community apartment project.\n(2) Subject to compliance with Sections 4290 and 4295 of the Civil Code, all conveyances and other documents necessary to effectuate the conversion shall be executed by the required number of owners in the project as specified in the bylaws or other organizational documents. If the bylaws or other organizational documents do not expressly specify the number of owners necessary to execute the conveyances and other documents, a majority of owners in the\nproject shall be required to execute the conveyances or other documents. Conveyances and other documents executed under the foregoing provisions shall be binding upon and affect the interests of all parties in the project.\n(3) If subdivision, as defined in Section 66424, of the property occurred after January 1, 1964, both of the following requirements are met:\n(A) A final or parcel map of that subdivision was approved by the local agency and recorded, with all of the conditions of that map remaining in effect after the conversion.\n(B) No more than 49 percent of the units in the project were owned by any one person as defined in Section 17, including an incorporator or director of the community apartment project, on January\n1, 1982.\n(4) The local agency certifies that the above requirements were satisfied if the local agency, by ordinance, provides for that certification.\n(h) The conversion of a stock cooperative, as defined in Section 4190 or 6566 of the Civil Code, to a condominium, as defined in Section 783 of the Civil Code, but only if all of the following requirements are met:\n(1) The property was subdivided before January 1, 1982, as evidenced by a recorded deed creating the stock cooperative, an assignment of lease, or issuance of shares to a stockholder.\n(2) A person renting a unit in a cooperative shall be entitled at the time of conversion to all tenant rights in state\nor local law, including, but not limited to, rights respecting first refusal, notice, and displacement and relocation benefits.\n(3) Subject to compliance with Sections 4290 and 4295, or with Sections 6626 and 6628, of the Civil Code, all conveyances and other documents necessary to effectuate the conversion shall be executed by the required number of owners in the cooperative as specified in the bylaws or other organizational documents. If the bylaws or other organizational documents do not expressly specify\nthe number of owners necessary to execute the conveyances and other documents, a majority of owners in the cooperative shall be required to execute the conveyances or other documents. Conveyances and other documents executed under the foregoing provisions shall be binding upon and affect the interests of all parties in the cooperative.\n(4) If subdivision, as defined in Section 66424, of the property occurred after January 1, 1980, both of the following requirements are met:\n(A) A final or parcel map of that subdivision was approved by the local agency and recorded, with all of the conditions of that map remaining in effect after the conversion.\n(B) No more than 49 percent of the shares in the\nproject were owned by any one person as defined in Section 17, including an incorporator or director of the cooperative, on January 1, 1982.\n(5) The local agency certifies that the above requirements were satisfied if the local agency, by ordinance, provides for that certification.\n(i) The leasing of, or the granting of an easement to, a parcel of land, or any portion or portions thereof, in conjunction with the financing, erection, and sale or lease of a wind powered electrical generation device on the land, if the project is subject to discretionary action by the advisory agency or legislative body.\n(j) The leasing or licensing of a portion of a parcel, or the granting of an easement, use permit, or similar right on a portion of\na parcel, to a telephone corporation as defined in Section 234 of the Public Utilities Code, exclusively for the placement and operation of cellular radio transmission facilities, including, but not limited to, antennae support structures, microwave dishes, structures to house cellular communications transmission equipment, power sources, and other equipment incidental to the transmission of cellular communications, if the project is subject to discretionary action by the advisory agency or legislative body.\n(k) Leases of agricultural land for agricultural purposes. As used in this subdivision, “agricultural purposes” means the cultivation of food or fiber, or the grazing or pasturing of livestock.\n(l) The leasing of, or the granting of an easement to, a parcel of land, or any\nportion or portions thereof, in conjunction with the financing, erection, and sale or lease of a solar electrical generation device on the land, if the project is subject to review under other local agency ordinances regulating design and improvement or, if the project is subject to other discretionary action by the advisory agency or legislative body.\n(m) The leasing of, or the granting of an easement to, a parcel of land or any portion or portions of the land in conjunction with a biogas project that uses, as part of its operation, agricultural waste or byproducts from the land where the project is located and reduces overall emissions of greenhouse gases from agricultural operations on the land if the project is subject to review under other local agency ordinances regulating design and improvement or if the project is subject to\ndiscretionary action by the advisory agency or legislative body.\n(n) The leasing of, or the granting of an easement to, a parcel of land, or any portion or portions thereof, in conjunction with the financing, erection, and sale or lease of an electrical energy storage system on the land, if the project is subject to discretionary action by the advisory agency or legislative body. For the purposes of this subdivision, “energy storage system” has the same meaning as defined in Section 2835 of the Public Utilities Code.\n(o) The leasing of, or the granting of an easement to, a parcel of land or any portion or portions of the land in conjunction with a hydrogen fueling station or an electric vehicle charging station, if the project is subject to discretionary action by the advisory agency or legislative body. For purposes of this subdivision, “hydrogen fueling station” and “electric vehicle charging station” have the same meanings as defined in Section 65850.7.","history":"Amended by Stats. 2024, Ch. 591, Sec. 1.   (SB 347)   Effective January 1, 2025."},{"num":"66412.1","text":"This division shall also be inapplicable to:\n(a) The financing or leasing of any parcel of land, or any portion thereof, in conjunction with the construction of commercial or industrial buildings on a single parcel, unless the project is not subject to review under other local agency ordinances regulating design and improvement.\n(b) The financing or leasing of existing separate commercial or industrial buildings on a single parcel.","history":"Amended by Stats. 1982, Ch. 87, Sec. 4.   Effective March 1, 1982."},{"num":"66412.2","text":"This division shall not apply to the construction, financing, or leasing of dwelling units pursuant to Section 65852.1 or accessory dwelling units pursuant to Article 2 (commencing with Section 66314) of Chapter 13 of Division 1, but this division shall be applicable to the sale or transfer, but not leasing, of those units.","history":"Amended by Stats. 2024, Ch. 7, Sec. 22.   (SB 477)   Effective March 25, 2024."},{"num":"66412.3","text":"In carrying out the provisions of this division, each local agency shall consider the effect of ordinances and actions adopted pursuant to this division on the housing needs of the region in which the local jurisdiction is situated and balance these needs against the public service needs of its residents and available fiscal and environmental resources.","history":"Added by renumbering Section 66412.2 by Stats. 1983, Ch. 1013, Sec. 1.   Effective September 22, 1983."},{"num":"66412.5","text":"When so provided by local ordinance, this division shall be inapplicable to subdivisions of four parcels or less for construction of removable commercial buildings having a floor area of less than 100 square feet.","history":"Added by Stats. 1977, Ch. 412."},{"num":"66412.6","text":"(a) For purposes of this division or of a local ordinance enacted pursuant thereto, any parcel created prior to March 4, 1972, shall be conclusively presumed to have been lawfully created if the parcel resulted from a division of land in which fewer than five parcels were created and if at the time of the creation of the parcel, there was no local ordinance in effect which regulated divisions of land creating fewer than five parcels.\n(b) For purposes of this division or of a local ordinance enacted pursuant thereto, any parcel created prior to March 4, 1972, shall be conclusively presumed to have been lawfully created if any subsequent purchaser acquired that parcel for valuable consideration without actual or constructive knowledge of a violation of this division or the local ordinance. Owners of parcels or units of land affected by the provisions of this subdivision shall be required to obtain a certificate of compliance or a conditional certificate of compliance pursuant to Section 66499.35 prior to obtaining a permit or other grant of approval for development of the parcel or unit of land. For purposes of determining whether the parcel or unit of land complies with the provisions of this division and of local ordinances enacted pursuant thereto, as required pursuant to subdivision (a) of Section 66499.35, the presumption declared in this subdivision shall not be operative.\n(c) This section shall become operative January 1, 1995.","history":"Amended (as added by Stats. 1988, Ch. 1041, Sec. 2) by Stats. 1993, Ch. 500, Sec. 2.   Effective January 1, 1994.   Section operative January 1, 1995, by its own provisions."},{"num":"66412.7","text":"A subdivision shall be deemed established for purposes of subdivision (d) of Section 66499.30 and any other provision of this division on the date of recordation of the final map or parcel map, except that in the case of (1) maps filed for approval prior to March 4, 1972, and subsequently approved by the local agency or (2) subdivisions exempted from map requirements by a certificate of exception (or the equivalent) applied for prior to such date and subsequently issued by the local agency pursuant to local ordinance, the subdivision shall be deemed established on the date the map or application for a certificate of exception (or the equivalent) was filed with the local agency.","history":"Added by Stats. 1980, Ch. 479."},{"num":"66412.8","text":"(a) A project located in Los Angeles County that is approved by a public agency before the effective date of the act adding this section is not in violation of any requirement of this division by reason of the failure to construct a roadway across the property transferred to the state pursuant to subdivision (c) of Section 21080.29 of the Public Resources Code and to construct a bridge over the adjacent Ballona Channel in Los Angeles County, otherwise required as a condition of approval of a vesting tentative map or a tentative map, if all of the following conditions apply:\n(1) The improvements specified in subdivision (a) are not constructed, due in whole or in part, to the project owner’s or developer’s relinquishment of easement rights to construct the improvements.\n(2) The easement rights specified in paragraph (1) are relinquished in connection with the acquisition by the State of California, acting by and through the Wildlife Conservation Board of the Department of Fish and Game, of a wetlands project that is a minimum of 400 acres in size and located in the coastal zone.\n(b) Where the easement rights have been relinquished, any municipal ordinance or regulation adopted by a charter city or a general law city shall be inapplicable to the extent that the ordinance or regulation requires construction of the transportation improvements specified in subdivision (a), or would otherwise require reprocessing or resubmittal of a permit or approval, including, but not limited to, a final recorded map, a vesting tentative map, or a tentative map, as a result of the transportation improvements specified in subdivision (a) not being constructed.","history":"Added by Stats. 2003, Ch. 739, Sec. 1.   Effective January 1, 2004."},{"num":"66412.9","text":"This division shall not apply to leases of agriculturally zoned land to nonprofit organizations for the purpose of operating an agricultural labor housing project on the property if all of the following conditions apply:\n(1) The property to be leased shall not be more than five acres.\n(2) The lease shall be for not less than 30 years.\n(3) The lease shall be executed prior to January 1, 2017.","history":"Added by Stats. 2009, Ch. 447, Sec. 1.   (AB 494)   Effective January 1, 2010."},{"num":"66413","text":"(a) When any area in a subdivision as to which a final map has been finally approved by a board of supervisors and filed for record pursuant to this division is thereafter annexed to a city, the final map and any agreements relating to the subdivision shall continue to govern the subdivision.\n(b) When any area in a subdivision or proposed subdivision as to which a tentative map or vesting tentative map has been filed but a final map has not been finally approved, or as to which a parcel map is required by this division or local ordinance but the final act required to make the parcel map effective has not been taken, is annexed to a city, all procedures and regulations required by this division or by local ordinance of the annexing city shall be deemed to commence as of the effective date of the annexation and the map shall comply with the requirements of any applicable ordinance of the city to which the area is annexed.","history":"Amended by Stats. 1986, Ch. 613, Sec. 1."},{"num":"66413.5","text":"(a) When any area in a subdivision or proposed subdivision as to which a tentative map meeting the criteria of this section has been approved by a board of supervisors is incorporated into a newly incorporated city, the newly incorporated city shall approve the final map if it meets all of the conditions of the tentative map and meets the requirements and conditions for approval of final maps as provided in Article 4 (commencing with Section 66456), and other requirements of this division.\n(b) When any area in a subdivision or proposed subdivision as to which a vesting tentative map meeting the criteria of this section has been approved by a board of supervisors is incorporated into a newly incorporated city, the newly incorporated city shall approve the final map and give effect to the vesting tentative map as provided in Chapter 4.5 (commencing with Section 66498.1), if the final map meets all of the conditions of the vesting tentative map and meets the requirements and conditions for approval of final maps as provided in Article 4 (commencing with Section 66456), Chapter 4.5 (commencing with Section 66498.1), and other requirements of this division.\n(c) Notwithstanding subdivisions (a) and (b), the newly incorporated city may condition or deny a permit, approval, or extension, or entitlement if it determines either of the following:\n(1) Failure to do so would place the residents of the subdivision or the immediate community, or both, in a condition dangerous to their health or safety, or both.\n(2) The condition or denial is required, in order to comply with state or federal law.\n(d) The rights conferred by this section shall expire if a final map application is not timely filed prior to the expiration of the tentative or vesting tentative map. Prior to the approval of the final map, the rights conferred by this section shall be subject to the applicable time periods set forth in Section 66452.6, which shall not exceed eight years from the date of the incorporation unless an applicant and the newly incorporated city mutually agree to a longer period provided by this division.\n(e) An approved tentative map or vesting tentative map shall not limit a newly incorporated city from imposing reasonable conditions on subsequent required approvals or permits necessary for the development, and authorized by the ordinances, policies, and standards described in Section 66474.2.\n(f) Except as otherwise provided in subdivision (g), this section applies to any approved tentative map or approved vesting tentative map that meets both of the following requirements:\n(1) The application for the tentative map or the vesting tentative map is submitted prior to the date that the first signature was affixed to the petition for incorporation pursuant to Section 56704, regardless of the validity of the first signature, or the adoption of the resolution pursuant to Section 56800, whichever occurs first.\n(2) The county approved the tentative map or the vesting tentative map prior to the date of the election on the question of incorporation.\n(g) This section does not apply to any territory for which the effective date of the incorporation is prior to January 1, 1999.\n(h) It is not the intent of the Legislature to influence or affect any litigation pending on or initiated before January 1, 1999.","history":"Added by Stats. 1998, Ch. 689, Sec. 7.5.   Effective January 1, 1999."}]},{"heading":"ARTICLE 2. Definitions [66414 - 66424.6]","sections":[{"num":"66414","text":"The definitions in this article apply to the provisions of this division only and do not affect any other provisions of law.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66415","text":"“Advisory agency” means a designated official or an official body charged with the duty of making investigations and reports on the design and improvement of proposed divisions of real property, the imposing of requirements or conditions thereon, or having the authority by local ordinance to approve, conditionally approve or disapprove maps.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66416","text":"“Appeal board” means a designated board or other official body charged with the duty of hearing and making determinations upon appeals with respect to divisions of real property, the imposition of requirements or conditions thereon, or the kinds, nature and extent of the design or improvements, or both, recommended or decided by the advisory agency to be required.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66416.5","text":"(a) “City engineer” means the person authorized to perform the functions of a city engineer. The land surveying functions of a city engineer may be performed by a city surveyor, if that position has been created by the local agency.\n(b) A city engineer registered as a civil engineer after January 1, 1982, shall not be authorized to prepare, examine, or approve the surveying maps and documents. The examinations, certifications, and approvals of the surveying maps and documents shall only be performed by a person authorized to practice land surveying pursuant to the Professional Land Surveyors Act (Chapter 15 (commencing with Section 8700) of Division 3 of the Business and Professions Code) or a person registered as a civil engineer prior to January 1, 1982, pursuant to the Professional Engineers Act (Chapter 7 (commencing with Section 6700) of Division 3 of the Business and Professions Code).\n(c) Nothing contained in this provision shall prevent a city engineer from delegating the land surveying functions to a person authorized to practice land surveying. Where there is no person authorized to practice land surveying within the city or agency, nothing shall prevent the city engineer from contracting with a person who is authorized to practice land surveying to perform the land surveying functions.","history":"Amended by Stats. 1996, Ch. 872, Sec. 63.   Effective January 1, 1997."},{"num":"66417","text":"(a) “County surveyor” includes county engineer, if there is no county surveyor.\n(b) A county engineer registered as a civil engineer after January 1, 1982, shall not be authorized to prepare, examine, or approve the surveying maps and documents. The examinations, certifications, and approvals of the surveying maps and documents shall only be performed by a person authorized to practice land surveying pursuant to the Professional Land Surveyors Act (Chapter 15 (commencing with Section 8700) of Division 3 of the Business and Professions Code) or a person registered as a civil engineer prior to January 1, 1982, pursuant to the Professional Engineers Act (Chapter 7 (commencing with Section 6700) of Division 3 of the Business and Professions Code).","history":"Amended by Stats. 1996, Ch. 872, Sec. 64.   Effective January 1, 1997."},{"num":"66418","text":"“Design” means: (1) street alignments, grades and widths; (2) drainage and sanitary facilities and utilities, including alignments and grades thereof; (3) location and size of all required easements and rights-of-way; (4) fire roads and firebreaks; (5) lot size and configuration; (6) traffic access; (7) grading; (8) land to be dedicated for park or recreational purposes; and (9) other specific physical requirements in the plan and configuration of the entire subdivision that are necessary to ensure consistency with, or implementation of, the general plan or any applicable specific plan as required pursuant to Section 66473.5.","history":"Amended by Stats. 2002, Ch. 1109, Sec. 1.3.   Effective January 1, 2003."},{"num":"66418.1","text":"“Development” means the uses to which the land which is the subject of a map shall be put, the buildings to be constructed on it, and all alterations of the land and construction incident thereto.","history":"Added by Stats. 1984, Ch. 1113, Sec. 2.   Operative January 1, 1986, by Sec. 10 of Ch. 1113."},{"num":"66418.2","text":"(a) “Environmental subdivision” means a subdivision of land pursuant to this division for biotic and wildlife purposes that meets all of the conditions specified in subdivision (b).\n(b) Prior to approving or conditionally approving an environmental subdivision, the local agency shall find each of the following:\n(1) That factual biotic or wildlife data, or both, are available to the local agency to support the approval of the subdivision, prior to approving or conditionally approving the environmental subdivision.\n(2) That provisions have been made for the perpetual maintenance of the property as a biotic or wildlife habitat, or both, in accordance with the conditions specified by any local, state, or federal agency requiring mitigation.\n(3) That an easement will be recorded in the county in which the land is located to ensure compliance with the conditions specified by any local, state, or federal agency requiring the mitigation. The easement shall contain a covenant with a county, city, or nonprofit organization running with the land in perpetuity, that the landowner shall not construct or permit the construction of improvements except those for which the right is expressly reserved in the instrument. Where the biotic or wildlife habitat, or both, are compatible, the local agency shall consider requiring the easement to contain a requirement for the joint management and maintenance of the resulting parcels. This reservation shall not be inconsistent with the purposes of this section and shall not be incompatible with maintaining and preserving the biotic or wildlife character, or both, of the land.\n(4) The real property is at least 20 acres in size, or if it is less than 20 acres in size, the following conditions are met:\n(A) The land is contiguous to other land that would also qualify as an environmental subdivision.\n(B) The other land is subject to a recorded perpetual easement that restricts its use to a biotic or wildlife habitat, or both.\n(C) The total combined acreage of the lands would be 20 acres or more.\n(D) Where the biotic or wildlife habitat, or both, are compatible, the land and the other land will be jointly managed and maintained.\n(c) Notwithstanding subdivision (a) of Section 66411.1, any improvement, dedication, or design required by the local agency as a condition of approval of an environmental subdivision shall be solely for the purposes of ensuring compliance with the conditions required by the local, state, or federal agency requiring the mitigation.\n(d) After recordation of an environmental subdivision, a subdivider may only abandon an environmental subdivision by reversion to acreage pursuant to Chapter 6 (commencing with Section 66499.11) if the local agency finds that all of the following conditions exist:\n(1) None of the parcels created by the environmental subdivision has been sold or exchanged.\n(2) None of the parcels is being used, set aside, or required for mitigation purposes pursuant to this section.\n(3) Upon abandonment and reversion to acreage pursuant to this subdivision, the easement for biotic and wildlife purposes is extinguished.\n(e) If the environmental subdivision is abandoned and reverts to acreage pursuant to subdivision (d), all local, state, and federal requirements shall apply.\n(f) This section shall apply only upon the written request of the landowner at the time the land is divided. This section is not intended to limit or preclude subdivision by other lawful means for the mitigation of impacts to the environment, or of the land devoted to these purposes, or to require the division of land for these purposes.","history":"Amended by Stats. 2003, Ch. 76, Sec. 1.   Effective January 1, 2004."},{"num":"66419","text":"(a) “Improvement” refers to any street work and utilities to be installed, or agreed to be installed, by the subdivider on the land to be used for public or private streets, highways, ways, and easements, as are necessary for the general use of the lot owners in the subdivision and local neighborhood traffic and drainage needs as a condition precedent to the approval and acceptance of the final map thereof.\n(b) “Improvement” also refers to any other specific improvements or types of improvements, the installation of which, either by the subdivider, by public agencies, by private utilities, by any other entity approved by the local agency, or by a combination thereof, is necessary to ensure consistency with, or implementation of, the general plan or any applicable specific plan.","history":"Amended by Stats. 1984, Ch. 1187, Sec. 2."},{"num":"66420","text":"“Local agency” means a city, county or city and county.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66421","text":"“Local ordinance” refers to a local ordinance regulating the design and improvement of subdivisions, enacted by the legislative body of any local agency under the provisions of this division or any prior statute, regulating the design and improvements of subdivisions, insofar as the provisions of the ordinance are consistent with and not in conflict with the provisions of this division.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66422","text":"“Certificate of exception” means a valid authorization to subdivide land, issued by the County of Los Angeles pursuant to an ordinance thereof, adopted between September 22, 1967, and March 4, 1972, and which at the time of issuance did not conflict with this division or any statutory predecessor thereof.","history":"Added by Stats. 1988, Ch. 1041, Sec. 3."},{"num":"66423","text":"“Subdivider” means a person, firm, corporation, partnership or association who proposes to divide, divides or causes to be divided real property into a subdivision for himself or for others except that employees and consultants of such persons or entities, acting in such capacity, are not “subdividers.”","history":"Amended by Stats. 1976, Ch. 660."},{"num":"66424","text":"“Subdivision” means the division, by any subdivider, of any unit or units of improved or unimproved land, or any portion thereof, shown on the latest equalized county assessment roll as a unit or as contiguous units, for the purpose of sale, lease, or financing, whether immediate or future. Property shall be considered as contiguous units, even if it is separated by roads, streets, utility easement, or railroad rights-of-way. “Subdivision” includes a condominium project, as defined in Section 4125 or 6542 of the Civil Code, a community apartment project, as defined in Section 4105 of the Civil Code, or the conversion of five or more existing dwelling units to a stock cooperative, as defined in of Section 4190 or 6566 of the Civil Code.","history":"Amended (as amended by Stats. 2012, Ch. 181, Sec. 57) by Stats. 2013, Ch. 605, Sec. 31.   (SB 752)   Effective January 1, 2014."},{"num":"66424.1","text":"Nothing in Section 66424 shall prevent a purchaser of a unit of land created under the provisions of this division or a local ordinance enacted pursuant thereto, from subdividing the land one or more times, pursuant to the provisions of this division prior to the time that an equalized county assessment roll has been completed reflecting the creation of the unit proposed to be subdivided.\nNothing contained in this chapter shall prevent the same subdivider of a unit of land created under the provisions of this division, or a local ordinance enacted pursuant thereto, from making consecutive subdivisions of the same parcel or any portion thereof.\nFurther, local agencies shall not, by ordinance or policy, prohibit consecutive subdivision of the same parcel or any portion thereof either by the same subdivider or a subsequent purchaser because the parcel was previously subdivided.\nNothing contained in this section shall limit the authority of a local agency to impose appropriate conditions or requirements on the consecutive subdivisions.","history":"Amended by Stats. 1986, Ch. 35, Sec. 1."},{"num":"66424.5","text":"(a) “Tentative map” refers to a map made for the purpose of showing the design and improvement of a proposed subdivision and the existing conditions in and around it and need not be based upon an accurate or detailed final survey of the property.\n(b) “Vesting tentative map” refers to a map which meets the requirements of subdivision (a) and Section 66452.","history":"Amended by Stats. 1984, Ch. 1113, Sec. 3.   Operative January 1, 1986, by Sec. 10 of Ch. 1113."},{"num":"66424.6","text":"(a) When a subdivision, as defined in Section 66424, is of a portion of any unit or units of improved or unimproved land, the subdivider may designate as a remainder that portion which is not divided for the purpose of sale, lease, or financing. Alternatively, the subdivider may omit entirely that portion of any unit of improved or unimproved land which is not divided for the purpose of sale, lease, or financing. If the subdivider elects to designate a remainder, the following requirements shall apply:\n(1) The designated remainder shall not be counted as a parcel for the purpose of determining whether a parcel or final map is required.\n(2) For a designated remainder parcel described in this subdivision, the fulfillment of construction requirements for improvements, including the payment of fees associated with any deferred improvements, shall not be required until a permit or other grant of approval for development of the remainder parcel is issued by the local agency or, where provided by local ordinance, until the construction of the improvements, including the payment of fees associated with any deferred improvements, is required pursuant to an agreement between the subdivider and the local agency. In the absence of that agreement, a local agency may require fulfillment of the construction requirements, including the payment of fees associated with any deferred improvements, within a reasonable time following approval of the final map and prior to the issuance of a permit or other grant of approval for the development of a remainder parcel upon a finding by the local agency that fulfillment of the construction requirements is necessary for reasons of:\n(A) The public health and safety; or\n(B) The required construction is a necessary prerequisite to the orderly development of the surrounding area.\n(b) If the subdivider elects to omit all or a portion of any unit of improved or unimproved land which is not divided for the purpose of sale, lease, or financing, the omitted portion shall not be counted as a parcel for purposes of determining whether a parcel or final map is required, and the fulfillment of construction requirements for offsite improvements, including the payment of fees associated with any deferred improvements, shall not be required until a permit or other grant of approval for development is issued on the omitted parcel, except where allowed pursuant to paragraph (2) of subdivision (a).\n(c) The provisions of subdivisions (a) and (b) providing for deferral of the payment of fees associated with any deferred improvements shall not apply if the designated remainder or omitted parcel is included within the boundaries of a benefit assessment district or community facilities district.\n(d) A designated remainder or any omitted parcel may subsequently be sold without any further requirement of the filing of a parcel map or final map, but the local agency may require a certificate of compliance or conditional certificate of compliance.","history":"Amended by Stats. 1991, Ch. 907, Sec. 1."}]}]},{"heading":"CHAPTER 2. Maps [66425 - 66450]","articles":[{"heading":"ARTICLE 1. General Provisions [66425 - 66431]","sections":[{"num":"66425","text":"The necessity for tentative, final and parcel maps shall be governed by the provisions of this chapter.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66426","text":"A tentative and final map shall be required for all subdivisions creating five or more parcels, five or more condominiums as defined in Section 783 of the Civil Code, a community apartment project containing five or more parcels, or for the conversion of a dwelling to a stock cooperative containing five or more dwelling units, except where any one of the following occurs:\n(a) The land before division contains less than five acres, each parcel created by the division abuts upon a maintained public\nstreet or highway, and no dedications or improvements are required by the legislative body.\n(b) Each parcel created by the division has a gross area of 20 acres or more and has an approved access to a maintained public street or highway.\n(c) The land consists of a parcel or parcels of land having approved access to a public street or highway, which comprises part of a tract of land zoned for industrial or commercial development, and which has the approval of the governing body as to street alignments and widths.\n(d) Each parcel created by the division has a gross area of not less than 40 acres or is not less than a quarter of a quarter section.\n(e) The land being subdivided is solely for the creation of an environmental subdivision pursuant to Section\n66418.2.\n(f) A parcel map shall be required for those subdivisions described in subdivisions (a), (b), (c), (d), and (e).","history":"Amended by Stats. 2003, Ch. 76, Sec. 2.   Effective January 1, 2004."},{"num":"66426.5","text":"Any conveyance of land to or from a governmental agency, public entity, public utility, or subsidiary of a public utility for conveyance to that public utility for rights-of-way shall not be considered a division of land for purposes of computing the number of parcels. For purposes of this section, any conveyance of land to or from a governmental agency shall include a fee interest, a leasehold interest, an easement, or a\nlicense.","history":"Amended by Stats. 2011, Ch. 382, Sec. 6.   (SB 194)   Effective January 1, 2012."},{"num":"66427","text":"(a) A map of a condominium project, a community apartment project, or of the conversion of five or more existing dwelling units to a stock cooperative project need not show the buildings or the manner in which the buildings or the airspace above the property shown on the map are to be divided, nor shall the governing body have the right to refuse approval of a parcel, tentative, or final map of the project on account of the design or the location of buildings on the property shown on the map that are not violative of local ordinances or on account of the manner in which airspace is to be divided in conveying the condominium.\n(b) A map need not include a condominium plan or plans, as defined in Section 4120 or 6540 of the\nCivil Code, and the governing body may not refuse approval of a parcel, tentative, or final map of the project on account of the absence of a condominium plan.\n(c) Fees and lot design requirements shall be computed and imposed with respect to those maps on the basis of parcels or lots of the surface of the land shown thereon as included in the project.\n(d) Nothing herein shall be deemed to limit the power of the legislative body to regulate the design or location of buildings in a project by or pursuant to local ordinances.\n(e) If the governing body has approved a parcel map or final map for the establishment of condominiums on property pursuant to the requirements of this division, the separation of a three-dimensional portion or portions of the property from the remainder of the property or the division of that\nthree-dimensional portion or portions into condominiums shall not constitute a further subdivision as defined in Section 66424, provided each of the following conditions has been satisfied:\n(1) The total number of condominiums established is not increased above the number authorized by the local agency in approving the parcel map or final map.\n(2) A perpetual estate or an estate for years in the remainder of the property is held by the condominium owners in undivided interests in common, or by an association as defined in Section 4100 or 6528 of the Civil Code, and the duration of the estate in the remainder of the property is the same as the duration of the estate in the condominiums.\n(3) The three-dimensional portion or portions of property are described on a condominium plan or plans, as defined in Section 4120 or\n6540 of the Civil Code.","history":"Amended (as amended by Stats. 2012, Ch. 181, Sec. 58) by Stats. 2013, Ch. 605, Sec. 32.   (SB 752)   Effective January 1, 2014."},{"num":"66427.1","text":"(a) The legislative body shall not approve a final map for a subdivision to be created from the conversion of residential real property into a condominium project, a community apartment project, or a stock cooperative project, unless it finds as follows:\n(1) Each tenant of the proposed condominium, community apartment project, or stock cooperative project, and each person applying for the rental of a unit in the residential real property, has received or will have received all applicable notices and rights now or hereafter required by this chapter or Chapter 3 (commencing with Section 66451).\n(2) Each of the tenants of the proposed condominium, community apartment project, or stock cooperative project has received or will receive each of the following notices:\n(A) Written notification, pursuant to Section 66452.18, of intention to convert, provided at least 60 days prior to the filing of a tentative map pursuant to Section 66452.\n(B) Ten days’ written notification that an application for a public report will be, or has been, submitted to the Bureau of Real Estate, that the period for each tenant’s right to purchase begins with the issuance of the final public report, and that the report will be available on request.\n(C) Written notification that the subdivider has received the public report from\nthe Bureau of Real Estate. This notice shall be provided within five days after the date that the subdivider receives the public report from the Bureau of Real Estate.\n(D) Written notification within 10 days after approval of a final map for the proposed conversion.\n(E) One hundred eighty days’ written notice of intention to convert, provided prior to termination of tenancy due to the conversion or proposed conversion pursuant to Section 66452.19, but not before the local authority has approved a tentative map for the conversion. The notice given pursuant to this paragraph shall not alter or abridge the rights or obligations of the parties in performance of their covenants, including, but not limited to, the provision of services, payment of rent, or the obligations imposed by\nSections 1941, 1941.1, and 1941.2 of the Civil Code.\n(F) Notice of an exclusive right to contract for the purchase of his or her respective unit upon the same terms and conditions that the unit will be initially offered to the general public or terms more favorable to the tenant pursuant to Section 66452.20. The exclusive right to purchase shall commence on the date the subdivision public report is issued, as provided in Section 11018.2 of the Business and Professions Code, and shall run for a period of not less than 90 days, unless the tenant gives prior written notice of his or her intention not to exercise the right.\n(b) The written notices to tenants required by subparagraphs (A) and (B) of paragraph (2) of subdivision (a) shall be deemed satisfied if those notices comply with the\nlegal requirements for service by mail.\n(c) This section shall not diminish, limit, or expand, other than as provided in this section, the authority of any city, county, or city and county to approve or disapprove condominium projects.\n(d) If a rental agreement was negotiated in Spanish, Chinese, Tagalog, Vietnamese, or Korean, all required written notices regarding the conversion of residential real property into a condominium project, a community apartment project, or a stock cooperative project shall be issued in that language.","history":"Amended by Stats. 2013, Ch. 352, Sec. 313.   (AB 1317)   Effective September 26, 2013.   Operative July 1, 2013, by Sec. 543 of Ch. 352."},{"num":"66427.2","text":"Unless applicable general or specific plans contain definite objectives and policies, specifically directed to the conversion of existing buildings into condominium projects or stock cooperatives, the provisions of Sections 66473.5, 66474, and 66474.61, and subdivision (c) of Section 66474.60 shall not apply to condominium projects or stock cooperatives, which consist of the subdivision of airspace in an existing structure, unless new units are to be constructed or added.\nA city, county, or city and county acting pursuant to this section shall approve or disapprove the conversion of an existing building to a stock cooperative\nwithin 120 days following receipt of a completed application for approval of such conversion.\nThis section shall not diminish, limit or expand, other than as provided herein, the authority of any city, county, or city and county to approve or disapprove condominium projects.","history":"Amended by Stats. 1979, Ch. 1192."},{"num":"66427.4","text":"(a) At the time of filing a tentative or parcel map for a subdivision to be created from the conversion of a mobilehome park or floating home marina to another use, the subdivider shall adhere to the requirements of Section 65863.7 relating to the impact of the conversion upon the displaced residents of the mobilehome park or floating home marina to be converted.\n(b) The legislative body, or an advisory agency that is authorized by local ordinance to approve, conditionally approve, or disapprove the map, in addition to complying with other applicable law, shall be subject to Section 65863.7 relating to requiring mitigation of any adverse impact of the conversion on the ability of\ndisplaced mobilehome park or floating home marina residents to find adequate housing in a mobilehome park or floating home marina, respectively.\n(c) This section establishes a minimum standard for local regulation of conversions of mobilehome parks and floating home marinas into other uses and shall not prevent a local agency from enacting more stringent measures.\n(d) This section shall not be applicable to a subdivision that is created from the conversion of a rental mobilehome park or rental floating home marina to resident ownership.","history":"Amended by Stats. 2020, Ch. 35, Sec. 5.   (AB 2782)   Effective January 1, 2021."},{"num":"66427.5","text":"At the time of filing a tentative or parcel map for a subdivision to be created from the conversion of a rental mobilehome park to resident ownership, the subdivider shall avoid the economic displacement of all nonpurchasing residents in the following manner:\n(a) The subdivider shall offer each existing tenant an option to either purchase his or her condominium or subdivided unit, which is to be created by the conversion of the park to resident ownership, or to continue residency as a tenant.\n(b) The subdivider shall file a report on the impact of the conversion upon\nresidents of the mobilehome park to be converted to resident owned subdivided interest.\n(c) The subdivider shall make a copy of the report available to each resident of the mobilehome park at least 15 days prior to the hearing on the map by the advisory agency or, if there is no advisory agency, by the legislative body.\n(d) (1) The subdivider shall obtain a survey of support of residents of the mobilehome park for the proposed conversion.\n(2) The survey of support shall be conducted in accordance with an agreement between the subdivider and a resident homeowners’ association, if any, that is independent of the subdivider or mobilehome park owner.\n(3) The survey shall be obtained pursuant to a written ballot.\n(4) The survey shall be conducted so that each occupied mobilehome space has one vote.\n(5) The results of the survey shall be submitted to the local agency upon the filing of the tentative or parcel map, to be considered in the agency’s decision as to whether to approve, conditionally approve, or disapprove the map, and the agency may disapprove the map if it finds that the results of the survey have not demonstrated the support of at least a majority of the park’s homeowners.\n(6) Local legislative bodies may, by ordinance or resolution, implement the requirements of this subdivision.\n(e) The subdivider shall be subject to a hearing by a legislative body or advisory agency, which is authorized by local ordinance to approve, conditionally approve, or disapprove the map. The scope of the hearing shall be limited to the issue of compliance with this section.\n(f) The subdivider shall be required to avoid the economic displacement of all nonpurchasing residents in accordance with the following:\n(1) As to nonpurchasing residents who are not lower income households, as defined in Section 50079.5 of the Health and Safety Code, the monthly rent, including any applicable fees or charges for use of any preconversion amenities, may increase from the preconversion rent to market levels, as defined in an appraisal conducted in accordance with nationally\nrecognized professional appraisal standards, in equal annual increases over a four-year period.\n(2) As to nonpurchasing residents who are lower income households, as defined in Section 50079.5 of the Health and Safety Code, the monthly rent, including any applicable fees or charges for use of any preconversion amenities, may increase from the preconversion rent by an amount equal to the average monthly increase in rent in the four years immediately preceding the conversion, except that in no event shall the monthly rent be increased by an amount greater than the average monthly percentage increase in the Consumer Price Index for the most recently reported period.","history":"Amended by Stats. 2013, Ch. 373, Sec. 1.   (SB 510)   Effective January 1, 2014."},{"num":"66427.6","text":"At the time of filing a tentative or parcel map for a subdivision to be created from the conversion of a rental floating home marina to resident ownership, the subdivider shall avoid the economic displacement of all nonpurchasing residents in the following manner:\n(a) The subdivider shall offer each existing tenant an option to either purchase his or her condominium or subdivided unit, which is to be created by the conversion of the marina to resident ownership, or to continue residency as a tenant.\n(b) The subdivider shall file a report on the impact of the conversion upon residents of the floating home marina to be converted\nto a resident-owned subdivided interest.\n(c) The subdivider shall make a copy of the report available to each resident of the floating home marina at least 15 days prior to the hearing on the map by the advisory agency or, if there is no advisory agency, by the legislative body.\n(d) (1) The subdivider shall obtain a survey of support of residents of the floating home marina for the proposed conversion.\n(2) The survey of support shall be conducted in accordance with an agreement between the subdivider and a resident homeowners’\nassociation, if any, that is independent of the subdivider or floating home marina owner.\n(3) The survey shall be obtained pursuant to a written ballot.\n(4) The survey shall be conducted so that each occupied floating home berth has one vote.\n(5) The results of the survey shall be submitted to the local agency upon the filing of the tentative or parcel map, to be considered in the agency’s decision as to whether to approve, conditionally approve, or disapprove the map, and the agency may disapprove the map if it finds that the results of the survey have not demonstrated the support of at least a majority of the marina’s homeowners.\n(6) Local\nlegislative bodies may enact local regulations to implement the requirements of this subdivision.\n(e) The subdivider shall be subject to a hearing by a legislative body or advisory agency, which is authorized by local ordinance to approve, conditionally approve, or disapprove the map. The scope of the hearing shall be limited to the issue of compliance with this section.\n(f) The subdivider shall be required to avoid the economic displacement of all nonpurchasing residents in accordance with the following:\n(1) As to nonpurchasing residents who are not lower income households, as defined in Section 50079.5 of the Health and Safety Code, the monthly rent, including any applicable fees or charges for use of any\npreconversion amenities, may increase from the preconversion rent to market levels, as defined in an appraisal conducted in accordance with nationally recognized professional appraisal standards, in equal annual increases over a four-year period.\n(2) As to nonpurchasing residents who are lower income households, as defined in Section 50079.5 of the Health and Safety Code, the monthly rent, including any applicable fees or charges for use of any preconversion amenities, may increase from the preconversion rent by an amount equal to the average monthly increase in rent in the four years immediately preceding the conversion, except that the monthly rent shall not be increased by an amount greater than the average monthly percentage increase in the Consumer Price Index for the most recently reported period.","history":"Added by Stats. 2013, Ch. 432, Sec. 4.   (AB 253)   Effective January 1, 2014."},{"num":"66428","text":"(a) Local ordinances may require a tentative map where a parcel map is required by this chapter. A parcel map shall be required for subdivisions as to which a final or parcel map is not otherwise required by this chapter, unless the preparation of the parcel map is waived by local ordinance as provided in this section. A parcel map shall not be required for either of the following:\n(1) Subdivisions of a portion of the operating right-of-way of a railroad corporation, as defined by Section 230 of the Public Utilities Code, that are created by short-term leases (terminable by either party on not more than 30 days’ notice in writing).\n(2) Land conveyed to or from a governmental agency, public entity, public utility, or for land conveyed to a subsidiary of a public utility for conveyance to that public utility for rights-of-way, unless a showing is made in individual cases, upon substantial evidence, that public policy necessitates a parcel map. For purposes of this subdivision, land conveyed to or from a governmental agency shall include a fee interest, a leasehold interest, an easement, or a license.\n(b) A local agency shall, by ordinance, provide a procedure for waiving the requirement for a parcel map, imposed by this division, including the requirements for a parcel map imposed by Section 66426. The procedure may include provisions for waiving the requirement for a tentative and final map for the construction of a condominium project on a\nsingle parcel. The ordinance shall require a finding by the legislative body or advisory agency, that the proposed division of land complies with requirements established by this division or local ordinance enacted pursuant thereto as to area, improvement and design, floodwater drainage control, appropriate improved public roads, sanitary disposal facilities, water supply availability, environmental protection, and other requirements of this division or local ordinance enacted pursuant thereto. In any case, where the requirement for a parcel map is waived by local ordinance pursuant to this section, a tentative map may be required by local ordinance.\n(c) If a local ordinance does not require a tentative map where a parcel map is required by this division, the subdivider shall have the option of submitting a tentative map, or if he or she\ndesires to obtain the rights conferred by Chapter 4.5 (commencing with Section 66498.1), a vesting tentative map.","history":"Amended by Stats. 2013, Ch. 210, Sec. 16.   (SB 184)   Effective January 1, 2014."},{"num":"66428.1","text":"(a) When at least two-thirds of the owners of mobilehomes or floating homes who are tenants in the mobilehome park or floating home marina sign a petition indicating their intent to purchase the mobilehome park or the floating home marina for purposes of converting it to resident ownership, and a field survey is performed, the requirement for a parcel map or a tentative and final map shall be waived unless any of the following conditions exists:\n(1) There are design or improvement requirements necessitated by significant health or safety concerns.\n(2) The local agency determines that\nthere is an exterior boundary discrepancy that requires recordation of a new parcel or tentative and final map.\n(3) The existing parcels that exist prior to the proposed conversion were not created by a recorded parcel or final map.\n(4) The conversion would result in the creation of more condominium units or interests than the number of tenant lots, spaces, or floating home berths that exist prior to conversion.\n(b) The petition signed by owners of mobilehomes in a mobilehome park proposed for conversion to resident ownership pursuant to subdivision (a) shall read as follows:\nMOBILEHOME PARK PETITION AND\nDISCLOSURE STATEMENT\nSIGNING THIS PETITION INDICATES YOUR SUPPORT FOR CONVERSION OF THIS MOBILEHOME PARK TO RESIDENT OWNERSHIP.   THIS DISCLOSURE STATEMENT CONCERNS THE REAL PROPERTY SITUATED IN THE CITY OF ____, COUNTY OF ____, STATE OF CALIFORNIA, DESCRIBED AS ____.   THE TOTAL COST FOR CONVERSION AND PURCHASE OF THE PARK IS $____ TO $____, EXCLUDING FINANCING COSTS.   THE TOTAL COST TO YOU FOR CONVERSION AND PURCHASE OF YOUR OWNERSHIP INTEREST IS $____ TO $____, EXCLUDING FINANCING COSTS.   IF TWO-THIRDS OF THE RESIDENTS IN THIS PARK SIGN THIS PETITION INDICATING THEIR INTENT TO PURCHASE THE MOBILEHOME PARK FOR PURPOSES OF CONVERTING IT TO RESIDENT OWNERSHIP, THEN THE\nREQUIREMENTS FOR A NEW PARCEL, OR TENTATIVE AND FINAL SUBDIVISION MAP IN COMPLIANCE WITH THE SUBDIVISION MAP ACT MUST BE WAIVED, WITH CERTAIN VERY LIMITED EXCEPTIONS. WAIVING THESE PROVISIONS OF LAW ELIMINATES NUMEROUS PROTECTIONS THAT ARE AVAILABLE TO YOU.\n_____\nBuyer, unit #, date\n_____\n_____\n_____\nPetitioner, date\n_____\n(c) The petition signed by owners of floating homes in a floating home marina proposed for conversion to resident ownership pursuant to subdivision (a) shall read as follows:\nFLOATING HOME MARINA PETITION AND\nDISCLOSURE STATEMENT\nSIGNING THIS PETITION INDICATES YOUR SUPPORT FOR CONVERSION OF THIS FLOATING HOME MA
