onuments, or in the event of his refusal to set such monuments, the legislative body may direct the county surveyor or city engineer, or such engineer or surveyor as it may select, to set such monuments. If the original engineer or surveyor is replaced by another, the former may, by letter to the county surveyor or city engineer, release his obligation to set the final monuments to the surveyor or engineer who replaced him. When the monuments are so set, the substitute engineer or surveyor shall amend any map filed pursuant to this division in accordance with the provisions of Sections 66469 to 66472, inclusive. All provisions of this article relating to payment shall apply to the services performed by the substituted engineer or surveyor.","history":"Amended by Stats. 1979, Ch. 383."}]}]},{"heading":"CHAPTER 4.5. Development Rights [66498.1 - 66498.9]","articles":[{"heading":null,"sections":[{"num":"66498.1","text":"(a) Whenever a provision of this division requires that a tentative map be filed, a vesting tentative map may instead be filed.\n(b) When a local agency approves or conditionally approves a vesting tentative map, that approval shall confer a vested right to proceed with development in substantial compliance with the ordinances, policies, and standards described in Section 66474.2. However, if Section 66474.2 is repealed, that approval shall confer a vested right to proceed with development in substantial compliance with the ordinances, policies, and standards in effect at the time the vesting tentative map is approved or conditionally approved.\n(c) Notwithstanding subdivision (b), the local agency may condition or deny a permit, approval, extension, or entitlement if it determines any of the following:\n(1) A failure to do so would place the residents of the subdivision or the immediate community, or both, in a condition dangerous to their health or safety, or both.\n(2) The condition or denial is required in order to comply with state or federal law.\n(d) The rights conferred by this section shall expire if a final map is not approved prior to the expiration of the vesting tentative map. If the final map is approved, the rights conferred by this section shall be subject to the periods of time set forth in subdivisions (b), (c), and (d) of Section 66498.5.\n(e) Consistent with subdivision (b), an approved or conditionally approved vesting tentative map shall not limit a local agency from imposing reasonable conditions on subsequent required approvals or permits necessary for the development and authorized by the ordinances, policies, and standards described in subdivision (b).","history":"Amended by Stats. 1999, Ch. 550, Sec. 22.   Effective September 28, 1999.   Operative January 1, 2000, by Sec. 33 of Ch. 550."},{"num":"66498.2","text":"If the ordinances, policies, or standards described in subdivision (b) of Section 66498.1 are changed subsequent to the approval or conditional approval of a vesting tentative map, the subdivider, or his or her assignee, at any time prior to the expiration of the vesting tentative map pursuant to subdivisions (b), (c), and (d) of Section 66498.5, may apply for an amendment to the vesting tentative map to secure a vested right to proceed with the changed ordinances, policies, or standards. An application shall clearly specify the changed ordinances, policies, or standards for which the amendment is sought.","history":"Amended by Stats. 1999, Ch. 550, Sec. 23.   Effective September 28, 1999.   Operative January 1, 2000, by Sec. 33 of Ch. 550."},{"num":"66498.3","text":"(a) Whenever a subdivider files a vesting tentative map for a subdivision whose intended development is inconsistent with the zoning ordinance in existence at that time, that inconsistency shall be noted on the map. The local agency may deny a vesting tentative map or approve it conditioned on the subdivider, or his or her designee, obtaining the necessary change in the zoning ordinance to eliminate the inconsistency. If the change in the zoning ordinance is obtained, the approved or conditionally approved vesting tentative map shall, notwithstanding subdivision (b) of Section 66498.1, confer the vested right to proceed with the development in substantial compliance with the change in the zoning ordinance and the map, as approved.\n(b) The rights conferred by this section shall be for the time periods set forth in subdivisions (b), (c), and (d) of Section 66498.5.","history":"Amended by Stats. 1999, Ch. 550, Sec. 24.   Effective September 28, 1999.   Operative January 1, 2000, by Sec. 33 of Ch. 550."},{"num":"66498.4","text":"Notwithstanding any provision of this chapter, a property owner or his or her designee may seek approvals or permits for development which depart from the ordinances, policies, and standards described in subdivision (b) of Section 66498.1 and subdivision (a) of Section 66498.3, and local agencies may grant these approvals or issue these permits to the extent that the departures are authorized under applicable law.","history":"Amended by Stats. 1986, Ch. 613, Sec. 4."},{"num":"66498.5","text":"(a) If a subdivider does not seek the rights conferred by this chapter, the filing of a vesting tentative map shall not be a prerequisite to any approval for any proposed subdivision, permit for construction, or work preparatory to construction.\n(b) The rights conferred by a vesting tentative map as provided by this chapter shall last for an initial time period, as provided by ordinance, but shall not be less than one year or more than two years beyond the recording of the final map. Where several final maps are recorded on various phases of a project covered by a single vesting tentative map, the one-year initial time period shall begin for each phase when the final map for that phase is recorded.\n(c) The initial time period shall be automatically extended by any time used by the local agency for processing a complete application for a grading permit or for design or architectural review, if the time used by the local agency to process the application exceeds 30 days from the date that a complete application is filed. At any time prior to the expiration of the initial time period provided by this section, the subdivider may apply for a one-year extension. If the extension is denied by an advisory agency, the subdivider may appeal that denial to the legislative body within 15 days.\n(d) If the subdivider submits a complete application for a building permit during the periods of time specified in subdivision (c), the rights conferred by this chapter shall continue until the expiration of that permit, or any extension of that permit granted by the local agency.","history":"Amended by Stats. 1998, Ch. 689, Sec. 9.   Effective January 1, 1999."},{"num":"66498.6","text":"(a) This chapter does not enlarge, diminish, or alter the types of conditions which may be imposed by a local agency on a development, nor in any way diminish or alter the power of local agencies to protect against a condition dangerous to the public health or safety.\n(b) The rights conferred by this chapter shall relate only to the imposition by local agencies of conditions or requirements created and imposed by local ordinances. Nothing in this chapter removes, diminishes, or affects the obligation of any subdivider to comply with the conditions and requirements of any state or federal laws, regulations, or policies and does not grant local agencies the option to disregard any state or federal laws, regulations, or policies.","history":"Added by Stats. 1984, Ch. 1113, Sec. 8.   Operative January 1, 1986, by Sec. 10 of Ch. 1113."},{"num":"66498.7","text":"(a) Until December 31, 1987, this chapter shall apply only to residential developments.\n(b) On and after January 1, 1988, an ordinance adopted pursuant to subdivision (g) of Section 66452.6 may differentiate between residential and nonresidential developments in prescribing the initial time period after which the rights conferred by a vesting tentative map shall expire. In no event, however, shall that period be less for residential developments than for nonresidential developments.","history":"Amended by Stats. 1985, Ch. 995, Sec. 1.   Section operative January 1, 1986, by Stats. 1984, Ch. 1113, Sec. 10."},{"num":"66498.8","text":"(a) On or before January 1, 1986, a city, county, or city and county shall adopt ordinances or resolutions necessary or appropriate for the implementation of this chapter.\n(b) If a city, county, or city and county receives a written request to implement this chapter, it shall adopt any ordinances or resolutions it determines necessary or appropriate to implement this chapter. The city, county, or city and county shall adopt the ordinances or resolutions not more than 120 days from the date the request is made and any fee is paid to cover the direct expenses the city, county, or city and county determines it will incur in processing the ordinances or resolutions. The city, county, or city and county may arrange, with the person making the request, to collect fees from subdividers filing vesting tentative maps and to reimburse the person requesting the ordinance or resolution for any costs so advanced by that person.\n(c) The local agency may charge subdividers who file vesting tentative maps a fee in an amount sufficient to recover the direct costs associated with establishing and adopting ordinances or resolutions pursuant to subdivision (a) or (b).\n(d) No ordinances or resolutions adopted pursuant to subdivision (a) may require more information than that related to ordinances, resolutions, policies, or standards for the design, development, or improvement relating to the conferred rights, except where necessary:\n(1) To permit the public agency to make the determination required by Section 21080.1 of the Public Resources Code, as provided by Section 65941.\n(2) To comply with federal or state requirements.","history":"Amended by Stats. 1989, Ch. 717, Sec. 1."},{"num":"66498.9","text":"By the enactment of this article, the Legislature intends to accomplish all of the following objectives:\n(a) To establish a procedure for the approval of tentative maps that will provide certain statutorily vested rights to a subdivider.\n(b) To ensure that local requirements governing the development of a proposed subdivision are established in accordance with Section 66498.1 when a local agency approves or conditionally approves a vesting tentative map. The private sector should be able to rely upon an approved vesting tentative map prior to expending resources and incurring liabilities without the risk of having the project frustrated by subsequent action by the approving local agency, provided the time periods established by this article have not elapsed.\n(c) To ensure that local agencies have maximum discretion, consistent with Section 66498.1, in the imposition of conditions on any approvals occurring subsequent to the approval or conditional approval of the vesting tentative map, so long as that discretion is not exercised in a manner which precludes a subdivider from proceeding with the proposed subdivision.","history":"Added by Stats. 1986, Ch. 613, Sec. 5."}]}]},{"heading":"CHAPTER 5. Improvement Security [66499 - 66499.10]","articles":[{"heading":null,"sections":[{"num":"66499","text":"(a) Whenever this division or a local ordinance authorizes or requires the furnishing of security in connection with the performance of any act or agreement, if the developer is not a nonprofit corporation described in subdivision (c) of Section 66499.3, the security shall be one of the following at the option of and subject to the approval of the local agency and if the developer is a nonprofit corporation described in subdivision (c) of Section 66499.3, the security shall be one of the following, subject to the approval of the local agency:\n(1) Bond or bonds by one or more duly authorized corporate sureties.\n(2) A deposit, either with the local agency or a responsible escrow agent or trust company, at the option of the local agency, of money or negotiable bonds of the kind approved for securing deposits of public moneys.\n(3) An instrument of credit from an agency of the state, federal, or local government when any agency of the state, federal, or local government provides at least 20 percent of the financing for the portion of the act or agreement requiring security, or from one or more financial institutions subject to regulation by the state or federal government and pledging that the funds necessary to carry out the act or agreement are on deposit and guaranteed for payment, or a letter of credit issued by such a financial institution.\n(4) A lien upon the property to be divided, created by contract between the owner and the local agency, if the local agency finds that it would not be in the public interest to require the installation of the required improvement sooner than two years after the recordation of the map.\n(5) Any form of security, including security interests in real property, which is acceptable to the local agency and specified by ordinance thereof.\n(b) Any contract or security interest in real property entered into as security for performance pursuant to paragraph (4) or paragraph (5) of subdivision (a) shall be recorded with the county recorder of the county in which the subject real property is located. From the time of recordation of the written contract or document creating a security interest, a lien shall attach to the real property particularly described therein and shall have the priority of a judgment lien in an amount necessary to complete the agreed to improvements. The recorded contract or security document shall be indexed in the Grantor Index to the names of all record owners of the real property as specified on the map and in the Grantee Index to the local agency approving the map.\nThe local agency may at any time release all or any portion of the property subject to any lien or security interest created by this subdivision or subordinate the lien or security interest to other liens or encumbrances if it determines that security for performance is sufficiently secured by a lien on other property or that the release or subordination of the lien will not jeopardize the completion of agreed upon improvements.","history":"Amended by Stats. 1988, Ch. 1308, Sec. 2."},{"num":"66499.1","text":"Except as provided in Section 66499.3, a bond or bonds by one or more duly authorized corporate sureties to secure the faithful performance of any agreement shall be in substantially the following form:\nWhereas, The Board of Supervisors of the County of ____ (or the City Council of the City of ____), State of California, and ____ (hereinafter designated as “principal”) have entered into an agreement whereby principal agrees to install and complete certain designated public improvements, which said agreement, dated ____, 19_, and identified as project ____, is hereby referred to and made a part hereof; and\nWhereas, Said principal is required under the terms of said agreement to furnish a bond for the faithful performance of said agreement.\nNow, therefore, we, the principal and ____, as surety, are held and firmly bound unto the County of ____, (or City of ____) hereinafter called (“____”), in the penal sum of ____ dollars ($____) lawful money of the United States, for the payment of which sum well and truly to be made, we bind ourselves, our heirs, successors, executors and administrators, jointly and severally, firmly by these presents.\nThe condition of this obligation is such that if the above bounded principal, his or its heirs, executors, administrators, successors or assigns, shall in all things stand to and abide by, and well and truly keep and perform the covenants, conditions and provisions in the said agreement and any alteration thereof made as therein provided, on his or their part, to be kept and performed at the time and in the manner therein specified, and in all respects according to their true intent and meaning, and shall indemnify and save harmless ____, its officers, agents and employees, as therein stipulated, then this obligation shall become null and void; otherwise it shall be and remain in full force and effect.\nAs a part of the obligation secured hereby and in addition to the face amount specified therefor, there shall be included costs and reasonable expenses and fees, including reasonable attorney’s fees, incurred by county (or city) in successfully enforcing such obligation, all to be taxed as costs and included in any judgment rendered.\nThe surety hereby stipulates and agrees that no change, extension of time, alteration or addition to the terms of the agreement or to the work to be performed thereunder or the specifications accompanying the same shall in anywise affect its obligations on this bond, and it does hereby waive notice of any such change, extension of time, alteration or addition to the terms of the agreement or to the work or to the specifications.\nIn witness whereof, this instrument has been duly executed by the principal and surety above named, on ____, 19_.\nAppropriate modifications shall be made in such form if the bond is being furnished for the performance of an act not provided for by agreement.","history":"Amended by Stats. 1988, Ch. 1308, Sec. 3."},{"num":"66499.2","text":"A bond or bonds by one or more duly authorized corporate sureties for the security of laborers and material suppliers shall be in substantially the following form:\nWhereas, The Board of Supervisors of the County of ____ (or City Council of the City of ____), State of California, and ____ (hereinafter designated as “the principal”) have entered into an agreement whereby the principal agrees to install and complete certain designated public improvements, which agreement, dated ____, 20_, and identified as project ____, is hereby referred to and made a part hereof; and\nWhereas, Under the terms of the agreement, the principal is required before entering upon the performance of the\nwork, to file a good and sufficient payment bond with the County of ____ (or the City of ____) to secure the claims to which reference is made in Title 3 (commencing with Section 9000) of Part 6 of Division 4 of the Civil Code.\nNow, therefore, the principal and the undersigned as corporate surety, are held firmly bound unto the County of ____ (or the City of ____) and all contractors, subcontractors, laborers, material suppliers, and other persons employed in the performance of the agreement and referred to in Title 3 (commencing with Section 9000) of Part 6 of Division 4 of the Civil Code in the sum of ____ dollars ($____), for materials furnished or labor thereon of any kind, or for amounts due under the Unemployment Insurance Act with respect to this work or labor, that the surety will pay the same in an amount not exceeding the amount hereinabove set forth, and also in case suit is brought upon this bond, will pay, in addition to the face amount thereof, costs\nand reasonable expenses and fees, including reasonable attorney’s fees, incurred by county (or city) in successfully enforcing this obligation, to be awarded and fixed by the court, and to be taxed as costs and to be included in the judgment therein rendered.\nIt is hereby expressly stipulated and agreed that this bond shall inure to the benefit of any and all persons, companies, and corporations entitled to file claims under Title 3 (commencing with Section 9000) of Part 6 of Division 4 of the Civil Code, so as to give a right of action to them or their assigns in any suit brought upon this bond.\nShould the condition of this bond be fully performed, then this obligation shall become null and void, otherwise it shall be and remain in full force and effect.\nThe surety hereby stipulates and agrees that no change, extension of time, alteration, or addition to the terms of the agreement\nor the specifications accompanying the same shall in any manner affect its obligations on this bond, and it does hereby waive notice of any such change, extension, alteration, or addition.\nIn witness whereof, this instrument has been duly executed by the principal and surety above named, on ____, 20__.","history":"Amended by Stats. 2010, Ch. 697, Sec. 35.   (SB 189)   Effective January 1, 2011.   Operative July 1, 2012, by Sec. 105 of Ch. 697."},{"num":"66499.3","text":"Security to guarantee the performance of any act or agreement shall be in the following amounts:\n(a) An amount determined by the legislative body, not less than 50 percent nor more than 100 percent of the total estimated cost of the improvement or of the act to be performed, conditioned upon the faithful performance of the act or agreement; and\n(b) An additional amount determined by the legislative body, not less than 50 percent nor more than 100 percent of the total estimated cost of the improvement or the performance of the required act, securing payment to the contractor, to the subcontractors, and to persons furnishing labor, materials, or equipment to them for the improvement or the performance of the required act.\n(c) Whenever an entity required to furnish security in accordance with subdivisions (a) and (b) is a California nonprofit corporation, funded by the United States of America or one of its agencies, or funded by this state or one of its agencies, the entity shall not be required to comply with subdivisions (a) and (b), if the following conditions are met:\n(1) A letter or letters of credit are provided pursuant to paragraph (3) of subdivision (a) of Section 66499 for 100 percent of the contract of improvements or the contractor installing the improvements has bonded to the nonprofit corporation and the local agency as coobligee the amount of 100 percent of the contract for the faithful performance of the work, and has further bonded to the nonprofit corporation and the local agency as coobligee an amount of not less than 50 percent of the contract for the payment of labor and materials, and those bonds comply with the provisions of this chapter.\n(2) All moneys under the control of the nonprofit corporation and payable to the contractor by the nonprofit corporation are deposited in a depository complying with the provisions of this chapter, and out of which moneys progress payments are conditioned upon:\n(A) The contractor’s certification to the nonprofit corporation that all labor performed in the work, and all materials furnished to and installed in the work, have been paid for in full to the date of the certification.\n(B) The written approval of the nonprofit corporation.\n(C) Review and approval of progress payment billings by local government.\n(D) Final payment to the contractor not being made until 30 days shall have expired after the filing and recording of the notice of completion of the work and acceptance of the work by, and a waiver of lien rights provided by the contractor to, the local agency in writing.\n(3) All certifications as to progress payments shall be delivered through the United States mail to the nonprofit corporation. The term “progress payments” means payments made in compliance with the schedule of partial payments agreed upon in the contract for the work. No less than 10 percent of the total contract price shall be retained for the 60 days following the filing of the notice of completion.\n(d) Subject to the limitations of Section 66499.9, an amount determined by the legislative body necessary for the guarantee and warranty of the work for a period of one year following the completion and acceptance thereof against any defective work or labor done, or defective materials furnished.","history":"Amended by Stats. 1988, Ch. 1308, Sec. 4."},{"num":"66499.4","text":"As a part of the obligation guaranteed by the security and in addition to the face amount of the security, there shall be included costs and reasonable expenses and fees, including reasonable attorneys’ fees, incurred by the local agency in successfully enforcing the obligation secured.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.5","text":"If the required subdivision improvements are financed and installed pursuant to special assessment proceedings, the local agency at its option may provide by local ordinance that, upon the furnishing by the contractor of the faithful performance and labor and material bonds required by the special assessment act being used, the improvement security of the subdivider may be reduced by an amount corresponding to the amount of such bonds so furnished by the contractor.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.6","text":"Such money, negotiable bond or instrument of credit shall be a trust fund to guarantee performance and shall not be subject to enforcement of a money judgment by any creditors of the depositor until the obligation secured thereby is performed to the satisfaction of the local agency.","history":"Amended by Stats. 1982, Ch. 497, Sec. 120.   Operative July 1, 1983, by Sec. 185 of Ch. 497."},{"num":"66499.7","text":"The security furnished by the subdivider shall be released in whole or in part in the following manner:\n(a) Security given for faithful performance of any act or agreement shall be released upon the performance of the act or final completion and acceptance of the required work. The legislative body may provide for the partial release of the security upon the partial performance of the act or the acceptance of the work as it progresses, consistent with the provisions of this section. The security may be a surety bond, a cash deposit, a letter of credit, escrow account, or other form of performance guarantee required as security by the legislative body that meets the requirements as acceptable security pursuant to law. If the security furnished\nby the subdivider is a documentary evidence of security such as a surety bond or a letter of credit, the legislative body shall release the documentary evidence and return the original to the issuer upon performance of the act or final completion and acceptance of the required work. In the event that the legislative body is unable to return the original documentary evidence to the issuer, the security shall be released by written notice sent by certified mail to the subdivider and issuer of the documentary evidence within 30 days of the acceptance of the work. The written notice shall contain a statement that the work for which the security was furnished has been performed or completed and accepted by the legislative body, a description of the project subject to the documentary evidence and the notarized signature of the authorized representative of the legislative body.\n(b) At the time that the subdivider believes that the obligation to\nperform the work for which security was required is complete, the subdivider may notify the local agency in writing of the completed work, including a list of work completed. Upon receipt of the written notice, the local agency shall have 45 days to review and comment or approve the completion of the required work. If the local agency does not agree that all work has been completed in accordance with the plans and specifications for the improvements, it shall supply a list of all remaining work to be completed.\n(c) Within 45 days of receipt of the list of remaining work from the local agency, the subdivider may then provide cost estimates for all remaining work for review and approval by the local agency. Upon receipt of the cost estimates, the local agency shall then have 45 days to review, comment, and approve, modify, or disapprove those cost estimates. No local agency shall be required to engage in this process of partial release more than\nonce between the start of work and completion and acceptance of all work; however, nothing in this section prohibits a local agency from allowing for a partial release as it otherwise deems appropriate.\n(d) If the local agency approves the cost estimate, the local agency shall release all performance security except for security in an amount up to 200 percent of the cost estimate of the remaining work. The process allowing for a partial release of performance security shall occur when the cost estimate of the remaining work does not exceed 20 percent of the total original performance security unless the local agency allows for a release at an earlier time. Substitute bonds or other security may be used as a replacement for the performance security, subject to the approval of the local agency. If substitute bonds or other security is used as a replacement for the performance security released, the release shall not be effective unless and until\nthe local agency receives and approves that form of replacement security. A reduction in the performance security, authorized under this section, is not, and shall not be deemed to be, an acceptance by the local agency of the completed improvements, and the risk of loss or damage to the improvements and the obligation to maintain the improvements shall remain the sole responsibility of the subdivider until all required public improvements have been accepted by the local agency and all other required improvements have been fully completed in accordance with the plans and specifications for the improvements.\n(e) The subdivider shall complete the works of improvement until all remaining items are accepted by the local agency.\n(f) Upon the completion of the improvements, the subdivider, or his or her assigns, shall be notified in writing by the local agency within 45 days.\n(g) Within 45 days of the issuance of the notification by the local agency, the release of any remaining performance security shall be placed upon the agenda of the legislative body of the local agency for approval of the release of any remaining performance security. If the local agency delegates authority for the release of performance security to a public official or other employee, any remaining performance security shall be released within 60 days of the issuance of the written statement of completion.\n(h) Security securing the payment to the contractor, his or her subcontractors, and to persons furnishing labor, materials, or equipment shall, after passage of the time within which claims of lien are required to be recorded pursuant to Article 2 (commencing with Section 8410) of Chapter 4 of Title 2 of Part 6 of Division 4 of the Civil Code and after acceptance of the work, be\nreduced to an amount equal to the total claimed by all claimants for whom claims of lien have been recorded and notice thereof given in writing to the legislative body, and if no claims have been recorded, the security shall be released in full.\n(i) The release shall not apply to any required guarantee and warranty period required by Section 66499.9 for the guarantee or warranty nor to the amount of the security deemed necessary by the local agency for the guarantee and warranty period nor to costs and reasonable expenses and fees, including reasonable attorney’s fees.\n(j) The legislative body may authorize any of its public officers or employees to authorize release or reduction of the security in accordance with the conditions hereinabove set forth and in accordance with any rules that it may prescribe.","history":"Amended by Stats. 2015, Ch. 269, Sec. 17.   (SB 184)   Effective January 1, 2016."},{"num":"66499.8","text":"In all cases where the performance of the obligation for which the security is required is subject to the approval of another agency, the local agency shall not release the security until the obligation is performed to the satisfaction of such other agency. Such agency shall have two months after completion of the performance of the obligation to register its satisfaction or dissatisfaction. If at the end of that period it has not registered its satisfaction or dissatisfaction, it shall be conclusively deemed that the performance of the obligation was done to its satisfaction.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.9","text":"Any liability upon the security given for the faithful performance of any act or agreement shall be limited to:\n(a) The performance of the work covered by the agreement between the subdivider and the legislative body or the performance of the required act.\n(b) The performance of any changes or alterations in such work; provided, that all such changes or alterations do not exceed 10 percent of the original estimated cost of the improvement.\n(c) The guarantee and warranty of the work, for a period of one year following completion and acceptance thereof, against any defective work or labor done or defective materials furnished, in the performance of the agreement with the legislative body or the performance of the act.\n(d) Costs and reasonable expenses and fees, including reasonable attorneys’ fees.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.10","text":"Where the security is conditioned upon the payment to the contractor, his subcontractors and to persons furnishing labor, materials or equipment to them for the improvement of the performance of an act and takes the form of a deposit of money or negotiable bonds, a suit to recover the amount due the claimant may be maintained against the holder of such deposit. Where the security takes the form of a surety bond, or surety bonds, the right of recovery shall be in a suit against the surety. Where the security takes the form of an instrument of credit, the cause of action shall be against the financial institution obligating itself on such instrument of credit.","history":"Added by Stats. 1974, Ch. 1536."}]}]},{"heading":"CHAPTER 6. Reversions and Exclusions [66499.11 - 66499.29]","articles":[{"heading":"ARTICLE 1. Reversion to Acreage [66499.11 - 66499.20.3]","sections":[{"num":"66499.11","text":"Subdivided real property may be reverted to acreage pursuant to the provisions of this article.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.12","text":"(a) Proceedings for reversion to acreage may be initiated by the legislative body on its own motion or by petition of all of the owners of record of the real property within the subdivision.\n(b) Nothing in this chapter prohibits a landowner, local agency, or renewable energy corporation authorized to conduct business in this state from seeking financial assistance from eligible state funding sources to defray either of the following costs:\n(1) The costs of merging parcels, including, but not limited to, escrow costs, on private or public lands pursuant to this chapter.\n(2) The costs of establishing or administering a joint powers authority established or authorized to merge parcels on private or public lands, including, but not limited to, all eligible costs, for the purpose of siting renewable energy facilities.\n(c) This section does not authorize the use of state funds for the acquisition of real property for which a parcel merger will be initiated.","history":"Amended by Stats. 2010, Ch. 492, Sec. 2.   (SB 1319)   Effective January 1, 2011."},{"num":"66499.13","text":"The petition shall be in a form prescribed by the local agency and shall contain the following:\n(a) Adequate evidence of title to the real property within the subdivision.\n(b) Sufficient data to enable the legislative body to make all of the determinations and findings required by this article.\n(c) A final map which delineates dedications which will not be vacated and dedications which are a condition to reversion.\n(d) Such other pertinent information as may be required by the local agency.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.14","text":"The legislative body may establish a fee for processing reversions to acreage pursuant to this article in an amount which will reimburse the local agency for all costs incurred in processing such reversion to acreage. Such fee shall be paid by the owners at the time of filing the petition for reversion to acreage, or if the proceedings for reversion to acreage are initiated by the legislative body on its own motion shall be paid by the person or persons requesting the legislative body to proceed pursuant to this article before such initiation of proceedings.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.15","text":"A public hearing shall be held on the proposed reversion to acreage. Notice thereof shall be given in the time and manner provided in Section 66451.3.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.16","text":"Subdivided real property may be reverted to acreage only if the legislative body finds that:\n(a) Dedications or offers of dedication to be vacated or abandoned by the reversion to acreage are unnecessary for present or prospective public purposes; and\n(b) Either:\n(1) All owners of an interest in the real property within the subdivision have consented to reversion; or\n(2) None of the improvements required to be made have been made within two years from the date the final or parcel map was filed for record, or within the time allowed by agreement for completion of the improvements, whichever is the later; or\n(3) No lots shown on the final or parcel map have been sold within five years from the date such map was filed for record.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.17","text":"As conditions of reversion the legislative body shall require:\n(a) Dedications or offers of dedication necessary for the purposes specified by local ordinance following reversion.\n(b) Retention of all previously paid fees if necessary to accomplish the purposes of this division or local ordinance adopted pursuant thereto.\n(c) Retention of any portion of required improvement security or deposits if necessary to accomplish the purposes of this division of local ordinance adopted pursuant thereto.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.18","text":"Reversion shall be effective upon the final map being filed for record by the county recorder, and thereupon all dedications and offers of dedication not shown thereon shall be of no further force or effect.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.19","text":"When a reversion is effective, all fees and deposits shall be returned to the current owner of the property and all improvement security released, except those retained pursuant to Section 66499.17.","history":"Amended by Stats. 2000, Ch. 506, Sec. 31.   Effective January 1, 2001."},{"num":"66499.20","text":"A tax bond shall not be required in reversion proceedings.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.20.1","text":"A city or county may, by ordinance, authorize a parcel map to be filed under the provisions of this chapter for the purpose of reverting to acreage land previously subdivided and consisting of four or less contiguous parcels under the same ownership. Any map so submitted shall be accompanied by evidence of title and nonuse or lack of necessity of any public streets or public easements which are to be vacated or abandoned. Any public streets or public easements to be left in effect after the reversion shall be adequately delineated on the map. After approval of the reversion by the governing body or advisory agency the map shall be delivered to the county recorder. The filing of the map shall constitute legal reversion to acreage of the land affected thereby, and shall also constitute abandonment of all\npublic streets or public easements not shown on the map, provided however that written notation of each abandonment is listed by reference to the recording data creating those public streets or public easements and certified to on the map by the clerk of the legislative body or the designee of the legislative body approving the map. The filing of the map shall also constitute a merger of the separate parcels into one parcel for purposes of this chapter and shall thereafter be shown as such on the assessment roll subject to the provisions of Section 66445. Except as provided in subdivision (f) of Section 66445, on any parcel map used for reverting acreage, a certificate shall appear signed and acknowledged by all parties having any record title interest in the land being reverted, consenting to the preparation and filing of the parcel map.","history":"Added by renumbering Section 66499.20 1/4 by Stats. 2012, Ch. 162, Sec. 76.   (SB 1171)   Effective January 1, 2013."},{"num":"66499.20.2","text":"Subdivided lands may be merged and resubdivided without reverting to acreage by complying with all the applicable requirements for the subdivision of land as provided by this division and any local ordinances adopted pursuant thereto. The filing of the final map or parcel map shall constitute legal merging of the separate parcels into one parcel and the resubdivision of such parcel, and the real property shall thereafter be shown with the new lot or parcel boundaries on the assessment roll. Any unused fees or deposits previously made pursuant to this division pertaining to the property shall be credited pro rata towards any requirements for the same purposes which are applicable at the time of resubdivision. Any public streets or public easements to be left in effect after the resubdivision shall be\nadequately delineated on the map. After approval of the merger and resubdivision by the governing body or advisory agency the map shall be delivered to the county recorder. The filing of the map shall constitute legal merger and resubdivision of the land affected thereby, and shall also constitute abandonment of all public streets and public easements not shown on the map, provided that a written notation of each abandonment is listed by reference to the recording data creating these public streets or public easements, and certified to on the map by the clerk of the legislative body or the designee of the legislative body approving the map.","history":"Added by renumbering Section 66499.20 1/2 by Stats. 2012, Ch. 162, Sec. 77.   (SB 1171)   Effective January 1, 2013."},{"num":"66499.20.3","text":"A city or county may, by ordinance, authorize the merger of contiguous parcels under common ownership without reverting to acreage. The ordinance shall require the recordation of an instrument evidencing the merger.","history":"Added by renumbering Section 66499.20 3/4 by Stats. 2012, Ch. 162, Sec. 78.   (SB 1171)   Effective January 1, 2013."}]},{"heading":"ARTICLE 2. Exclusions [66499.21 - 66499.29]","sections":[{"num":"66499.21","text":"The superior court of the county in which a subdivision is situated may cause all or any portion of the real property included within the boundaries of the subdivision to be excluded from such subdivision and the recorded map to be altered or vacated, in accordance with the procedures set forth in this article.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.22","text":"A proceeding for exclusion shall be initiated by filing a petition therefor in the offices of the county surveyor and clerk of the board of supervisors of the county in which the subdivision or the portion thereof sought to be excluded is situated. The petition shall accurately and distinctly describe the real property sought to be excluded by reference to the recorded map or by any accurate survey, shall show the names and addresses of all owners of real property in the subdivision or in the portion thereof sought to be excluded as far as the same are known to the petitioners, and shall set forth the reasons for the requested exclusion. The petition shall be signed and verified by the owners of at least two-thirds of the total area of the real property sought to be excluded.","history":"Amended by Stats. 2002, Ch. 221, Sec. 41.   Effective January 1, 2003."},{"num":"66499.23","text":"The petition shall be accompanied by a new map showing the boundaries of the subdivision as it appears after the exclusion and alteration. The new map shall designate as numbered or lettered parcels those portions excluded and show the acreage of each parcel. If the map can be compiled from data available, an actual field survey shall not be required. If the map meets with the approval of the county surveyor, a statement by an engineer or surveyor shall not be required.","history":"Amended by Stats. 1987, Ch. 982, Sec. 23."},{"num":"66499.24","text":"Upon the filing of a petition pursuant to this article, any judge of the superior court of the county in which the real property is situated shall make an order directing the clerk of the court to give notice of the filing of the petition. The notice shall be for once a week for a period of not less than five consecutive weeks and shall be given by publication in some newspaper of general circulation within the county, or if there is no newspaper published therein, by posting in three of the principal places in the county; provided, that if such real property or any portion thereof is situated within a city, the notice shall be given by publication in some newspaper of general circulation within the city, or if there is no newspaper published therein, by posting in three of the principal places in the city. Such notice shall contain a statement of the nature of the petition together with a direction that any person may file his written objection to the petition at any time before the expiration of the time of publication or posting. Upon expiration of the time of publication or posting, an affidavit showing such publication or posting shall be filed with the clerk of the court.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.25","text":"The court may, if no objection has been filed, proceed without further notice to hear the petition. If during the hearing the petitioners produce to the court satisfactory evidence of the necessity of the exclusion of the real property, that the owners of two-thirds of the area of the real property sought to be excluded are the petitioners, and that there is no reasonable objection to making such exclusion, the court may proceed to exclude the real property sought to be excluded by the petition, and order the alteration or vacation of the recorded map, and enter its decree accordingly.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.26","text":"If objection is made to the petition which, in the judgment of the court is material, the court shall proceed to hear such objection and may adjourn the proceedings to such time as may be necessary upon proper notice to the petitioners and the objectors.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.27","text":"The exclusion of any real property or the alteration or vacation of any recorded map pursuant to this article shall not affect or vacate the whole or any part of any public street or highway.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.28","text":"A certified copy of the decree of the superior court excluding any real property or ordering the alteration or vacation of any recorded map pursuant to this article shall be recorded in the office of the county recorder of the county in which such real property is situated. The county recorder shall make upon the face of any such recorded map a memorandum stating briefly that such recorded map has been altered or vacated, whichever the case may be, and giving the date and reference of such decree.","history":"Added by Stats. 1974, Ch. 1536."},{"num":"66499.29","text":"At the time a certified copy of the decree of court is recorded, a copy of the new map required by Section 66499.23 shall be filed for record with the county recorder who shall file it in accordance with the provisions of Section 66466. A copy of the new map shall also be filed with the local agency. A reference to this map shall be sufficient identification of the real property for reassessment purposes.","history":"Added by Stats. 1974, Ch. 1536."}]}]},{"heading":"CHAPTER 7. Enforcement and Judicial Review [66499.30 - 66499.38]","articles":[{"heading":"ARTICLE 1. Prohibition and Penalty [66499.30 - 66499.31]","sections":[{"num":"66499.30","text":"(a) No person shall sell, lease, or finance any parcel or parcels of real property or commence construction of any building for sale, lease or financing thereon, except for model homes, or allow occupancy thereof, for which a final map is required by this division or local ordinance, until the final map thereof in full compliance with this division and any local ordinance has been filed for record by the recorder of the county in which any portion of the subdivision is located.\n(b) No person shall sell, lease or finance any parcel or parcels of real property or commence construction of any building for sale, lease or financing thereon, except for model homes, or allow occupancy thereof, for which a parcel map is required by this division or local ordinance, until the parcel map thereof in full compliance with this division and any local ordinance has been filed for record by the recorder of the county in which any portion of the subdivision is located.\n(c) Conveyances of any part of a division of real property for which a final or parcel map is required by this division or local ordinance shall not be made by parcel or block number, initial or other designation, unless and until the final or parcel map has been filed for record by the recorder of the county in which any portion of the subdivision is located.\n(d) Subdivisions (a), (b), and (c) do not apply to any parcel or parcels of a subdivision offered for sale or lease, contracted for sale or lease, or sold or leased in compliance with or exempt from any law (including a local ordinance), regulating the design and improvement of subdivisions in effect at the time the subdivision was established.\n(e) Nothing contained in subdivisions (a) and (b) shall be deemed to prohibit an offer or contract to sell, lease, or finance real property or to construct improvements thereon where the sale, lease, or financing, or the commencement of construction, is expressly conditioned upon the approval and filing of a final subdivision map or parcel map, as required under this division.\n(f) Nothing in subdivisions (a) to (e), inclusive, shall in any way modify or affect Section 11018.2 of the Business and Professions Code.\n(g) For purposes of this section, the limitation period for commencing an action, either civil or criminal, against the subdivider or an owner of record at the time of a violation of this division or of a local ordinance enacted pursuant to this division, shall be tolled for any time period during which there is no constructive notice of the transaction constituting the violation, because the owner of record, at the time of the violation or at any time thereafter, failed to record a deed, lease, or financing document with the county recorder.","history":"Amended by Stats. 1987, Ch. 799, Sec. 1."},{"num":"66499.31","text":"Each violation of this division by a person who is the subdivider or an owner of record, at the time of the violation, of property involved in the violation shall be punishable by imprisonment in the county jail not exceeding one year or in the state prison, by a fine not exceeding ten thousand dollars ($10,000), or by both that fine and imprisonment. Every other violation of this division is a misdemeanor.","history":"Repealed and added by Stats. 1987, Ch. 799, Sec. 3."}]},{"heading":"ARTICLE 2. Remedies [66499.32 - 66499.36]","sections":[{"num":"66499.32","text":"(a) Any deed of conveyance, sale or contract to sell real property which has been divided, or which has resulted from a division, in violation of the provisions of this division, or of the provisions of local ordinances enacted pursuant to this division, is voidable at the sole option of the grantee, buyer or person contracting to purchase, his heirs, personal representative, or trustee in insolvency or bankruptcy within one year after the date of discovery of the violation of the provisions of this division or of local ordinances enacted pursuant to the provisions of this division, but the deed of conveyance, sale or contract to sell is binding upon any successor in interest of the grantee, buyer or person contracting to purchase, other than those above enumerated, and upon the grantor, vendor, or person contracting to sell, or his assignee, heir or devisee.\n(b) Any grantee, or his successor in interest, of real property which has been divided, or which has resulted from a division, in violation of the provisions of this division or of local ordinances enacted pursuant thereto, may, within one year of the date of discovery of such violation, bring an action in the superior court to recover any damages he has suffered by reason of such division of property. The action may be brought against the person who divided the property in violation of the provisions of this division or of local ordinances enacted pursuant thereto and against any successors in interest who have actual or constructive knowledge of such division of property.\nThe provisions of this section shall not apply to the conveyance of any parcel of real property identified in a certificate of compliance filed pursuant to Section 66499.35 or identified in a recorded final map or parcel map, from and after the date of recording.\nThe provisions of this section shall not limit or affect in any way the rights of a grantee or his successor in interest under any other provision of law.","history":"Amended by Stats. 1975, Ch. 24."},{"num":"66499.33","text":"This division does not bar any legal, equitable or summary remedy to which any aggrieved local agency or other public agency, or any person, firm, or corporation may otherwise be entitled, and any such local agency or other public agency, or such person, firm, or corporation may file a suit in the superior court of the county in which any real property attempted to be subdivided or sold, leased, or financed in violation of this division or local ordinance enacted pursuant thereto is located, to restrain or enjoin any attempted or proposed subdivision or sale, lease, or financing in violation of this division or local ordinance enacted pursuant thereto.","history":"Amended by Stats. 1982, Ch. 87, Sec. 29.   Effective March 1, 1982."},{"num":"66499.34","text":"No local agency shall issue any permit or grant any approval necessary to develop any real property which has been divided, or which has resulted from a division, in violation of the provisions of this division or of the provisions of local ordinances enacted pursuant to this division if it finds that development of such real property is contrary to the public health or the public safety. The authority to deny such a permit or such approval shall apply whether the applicant therefor was the owner of record at the time of such violation or whether the applicant therefor is either the current owner of record or a vendee of the current owner of record pursuant to a contract of sale of the real property with, or without, actual or constructive knowledge of the violation at the time of the acquisition of his or her interest in such real property.\nIf a city or a county issues a permit or grants approval for the development of any such real property, it may impose only those conditions that would have been applicable to the division of the property at the time the applicant acquired his or her interest in such real property, and which has been established at such time by this division or local ordinance enacted pursuant thereto, except that where the applicant was the owner of record at the time of the initial violation of the provisions of this division or of local ordinances enacted pursuant thereto who, by a grant of the real property created a parcel or parcels in violation of this division or local ordinances enacted pursuant thereto, and such person is the current owner of record of one or more of the parcels which were created as a result of the grant in violation of the division or local ordinances enacted pursuant thereto, then the local agency may impose such conditions as would be applicable to a current division of the property, and except that if a conditional certificate of compliance has been filed for record under the provisions of subdivision (b) of Section 66499.35, only such conditions stipulated in that certificate shall be applicable.\nThe issuance of a permit or grant of approval for development of real property, or with respect to improvements that have been completed prior to the time a permit or grant of approval for development was required by local ordinances in effect at the time of the improvement, or with respect to improvements that have been completed in reliance upon a permit or grant of approval for development, shall constitute “real property which has been approved for development,” for the purposes of subdivision (c) of Section 66499.35, and upon request by the person owning the real property or a vendee of such person pursuant to a contract of sale, the local agency shall issue a certificate of compliance for the affected real property.","history":"Amended by Stats. 1984, Ch. 864, Sec. 1."},{"num":"66499.35","text":"(a) Any person owning real property or a vendee of that person pursuant to a contract of sale of the real property may request, and a local agency shall determine, whether the real property complies with the provisions of this division and of local ordinances enacted pursuant to this division. If a local agency determines that the real property complies, the city or the county shall cause a certificate of compliance to be filed for record with the recorder of the county in which the real property is located. The certificate of compliance shall identify the real property and shall state that the division of the real property complies with applicable provisions of this division and of local ordinances enacted pursuant to this division. The local agency may impose a reasonable fee to cover the cost of issuing and recording the certificate of compliance.\n(b) If a local agency determines that the real property does not comply with the provisions of this division or of local ordinances enacted pursuant to this division, it shall issue a conditional certificate of compliance. A local agency may, as a condition to granting a conditional certificate of compliance, impose any conditions that would have been applicable to the division of the property at the time the applicant acquired his or her interest therein, and that had been established at that time by this division or local ordinance enacted pursuant to this division, except that where the applicant was the owner of record at the time of the initial violation of the provisions of this division or of the local ordinances who by a grant of the real property created a parcel or parcels in violation of this division or local ordinances enacted pursuant to this division, and the person is the current owner of record of one or more of the parcels which were created as a result of the grant in violation of this division or those local ordinances, then the local agency may impose any conditions that would be applicable to a current division of the property. Upon making the determination and establishing the conditions, the city or county shall cause a conditional certificate of compliance to be filed for record with the recorder of the county in which the real property is located. The certificate shall serve as notice to the property owner or vendee who has applied for the certificate pursuant to this section, a grantee of the property owner, or any subsequent transferee or assignee of the property that the fulfillment and implementation of these conditions shall be required prior to subsequent issuance of a permit or other grant of approval for development of the property.\nCompliance with these conditions shall not be required until the time that a permit or other grant of approval for development of the property is issued by the local agency.\n(c) A certificate of compliance shall be issued for any real property that has been approved for development pursuant to Section 66499.34.\n(d) A recorded final map, parcel map, official map, or an approved certificate of exception shall constitute a certificate of compliance with respect to the parcels of real property described therein.\n(e) An official map prepared pursuant to subdivision (b) of Section 66499.52 shall constitute a certificate of compliance with respect to the parcels of real property described therein and may be filed for record, whether or not the parcels are contiguous, so long as the parcels are within the same section or, with the approval of the city engineer or county surveyor, within contiguous sections of land.\n(f) (1) Each certificate of compliance or conditional certificate of compliance shall include information the local agency deems necessary, including, but not limited to, all of the following:\n(A) Name or names of owners of the parcel.\n(B) Assessor parcel number or numbers of the parcel.\n(C) The number of parcels for which the certificate of compliance or conditional certificate of compliance is being issued and recorded.\n(D) Legal description of the parcel or parcels for which the certificate of compliance or conditional certificate of compliance is being issued and recorded.\n(E) A notice stating as follows:\nThis certificate relates only to issues of compliance or noncompliance with the Subdivision Map Act and local ordinances enacted pursuant thereto. The parcel described herein may be sold, leased, or financed without further compliance with the Subdivision Map Act or any local ordinance enacted pursuant thereto. Development of the parcel may require issuance of a permit or permits, or other grant or grants of approval.\n(F) Any conditions to be fulfilled and implemented prior to subsequent issuance of a permit or other grant of approval for development of the property, as specified in the conditional certificate of compliance.\n(2) Local agencies may process applications for certificates of compliance or conditional certificates of compliance concurrently and may record a single certificate of compliance or a single conditional certificate of compliance for multiple parcels. Where a single certificate of compliance or conditional certificate of compliance is certifying multiple parcels, each as to compliance with the provisions of this division and with local ordinances enacted pursuant thereto, the single certificate of compliance or conditional certificate of compliance shall clearly identify, and distinguish between, the descriptions of each parcel.","history":"Amended by Stats. 2002, Ch. 1109, Sec. 8.   Effective January 1, 2003."},{"num":"66499.36","text":"Whenever a local agency has knowledge that real property has been divided in violation of the provisions of this division or of local ordinances enacted pursuant to this division, it shall cause to be mailed by certified mail to the then current owner of record of the property a notice of intention to record a notice of violation, describing the real property in detail, naming the owners thereof, and stating that an opportunity will be given to the owner to present evidence. The notice shall specify a time, date, and place for a meeting at which the owner may present evidence to the legislative body or advisory agency why the notice should not be recorded. The notice shall also contain a description of the violations and an explanation as to why the subject parcel is not lawful under subdivision (a) or (b) of Section 66412.6.\nThe meeting shall take place no sooner than 30 days and no later than 60 days from date of mailing. If, within 15 days of receipt of the notice, the owner of the real property fails to inform the local agency of his or her objection to recording the notice of violation, the legislative body or advisory agency shall record the notice of violation with the county recorder. If, after the owner has presented evidence, it is determined that there has been no violation, the local agency shall mail a clearance letter to the then current owner of record. If, however, after the owner has presented evidence, the legislative body or advisory agency determines that the property has in fact been illegally divided, the legislative body or advisory agency shall record the notice of violation with the county recorder. The notice of violation, when recorded, shall be deemed to be constructive notice of the violation to all successors in interest in such property. The county recorder shall index the names of the fee owners in the general index.","history":"Amended by Stats. 1984, Ch. 864, Sec. 2."}]},{"heading":"ARTICLE 3. Judicial Review [66499.37 - 66499.38]","sections":[{"num":"66499.37","text":"Any action or proceeding to attack, review, set aside, void, or annul the decision of an advisory agency, appeal board, or legislative body concerning a subdivision, or of any of the proceedings, acts, or determinations taken, done, or made prior to the decision, or to determine the reasonableness, legality, or validity of any condition attached thereto, including, but not limited to, the approval of a tentative map or final map, shall not be maintained by any person unless the action or proceeding is commenced and service of summons effected within 90 days after the date of the decision. Thereafter all persons are barred from any action or proceeding or any defense of invalidity or unreasonableness of the decision or of the proceedings, acts, or determinations. The proceeding shall take precedence over all matters of the calendar of the court except criminal, probate, eminent domain, forcible entry, and unlawful detainer proceedings.","history":"Amended by Stats. 2007, Ch. 612, Sec. 9.   Effective January 1, 2008."},{"num":"66499.38","text":"Any action brought in the superior court relating to this division may be subject to a mediation proceeding conducted pursuant to Chapter 9.3 (commencing with Section 66030) of Division 1.","history":"Added by Stats. 2010, Ch. 699, Sec. 25.   (SB 894)   Effective January 1, 2011."}]}]},{"heading":"CHAPTER 8. The Starter Home Revitalization Act of 2021 [66499.40 - 66499.41]","articles":[{"heading":null,"sections":[{"num":"66499.40","text":"(a) A development proponent may submit an application that allows development of small home lot development, as defined in subdivision (b).\n(b) A small home lot development for purposes of this section is a development that meets all of the following requirements:\n(1) The proposed development is located on a lot zoned for multifamily residential development that is no larger than five acres and is substantially surrounded by qualified urban uses.\n(2) The development proponent proposes to construct single-family housing units on fee simple ownership lots.\n(3) The proposed development will, pursuant to the requirements of this division,\nmeet one of the following, as applicable:\n(A) If the parcel is identified in the jurisdiction’s housing element pursuant to Section 65583.2, the development will result in at least as many units as projected for that parcel in the housing element.\n(B) If the parcel is not identified in the jurisdiction’s housing element, the development will result in at least as many units as the maximum allowable residential density, unless the zoning for the site allows for midrange density.\n(C) If midrange density is specified for the site, the development will result in at least as many units as are allowed under the midrange density standard.\n(4) The residential properties within a radius of 500 feet of the site are zoned to have an allowable residential density of less than 30 dwelling units per acre.\n(5) The site complies with the external existing site front, side, and rear setback requirements.\n(6) The proposed units comply with existing height limits, if applicable.\n(7) The jurisdiction has adopted a housing element for the current planning period that is in substantial compliance with Article 10.6 (commencing with Section 65580) of Chapter 3 of Division 1.\n(8) The proposed site is not identified in the housing element\npursuant to Sections 65583 and 65583.2 as a site to accommodate any portion of the jurisdiction’s regional housing need for low-income or very low income households.\n(9) The average total area of floorspace for the proposed units does not exceed 1,750 net habitable square feet.\n(10) The development complies with any local inclusionary housing ordinances adopted by the local agency, if applicable.\n(11) The development of a housing development project on the proposed site to be subdivided does not require the demolition or alteration of any of the following types of housing:\n(A) Housing that is subject to a recorded covenant, ordinance, or law that restricts rent to levels affordable to persons and families of moderate, low, or very low income.\n(B) Housing that is subject to any form of rent or price control through a public entity’s valid exercise of its police power.\n(C) Housing occupied by tenants within the seven years preceding the date of the application, including housing that has been demolished or that tenants have vacated prior to the submission of the application for a development permit.\n(D) A parcel on which an owner of residential real property has exercised the owner’s rights under Chapter 12.75 (commencing with Section 7060) of Division 7 of Title 1 to withdraw accommodations from rent or lease within 15 years before the date that the development proponent submits an application.\n(c) (1) Except as provided in paragraph (2), the local agency may impose conditions upon a small lot development in accordance with this division that are not in conflict with this section.\n(2) A local agency shall not impose any of the following requirements on a small home lot development:\n(A) A setback requirement between the units, except as required in the California Building Code (Title\n24 of the California Code of Regulations).\n(B) A minimum requirement on the size of an individual small home lot created by the development.\n(C) A requirement\nthat parking be enclosed or covered.\n(D) The formation of a homeowners’ association.\n(3) A local agency may condition the approval and recordation of a small lot development upon issuance of a certificate of occupancy or final inspection for all units in the small lot development.\n(d) A local agency may amend its zoning ordinances or general plan to incorporate the policies, procedures, or\nother provisions applicable to the creation of a small home lot development if the provisions are\nnot in conflict with the requirements of this section. A local agency may adopt policies, procedures, or other provisions applicable to the creation of a small home lot development that allow for the creation of more housing units than allowed by the requirements of this section.\n(e) For purposes of this section:\n(1) “Maximum allowable residential density” means the density allowed under the zoning\nordinance,\nor, if a range of density is permitted, means the maximum allowable density for the specific zoning range applicable to the multifamily site. If the density allowed under the zoning ordinance is inconsistent with the density allowed under the land use element of the general plan, the general plan density shall prevail.\n(2) “Local inclusionary housing ordinance” means a mandatory requirement, as a condition of the development of residential units, that the development include a certain percentage of residential units affordable to, and occupied by, households with incomes that do not exceed the limits for extremely low, very low, lower, low-, or moderate-income households specified in Sections 50079.5, 50093, 50105, and 50106 of the Health and Safety Code. The ordinance may provide alternative means of\ncompliance that may include, but are not limited to, in-lieu fees, land dedication, offsite construction, or acquisition and rehabilitation of existing units.\n(3) “Qualified urban use” has the same meaning as defined in Section 21072 of the Public Resources Code.\n(4) “Site” means the proposed location for the small home lot development before it is subdivided into parcels for the small home lot development.\n(5) “Substantially surrounded” has the same meaning as defined in paragraph (2) of subdivision (a) of Section 21159.25 of the Public Resources Code.\n(6) “Unit” means a single-family housing unit constructed pursuant to this section.\n(f) The requirements set forth in this section are in\naddition to, and not an exception from, the requirements set forth in Section 65863.\n(g) A city, county, or city and county shall approve an application for a small home lot development unless it makes one of the following findings:\n(1) The small lot development does not meet the requirements of this section.\n(2) The small lot development does not comply with all requirements of this division that are not in conflict with this section.\n(3) The small lot development does not comply with all local general plan, zoning, subdivision, and design standards that do not conflict with this section.\n(4) The small lot\ndevelopment would have a specific, adverse impact upon the public health or safety, and there is no feasible method to satisfactorily mitigate or avoid the specific adverse impact without rendering the small lot development financially infeasible. As used in this paragraph, a “specific, adverse impact” means a significant, quantifiable, direct, and unavoidable impact, based on objective, identified written public health or safety standards, policies, or conditions as they existed on the date the application was deemed complete.","history":"Added by Stats. 2021, Ch. 154, Sec. 2.   (AB 803)   Effective January 1, 2022."},{"num":"66499.41","text":"(a) A local agency shall ministerially consider, without discretionary review or a hearing, a parcel map or a tentative and final map for a housing development project that meets all of the following requirements:\n(1) (A) The proposed subdivision will result in 10 or fewer parcels and the housing development project on the lot proposed to be subdivided will contain 10 or fewer residential units, except as provided in subdivision (g).\n(B) The proposed subdivision may designate a remainder parcel, as defined under Section 66424.6, that retains existing land uses or structures, does not contain any new residential units, and is not exclusively dedicated to serving the housing\ndevelopment project. The remainder parcel shall not be counted against the 10-parcel maximum permitted under subparagraph (A).\n(2) The lot proposed to be subdivided meets all of the following sets of requirements:\n(A) The lot is one of the following:\n(i) Zoned to allow multifamily residential dwelling use.\n(ii) Vacant and zoned for single-family residential development. For purposes of this paragraph, “vacant” means having no permanent structure, unless the permanent structure is abandoned and uninhabitable. All of the following types of housing shall not be defined as “vacant:”\n(I) Housing that is subject to a recorded covenant, ordinance, or law that restricts rent or sales price to\nlevels affordable to persons and families of low, very low, or extremely low income.\n(II) Housing that is subject to any form of rent or sales price control through a local public entity’s valid exercise of its police power.\n(III) Housing occupied by tenants within the five years preceding the date of the application, including housing that has been demolished or that tenants have vacated prior to the submission of the application for a development permit.\n(B) (i) A lot zoned to allow multifamily residential dwelling use is no larger than five acres and is substantially surrounded by qualified urban uses.\n(ii) A vacant lot zoned for single-family residential development is no larger than one and one-half acres and is substantially\nsurrounded by qualified urban uses.\n(iii) For purposes of this subparagraph, the following definitions apply:\n(I) “Qualified urban use” has the same meaning as defined in Section 21072 of the Public Resources Code.\n(II) “Substantially surrounded” has the same meaning as defined in paragraph (2) of subdivision (a) of Section 21159.25 of the Public Resources Code.\n(C) The lot is a legal parcel located within one of the following:\n(i) An incorporated city, the boundaries of which include some portion of an urbanized area.\n(ii) An urbanized area or urban cluster in a county with a population greater than 600,000 based on the most\nrecent United States Census Bureau data.\n(iii) For purposes of this subparagraph, the following definitions apply:\n(I) “Urbanized area” means an urbanized area designated by the United States Census Bureau, as published in the Federal Register, Volume 77, Number 59, on March 27, 2012.\n(II) “Urban cluster” means an urban cluster designated by the United States Census Bureau, as published in the Federal Register, Volume 77, Number 59, on March 27, 2012.\n(D) The lot was not established pursuant to this section, including a designated remainder parcel described in subparagraph (B) of paragraph (1), or Section 66411.7.\n(3) (A) Except as specified in subparagraphs (B) and\n(C), the newly created parcels are no smaller than 600 square feet.\n(B) If the parcels are zoned for single-family residential use, the newly created parcels are no smaller than 1,200 square feet.\n(C) A local agency may, by ordinance, adopt a smaller minimum parcel size subject to ministerial approval under this subdivision.\n(4) The housing units on the lot proposed to be subdivided are one of the following:\n(A) Constructed on fee simple ownership lots.\n(B) Part of a common interest development.\n(C) Part of a housing cooperative, as defined in Section 817 of the Civil Code.\n(D) Constructed on land owned by a community land trust. For the purpose of this subparagraph, “community land trust” means a nonprofit corporation organized pursuant to Section 501(c)(3) of the Internal Revenue Code that satisfies all of the following:\n(i) Has as its primary purposes the creation and maintenance of permanently affordable single-family or multifamily residences.\n(ii) All dwellings and units located on the land owned by the nonprofit corporation are sold to qualified owners to be occupied as the qualified owner’s primary residence or rented to persons and families of low or moderate income. For the purpose of this subparagraph, “qualified owner” means a person or family of low or moderate income, including a person or family of low or moderate income who owns a dwelling or unit collectively as a member occupant or resident shareholder of a\nlimited-equity housing cooperative.\n(iii) The land owned by the nonprofit corporation, on which a dwelling or unit sold to a qualified owner is situated, is leased by the nonprofit corporation to the qualified owner for the convenient occupation and use of that dwelling or unit for a renewable term of 99 years.\n(E) Part of a tenancy in common, as described in Section 685 of the Civil Code.\n(5) The proposed housing development project will, pursuant to the requirements of this division, meet one of the following, as applicable:\n(A) If the parcel is identified in the jurisdiction’s housing element for the current planning period that is in substantial compliance with Article 10.6 (commencing with Section 65580) of Chapter 3 of Division 1, the housing\ndevelopment project will result in at least as many units as projected for that parcel in the housing element. If the parcel is identified to accommodate any portion of the jurisdiction’s share of the regional housing need for low-inc
