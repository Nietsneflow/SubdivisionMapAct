<script>
const DATA = __DATA_JSON__;

/* ---------- Build flat section list & render ---------- */
const SECS = [];
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const officialUrl = n =>
  "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=" + n + ".";

function firstWords(text, max) {
  let s = text.split("\n")[0];
  if (s.length <= max) return s;
  s = s.slice(0, max);
  return s.slice(0, s.lastIndexOf(" ")) + "…";
}

(function render() {
  document.getElementById("doc-cite").textContent = DATA.citation;
  document.getElementById("doc-src").innerHTML =
    'Text mirrored verbatim from the <a href="' + DATA.source +
    '" target="_blank" rel="noopener">official Legislative Information site</a>, retrieved ' +
    DATA.scraped + '. Each section links to its official page.';

  let toc = "", body = "";
  DATA.chapters.forEach((ch, ci) => {
    const chId = "ch" + ci;
    toc += '<details class="chap"' + (ci === 0 ? " open" : "") +
           '><summary><span class="tw">&#9654;</span><span>' +
           escHtml(ch.heading) + "</span></summary>";
    body += '<h2 class="chap-h" id="' + chId + '">' + escHtml(ch.heading) + "</h2>";
    ch.articles.forEach(art => {
      if (art.heading) {
        toc += '<details class="art" open><summary><span class="tw">&#9654;</span><span>' +
               escHtml(art.heading.replace(/\s*\[.*\]$/, "")) + "</span></summary>";
        body += '<h3 class="art-h">' + escHtml(art.heading) + "</h3>";
      }
      art.sections.forEach(sec => {
        const id = "sec-" + sec.num;
        toc += '<a class="toc-sec" href="#' + id + '"><span class="n">' + sec.num +
               '</span><span class="t">' + escHtml(firstWords(sec.text, 60)) + "</span></a>";
        const paras = sec.text.split("\n").map(p => "<p>" + escHtml(p) + "</p>").join("");
        body +=
          '<article class="sec" id="' + id + '">' +
          '<div class="sec-head"><h4 class="sec-num"><a href="#' + id + '">&sect; ' + sec.num + "</a></h4>" +
          '<div class="sec-tools">' +
          '<button data-copy="' + sec.num + '">Copy text</button>' +
          '<a href="' + officialUrl(sec.num) + '" target="_blank" rel="noopener">Official text &#8599;</a>' +
          "</div></div>" +
          '<div class="sec-body">' + paras + "</div>" +
          '<p class="sec-hist">(' + escHtml(sec.history) + ")</p>" +
          "</article>";
        SECS.push({
          num: sec.num,
          text: sec.text,
          lower: (sec.num + " " + sec.text).toLowerCase(),
          chap: ch.heading,
          art: art.heading,
        });
      });
      if (art.heading) toc += "</details>";
    });
    toc += "</details>";
  });
  document.getElementById("toc").innerHTML = toc;
  document.getElementById("doc-body").innerHTML = body;
})();

/* ---------- Query parsing & search ---------- */
function parseQuery(q) {
  const tokens = [];
  const re = /"([^"]+)"|(\S+)/g;
  let m;
  while ((m = re.exec(q)) !== null) {
    const t = (m[1] || m[2]).toLowerCase();
    if (t.length > 0) tokens.push(t);
  }
  return tokens;
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const tokensRegex = tokens =>
  new RegExp(tokens.map(escRe).join("|"), "gi");

function search(tokens) {
  return SECS.filter(s => tokens.every(t => s.lower.includes(t)));
}

function countHits(sec, tokens) {
  let n = 0;
  for (const t of tokens) {
    let i = -1;
    while ((i = sec.lower.indexOf(t, i + 1)) !== -1) n++;
  }
  return n;
}

function snippets(sec, tokens, maxSnips) {
  const lower = sec.text.toLowerCase();
  const spots = [];
  for (const t of tokens) {
    const i = lower.indexOf(t);
    if (i !== -1) spots.push(i);
  }
  spots.sort((a, b) => a - b);
  const out = [];
  let lastEnd = -1;
  for (const i of spots) {
    if (out.length >= maxSnips) break;
    if (i < lastEnd) continue;
    const start = Math.max(0, i - 70);
    const end = Math.min(sec.text.length, i + 120);
    lastEnd = end;
    let frag = sec.text.slice(start, end).replace(/\n/g, " ");
    frag = (start > 0 ? "…" : "") + frag + (end < sec.text.length ? "…" : "");
    out.push(escHtml(frag).replace(tokensRegex(tokens), m => "<b><mark>" + m + "</mark></b>"));
  }
  return out;
}

/* ---------- Views ---------- */
const $ = id => document.getElementById(id);
const readerEl = $("reader"), resultsEl = $("results"),
      matchbar = $("matchbar"), qEl = $("q");
let curTokens = [], marks = [], curMark = -1;

function showResults(tokens) {
  clearMarks();
  matchbar.classList.remove("on");
  const hits = search(tokens);
  let html = "";
  if (hits.length === 0) {
    html = '<div class="noresults">No sections match ' +
      tokens.map(t => "<b>" + escHtml(t) + "</b>").join(" + ") +
      ".<br/>Try fewer or shorter words &mdash; the search finds sections containing <i>all</i> terms.</div>";
  } else {
    html = '<p class="res-meta">' + hits.length + " of " + SECS.length +
           " sections contain " + tokens.map(t => "<b>" + escHtml(t) + "</b>").join(" + ") +
           " &middot; in statute order</p>";
    let lastChap = null;
    for (const s of hits) {
      if (s.chap !== lastChap) {
        lastChap = s.chap;
        html += '<div class="res-chap">' + escHtml(s.chap) + "</div>";
      }
      html += '<button class="res" data-num="' + s.num + '"><span class="rn">&sect; ' + s.num +
              '</span><span class="rc">' + countHits(s, tokens) + " match" +
              (countHits(s, tokens) === 1 ? "" : "es") +
              (s.art ? " &middot; " + escHtml(s.art.replace(/\s*\[.*\]$/, "")) : "") + "</span>" +
              snippets(s, tokens, 2).map(x => '<div class="snip">' + x + "</div>").join("") +
              "</button>";
    }
  }
  resultsEl.innerHTML = html;
  document.body.classList.add("searching", "results-open");
}

function closeSearch() {
  document.body.classList.remove("searching", "results-open");
  resultsEl.innerHTML = "";
}

/* ---------- In-document highlighting ---------- */
function clearMarks() {
  for (const m of marks) {
    const parent = m.parentNode;
    if (!parent) continue;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  }
  marks = [];
  curMark = -1;
}

function highlightDoc(tokens) {
  clearMarks();
  const re = tokensRegex(tokens);
  const walker = document.createTreeWalker($("doc-body"), NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue;
    re.lastIndex = 0;
    if (!re.test(text)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mk = document.createElement("mark");
      mk.textContent = m[0];
      frag.appendChild(mk);
      marks.push(mk);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  $("matchcount").textContent = marks.length + " match" + (marks.length === 1 ? "" : "es");
  matchbar.classList.toggle("on", marks.length > 0);
}

function gotoMark(i) {
  if (marks.length === 0) return;
  if (curMark >= 0) marks[curMark].classList.remove("cur");
  curMark = ((i % marks.length) + marks.length) % marks.length;
  const mk = marks[curMark];
  mk.classList.add("cur");
  mk.scrollIntoView({ block: "center", behavior: "smooth" });
  $("matchcount").textContent = (curMark + 1) + " / " + marks.length + " matches";
}

function jumpToSection(num, withHighlights) {
  document.body.classList.remove("results-open");
  const prev = resultsEl.querySelector(".res.active");
  if (prev) prev.classList.remove("active");
  const cur = resultsEl.querySelector('.res[data-num="' + num + '"]');
  if (cur) cur.classList.add("active");
  if (withHighlights && curTokens.length > 0) highlightDoc(curTokens);
  const el = $("sec-" + num);
  if (!el) return;
  history.replaceState(null, "", "#sec-" + num);
  el.scrollIntoView({ block: "start" });
  el.classList.remove("flash");
  requestAnimationFrame(() => el.classList.add("flash"));
  if (marks.length > 0) {
    const idx = marks.findIndex(m => el.contains(m));
    if (idx !== -1) gotoMark(idx);
  }
}

/* ---------- Events ---------- */
let debounce = null;
qEl.addEventListener("input", () => {
  $("clear-q").style.display = qEl.value ? "block" : "none";
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    const q = qEl.value.trim();
    if (q.length < 2) {
      curTokens = [];
      clearMarks();
      matchbar.classList.remove("on");
      closeSearch();
      return;
    }
    curTokens = parseQuery(q);
    if (/^\d{5}(\.\d+)?$/.test(q) && $("sec-" + q)) {
      closeSearch();
      jumpToSection(q, false);
      return;
    }
    showResults(curTokens);
  }, 160);
});
qEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && marks.length > 0) {
    gotoMark(curMark + (e.shiftKey ? -1 : 1));
  }
  if (e.key === "Escape") {
    qEl.value = "";
    qEl.dispatchEvent(new Event("input"));
    qEl.blur();
  }
});
/* Re-open the results panel when returning to the search box with an
   active query (matters on narrow screens where picking a result hides it) */
qEl.addEventListener("focus", () => {
  if (curTokens.length > 0 && document.body.classList.contains("searching")) {
    document.body.classList.add("results-open");
  }
});

/* Quick eased scroll (fixed duration regardless of distance) */
function quickScrollTo(el) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.scrollIntoView({ block: "start" });
    return;
  }
  const target = el.getBoundingClientRect().top + window.scrollY - 80;
  const start = window.scrollY, dist = target - start, dur = 220;
  let t0 = null;
  function step(ts) {
    if (t0 === null) t0 = ts;
    const p = Math.min(1, (ts - t0) / dur);
    window.scrollTo(0, start + dist * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* Smooth scroll + flash for table-of-contents clicks */
$("toc").addEventListener("click", e => {
  const link = e.target.closest(".toc-sec");
  if (!link) return;
  e.preventDefault();
  const id = link.getAttribute("href").slice(1);
  const el = $(id);
  if (!el) return;
  history.replaceState(null, "", "#" + id);
  quickScrollTo(el);
  el.classList.remove("flash");
  requestAnimationFrame(() => el.classList.add("flash"));
});

$("clear-q").addEventListener("click", () => {
  qEl.value = "";
  qEl.dispatchEvent(new Event("input"));
  qEl.focus();
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qEl &&
      !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault();
    qEl.focus();
    qEl.select();
  }
});

resultsEl.addEventListener("click", e => {
  const btn = e.target.closest(".res");
  if (btn) jumpToSection(btn.dataset.num, true);
});
$("m-next").addEventListener("click", () => gotoMark(curMark + 1));
$("m-prev").addEventListener("click", () => gotoMark(curMark - 1));
$("m-back").addEventListener("click", () => {
  if (curTokens.length) document.body.classList.add("results-open");
});
$("m-clear").addEventListener("click", () => {
  qEl.value = "";
  qEl.dispatchEvent(new Event("input"));
});

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const sec = SECS.find(s => s.num === btn.dataset.copy);
  if (!sec) return;
  navigator.clipboard.writeText("Cal. Gov. Code § " + sec.num + ".\n\n" + sec.text).then(() => {
    const t = $("toast");
    t.textContent = "Copied § " + sec.num + " to clipboard";
    t.classList.add("on");
    setTimeout(() => t.classList.remove("on"), 1600);
  });
});

/* Sidebar (mobile) */
const sidebar = $("sidebar"), scrim = $("scrim");
$("menu-btn").addEventListener("click", () => {
  sidebar.classList.add("open");
  scrim.classList.add("on");
});
scrim.addEventListener("click", () => {
  sidebar.classList.remove("open");
  scrim.classList.remove("on");
});
sidebar.addEventListener("click", e => {
  if (e.target.closest(".toc-sec")) {
    sidebar.classList.remove("open");
    scrim.classList.remove("on");
  }
});

/* Staleness notice: California statute amendments take effect January 1
   (rare urgency bills aside), so warn once a Jan 1 has passed since retrieval. */
(function () {
  const scraped = new Date(DATA.scraped + "T00:00:00");
  if (isNaN(scraped)) return;
  const cutoff = new Date(scraped.getFullYear() + 1, 0, 1);
  if (new Date() < cutoff) return;
  const b = $("stale-banner");
  b.innerHTML = "&#9888; This copy of the Act was retrieved <b>" + DATA.scraped +
    "</b>. Amendments effective January 1, " + cutoff.getFullYear() +
    (new Date().getFullYear() > cutoff.getFullYear() ? " and later" : "") +
    " are not reflected here. For recent changes, check the " +
    '<a href="' + DATA.source + '" target="_blank" rel="noopener">official current text</a>' +
    " &mdash; or ask for this page to be refreshed from the source.";
  b.classList.add("on");
})();

/* Deep link on load */
if (location.hash.startsWith("#sec-")) {
  const el = $(location.hash.slice(1));
  if (el) requestAnimationFrame(() => el.scrollIntoView({ block: "start" }));
}
</script>
